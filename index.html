    html += '<div style="margin-bottom:8px"><div class="baris" style="font-size:.82rem">' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;' +
      'background:' + POKOK_WARNA[st] + ';margin-right:6px"></span>' +
      esc(POKOK_LABEL[st]) + '</span>' +
      '<b class="kanan">' + n + ' pokok · ' + persen + '%</b></div>' +
      '<div class="batang"><i style="width:' + persen + '%;background:' +
      POKOK_WARNA[st] + '"></i></div></div>';
  }
  html += '</div>';

  /* Produksi */
  html += '<div class="kartu"><h3>Produksi</h3><div class="kisi kisi2">' +
    barisInfo('Produksi 12 bulan', rp(r.produksi12BulanKg) + ' kg') +
    barisInfo('Produksi seluruh riwayat', rp(r.produksiTotalKg) + ' kg') +
    barisInfo('Produksi per hektare', rp(r.produksiPerHa12Bulan) + ' kg/ha') +
    barisInfo('Pokok yang sudah berproduksi', r.pokokBerproduksi + ' dari ' + r.hidup) +
    barisInfo('Luas petak', r.luasHa + ' ha') +
    barisInfo('Umur tanaman', r.umurHari !== null
      ? Math.floor(r.umurHari / 365) + ' tahun ' + (r.umurHari % 365) + ' hari' : '-') +
    '</div>';

  if (r.pokokBerproduksi === 0) {
    html += '<div class="spanduk biru"><span>ℹ️</span><span>Belum ada catatan panen per ' +
      'pokok. Angka produksi baru muncul setelah panen dicatat per pohon — buka sub-tab ' +
      '<b>Sensus &amp; Panen</b>.</span></div>';
  }
  html += '</div>';

  /* Pokok tertinggal — inti nilai fitur ini */
  if (r.tertinggal && r.tertinggal.length) {
    html += '<div class="kartu"><h3>📉 Pokok tertinggal (' + r.jumlahTertinggal + ')</h3>' +
      '<p style="font-size:.82rem;color:var(--redup)">Sudah pernah berbuah, tetapi hasil ' +
      '12 bulan terakhirnya kurang dari separuh rerata kebun (' +
      r.rerataKgPerPokok12Bulan + ' kg). Periksa di lapangan sebelum memutuskan ' +
      'bongkar atau perbaiki perawatannya.</p>';
    for (var j = 0; j < r.tertinggal.length; j++) {
      var t = r.tertinggal[j];
      html += '<div class="item"><div class="ikon">🪵</div><div class="isi">' +
        '<b>' + esc(t.kode) + '</b><small>Baris ' + t.baris + ' · pokok ke-' + t.kolom +
        '</small><small>Seluruh riwayat ' + rp(t.kgTotal) + ' kg</small></div>' +
        '<div class="nilai"><b style="color:var(--bahaya)">' + t.kg12Bulan + ' kg</b><br>' +
        '<small style="color:var(--redup)">12 bulan</small><br>' +
        '<button class="tbl sekunder kecil takCetak" style="margin-top:4px" ' +
        'onclick="detailPokok(\'' + jsq(t.id) + '\')">Lihat</button></div></div>';
    }
    html += '</div>';
  }

  if (r.terbaik && r.terbaik.length && r.terbaik[0].kg12Bulan > 0) {
    html += '<div class="kartu"><h3>🏆 Pokok terbaik</h3>' +
      '<p style="font-size:.82rem;color:var(--redup)">Berguna untuk memilih pohon induk ' +
      'saat mengambil bibit atau entres.</p>';
    for (var k = 0; k < r.terbaik.length; k++) {
      var b = r.terbaik[k];
      if (!b.kg12Bulan) continue;
      html += '<div class="item"><div class="ikon">' + (k + 1) + '</div><div class="isi">' +
        '<b>' + esc(b.kode) + '</b><small>Baris ' + b.baris + ' · pokok ke-' + b.kolom +
        '</small></div><div class="nilai"><b style="color:var(--sukses)">' +
        b.kg12Bulan + ' kg</b><br><button class="tbl sekunder kecil takCetak" ' +
        'onclick="detailPokok(\'' + jsq(b.id) + '\')">Lihat</button></div></div>';
    }
    html += '</div>';
  }

  /* Saran sulam */
  if (r.perluSulam > 0) {
    var persenMati = r.total ? Math.round(r.perluSulam / r.total * 100) : 0;
    html += '<div class="spanduk ' + (persenMati > 10 ? 'merah' : 'kuning') + '">' +
      '<span>🌱</span><span><b>' + r.perluSulam + ' titik perlu disulam (' +
      persenMati + '% dari populasi)</b>' +
      (persenMati > 10
        ? 'Angka di atas 10% biasanya menandakan persoalan yang berulang — drainase, ' +
          'penyakit tular tanah, atau mutu bibit — bukan kematian yang kebetulan. ' +
          'Periksa sebarannya di Peta Pokok: bila mengelompok di satu sudut, sebabnya ' +
          'hampir pasti keadaan lahan di sudut itu.'
        : 'Kematian di bawah 10% masih wajar. Sulam pada awal musim hujan agar bibit ' +
          'baru tidak perlu disiram.') + '</span></div>';
  }

  if (bolehUbah()) {
    html += '<div class="kartu takCetak"><h3>Tindakan</h3><div class="tumpuk">' +
      '<button class="tbl lebar" onclick="subPindah(\'pokok\',\'sensus\')">' +
      '📋 Catat sensus atau panen</button>' +
      '<button class="tbl sekunder lebar" onclick="unduhPokokGeojson()">' +
      '⬇️ Ekspor titik pokok (GeoJSON untuk QField)</button>' +
      '<button class="tbl sekunder lebar" onclick="formPokok(\'' + jsq(petak.id) +
      '\')">➕ Tambah pokok</button>' +
      (bolehKelola()
        ? '<button class="tbl bahaya lebar" onclick="hapusSeluruhPokok(\'' +
          jsq(petak.id) + '\')">🗑️ Hapus seluruh pokok petak ini</button>' : '') +
      '</div></div>';
  }
  return html;
}

/* ------------------------------------------------------------

function bagianPokokDaftar(petak) {
  var saring = S.filter.pokokStatus || '';
  var cari = String(S.filter.pokokCari || '').toLowerCase();

  var daftar = _pokok.daftar.filter(function (p) {
    if (saring && String(p.status) !== saring) return false;
    if (cari && String(p.kode).toLowerCase().indexOf(cari) < 0) return false;
    return true;
  });

  var opsiStatus = '<option value="">Semua kondisi</option>';
  for (var st in POKOK_LABEL) {
    opsiStatus += '<option value="' + st + '"' + (st === saring ? ' selected' : '') + '>' +
      esc(POKOK_LABEL[st]) + '</option>';
  }

  var html = '<div class="kartu takCetak"><div class="baris">' +
    '<label class="ruas" style="flex:1;min-width:140px;margin:0">' +
    '<span class="nama">Kondisi</span>' +
    '<select onchange="S.filter.pokokStatus=this.value;render()">' + opsiStatus +
    '</select></label>' +
    '<label class="ruas" style="flex:1;min-width:140px;margin:0">' +
    '<span class="nama">Cari kode</span>' +
    bungkusKosongkan(
      '<input type="text" value="' + esc(S.filter.pokokCari || '') + '" ' +
      'enterkeyhint="search" placeholder="mis. B02" ' +
      'oninput="S.filter.pokokCari=this.value;tundaRender()">',
      S.filter.pokokCari || '') +
    '</label></div></div>';

  html += '<div class="kartu"><div class="baris" style="margin-bottom:6px">' +
    '<h3 style="margin:0">🌳 ' + daftar.length + ' pokok</h3>' +
    (bolehUbah() ? '<button class="tbl kecil kanan" onclick="formPokok(\'' +
      jsq(petak.id) + '\')">+ Pokok</button>' : '') + '</div>';

  if (!daftar.length) {
    html += '<div class="kosong"><span class="ik">🔍</span>Tidak ada pokok yang cocok ' +
      'dengan saringan ini.</div>';
    return html + '</div>';
  }

  /* Dikelompokkan per baris tanam, karena begitulah orang berjalan
     di kebun — bukan sebagai satu daftar panjang tanpa jeda. */
  var barisSekarang = null;
  html += '<div class="gulir" style="max-height:none">';
  for (var i = 0; i < daftar.length; i++) {
    var p = daftar[i];
    if (String(p.baris) !== String(barisSekarang)) {
      barisSekarang = p.baris;
      html += '<div style="margin:12px 0 4px;font-size:.75rem;font-weight:800;' +
        'color:var(--redup);letter-spacing:.06em">BARIS ' + esc(p.baris) + '</div>';
    }
    var warna = POKOK_WARNA[p.status] || POKOK_WARNA.produktif;
    html += '<div class="item" style="cursor:pointer" onclick="detailPokok(\'' +
      jsq(p.id) + '\')">' +
      '<div class="ikon" style="background:' + warna + '22;color:' + warna + '">🌳</div>' +
      '<div class="isi"><b>' + esc(p.kode) + '</b>' +
      '<small>Pokok ke-' + esc(p.kolom) + ' pada baris ' + esc(p.baris) +
      (p.varietas ? ' · ' + esc(p.varietas) : '') + '</small>' +
      (angka(p.produksiTotalKg)
        ? '<small>' + rp(p.produksi12BulanKg) + ' kg (12 bulan) · ' +
          rp(p.produksiTotalKg) + ' kg seluruhnya · ' + angka(p.jumlahPanen) +
          ' kali panen</small>'
        : '<small style="color:var(--redup)">Belum ada catatan panen</small>') +
      (p.status === 'mati' && p.sebabMati
        ? '<small style="color:var(--bahaya)">Sebab: ' + esc(p.sebabMati) + '</small>' : '') +
      '</div><div class="nilai">' +
      '<span class="lencana" style="background:' + warna + '22;color:' + warna + '">' +
      esc(POKOK_LABEL[p.status] || p.status) + '</span></div></div>';
  }
  html += '</div></div>';
  return html;
}

var _tundaRender = null;
/** Menunda penggambaran ulang agar mengetik di kotak cari tidak tersendat. */
function tundaRender() {
  if (_tundaRender) clearTimeout(_tundaRender);
  _tundaRender = setTimeout(function () { render(); }, 350);
}

/* ------------------------------------------------------------
   PETA POKOK
   ------------------------------------------------------------ */

function bagianPokokPeta(petak) {
  _perluRenderPetaPokok = true;
  var r = _pokok.ringkasan || {};

  var html = '<div class="kartu"><h3>🗺️ Sebaran Pokok</h3>' +
    '<div id="petaPokok" class="peta"></div>' +
    '<div class="baris" style="margin-top:8px;flex-wrap:wrap;font-size:.75rem">';
  for (var st in POKOK_LABEL) {
    var n = angka((r.status || {})[st]);
    if (!n) continue;
    html += '<span style="display:flex;align-items:center;gap:5px">' +
      '<span style="width:11px;height:11px;border-radius:50%;background:' +
      POKOK_WARNA[st] + ';display:inline-block"></span>' +
      esc(POKOK_LABEL[st]) + ' (' + n + ')</span>';
  }
  html += '</div>' +
    '<p style="font-size:.8rem;color:var(--redup);margin-top:8px">Tekan satu titik ' +
    'untuk membuka riwayat pokok itu. Bila titik merah mengelompok di satu sudut, ' +
    'sebabnya hampir pasti keadaan lahan di sudut tersebut — bukan kebetulan.</p>' +
    '</div>';
  return html;
}

var _perluRenderPetaPokok = false;
var _petaPokok = null;

function gambarPetaPokok() {
  var wadah = $('petaPokok');
  if (!wadah) return;
  if (!adaLeaflet()) {
    wadah.innerHTML = '<div class="kosong"><span class="ik">🗺️</span>' +
      'Pustaka peta tidak tersedia.</div>';
    return;
  }

  if (_petaPokok) {
    try { _petaPokok.remove(); } catch (e) {}
    _petaPokok = null;
  }

  var petak = petakById(_pokok.petakId);
  var titik = (petak && petak.koordinat) || [];
  var pusat = titik.length ? [angka(petak.pusatLat), angka(petak.pusatLng)] : pusatPeta();

  try {
    _petaPokok = L.map('petaPokok', { center: pusat, zoom: 17, maxZoom: 22, zoomSnap: 0.5 });
  } catch (e) { return; }

  var ubin = urlUbin();
  if (ubin && ubin.wms) {
    var w = uraiWms(ubin.url);
    L.tileLayer.wms(w.dasar, { layers: ubin.lapisan || w.lapisan, format: 'image/png',
                               attribution: ubin.atribusi || '' }).addTo(_petaPokok);
  } else if (ubin && ubin.url) {
    L.tileLayer(ubin.url, { maxZoom: 22, maxNativeZoom: 19,
                            attribution: ubin.atribusi || '' }).addTo(_petaPokok);
  } else {
    wadah.classList.add('kisiPeta');
    _petaPokok.attributionControl.addAttribution('Kisi lokal — tanpa layanan peta luar');
  }

  if (titik.length >= 3) {
    // Gaya batas mengikuti setelan petak, tetapi isinya dibuat jauh lebih
    // pudar: di peta ini yang harus menonjol adalah titik pokoknya, bukan
    // bidang petaknya.
    var gaya = gayaPetak(petak);
    L.polygon(titik, {
      color: gaya.color, weight: gaya.weight,
      fillColor: gaya.fillColor, fillOpacity: Math.min(gaya.fillOpacity, 0.08)
    }).addTo(_petaPokok);
  }

  var batas = [];
  for (var i = 0; i < _pokok.daftar.length; i++) {
    var p = _pokok.daftar[i];
    var lat = angka(p.lat), lng = angka(p.lng);
    if (!lat || !lng) continue;
    batas.push([lat, lng]);
    var warna = POKOK_WARNA[p.status] || POKOK_WARNA.produktif;
    var m = L.circleMarker([lat, lng], {
      radius: 6, color: '#fff', weight: 1.5, fillColor: warna, fillOpacity: 0.95
    }).addTo(_petaPokok);
    m.bindPopup(popupPokok(p), { maxWidth: 250, minWidth: 190 });
    /* Sama seperti pada petak: isi popup baru masuk DOM saat dibuka. */
    m.on('popupopen', (function (pokok) {
      return function () {
        if (angka(pokok.jumlahFoto) > 0) {
          isiPopupGaleri('pokok-' + pokok.id, ambilFotoPokok(pokok.id));
        }
      };
    })(p));
  }

  if (batas.length) {
    try { _petaPokok.fitBounds(L.latLngBounds(batas).pad(0.08)); } catch (e) {}
  } else if (titik.length >= 3) {
    try { _petaPokok.fitBounds(L.latLngBounds(titik).pad(0.08)); } catch (e) {}
  }

  setTimeout(function () { if (_petaPokok) _petaPokok.invalidateSize(); }, 120);
}

function popupPokok(p) {
  var html = '<div style="min-width:170px"><b>' + esc(p.kode) + '</b><br>' +
    '<small>Baris ' + esc(p.baris) + ' · pokok ke-' + esc(p.kolom) + '</small><br>' +
    '<small>' + esc(POKOK_LABEL[p.status] || p.status) + '</small><br>' +
    (angka(p.produksi12BulanKg)
      ? '<small>' + rp(p.produksi12BulanKg) + ' kg dalam 12 bulan</small><br>' : '');

  if (angka(p.jumlahFoto) > 0) html += popupGaleriHtml('pokok-' + p.id);

  return html + '<button class="tbl kecil" style="margin-top:6px" ' +
    'onclick="detailPokok(\'' + jsq(p.id) + '\')">Buka riwayat</button></div>';
}

/* ------------------------------------------------------------
   DETAIL SATU POKOK
   ------------------------------------------------------------ */

function pokokById(id) {
  for (var i = 0; i < _pokok.daftar.length; i++) {
    if (String(_pokok.daftar[i].id) === String(id)) return _pokok.daftar[i];
  }
  return null;
}

function detailPokok(id) {
  var p = pokokById(id);
  if (!p) return;
  var warna = POKOK_WARNA[p.status] || POKOK_WARNA.produktif;

  var riwayat = _pokok.catatan.filter(function (c) {
    return String(c.pokokId) === String(id);
  });

  var html = '<div class="baris" style="margin-bottom:10px">' +
    '<span class="lencana" style="background:' + warna + '22;color:' + warna + '">' +
    esc(POKOK_LABEL[p.status] || p.status) + '</span>' +
    (p.tanggalStatus ? '<small style="color:var(--redup)">sejak ' +
      tglIndo(p.tanggalStatus) + '</small>' : '') + '</div>';

  html += '<div class="kisi kisi2">' +
    barisInfo('Letak', 'Baris ' + p.baris + ', pokok ke-' + p.kolom) +
    barisInfo('Varietas', p.varietas) +
    barisInfo('Tanggal tanam', tglIndo(p.tanggalTanam, true)) +
    barisInfo('Umur', p.tanggalTanam
      ? Math.floor(selisihHari(p.tanggalTanam, hariIni()) / 365) + ' tahun' : '-') +
    barisInfo('Panen 12 bulan', rp(p.produksi12BulanKg) + ' kg') +
    barisInfo('Panen seluruhnya', rp(p.produksiTotalKg) + ' kg') +
    barisInfo('Jumlah kali panen', angka(p.jumlahPanen)) +
    barisInfo('Panen terakhir', p.panenTerakhir ? tglIndo(p.panenTerakhir, true) : '-') +
    '</div>';

  if (p.status === 'mati' && p.sebabMati) {
    html += '<div class="spanduk merah"><span>🪵</span><span><b>Sebab kematian</b>' +
      esc(p.sebabMati) + '</span></div>';
  }
  if (p.catatan) {
    html += '<hr class="pisah"><p><b>Catatan:</b><br>' + esc(p.catatan) + '</p>';
  }

  html += '<hr class="pisah"><div class="baris" style="margin-bottom:6px">' +
    '<h4 style="margin:0">📷 Foto pohon' +
    (angka(p.jumlahFoto) ? ' (' + angka(p.jumlahFoto) + ')' : '') + '</h4>' +
    (bolehUbah() ? '<button class="tbl sekunder kecil kanan" ' +
      'onclick="formFotoPokok(\'' + jsq(id) + '\')">+ Foto</button>' : '') +
    '</div><div id="galeriPokok">' +
    (angka(p.jumlahFoto)
      ? '<div class="kosong" style="padding:14px"><span class="muat"></span>' +
        'Memuat foto…</div>'
      : '<div class="kosong" style="padding:14px"><span class="ik">📷</span>' +
        'Belum ada foto pohon ini. Foto dari sudut yang sama tiap musim membuat ' +
        'perkembangan tajuk dan buahnya terlihat jelas.</div>') + '</div>';

  html += '<hr class="pisah"><h4>Riwayat (' + riwayat.length + ')</h4>';
  if (!riwayat.length) {
    html += '<div class="kosong"><span class="ik">📋</span>Belum ada riwayat.</div>';
  } else {
    for (var i = 0; i < Math.min(riwayat.length, 30); i++) {
      var c = riwayat[i];
      html += '<div class="item"><div class="ikon">' + ikonCatatanPokok(c.jenis) + '</div>' +
        '<div class="isi"><b>' + esc(labelCatatanPokok(c.jenis)) + '</b>' +
        '<small>' + tglIndo(c.tanggal, true) +
        (c.operator ? ' · ' + esc(c.operator) : '') + '</small>' +
        (c.keterangan ? '<small>' + esc(c.keterangan) + '</small>' : '') + '</div>' +
        '<div class="nilai">' +
        (angka(c.jumlahKg) ? '<b>' + c.jumlahKg + ' kg</b>' : '') +
        (c.adaFoto ? '<br><small style="color:var(--redup)">📷</small>' : '') +
        '</div></div>';
    }
  }

  if (bolehUbah()) {
    html += '<hr class="pisah"><div class="tumpuk">' +
      '<button class="tbl lebar" onclick="formCatatPokok(\'' + jsq(id) +
      '\',\'panen\')">🌾 Catat panen</button>' +
      '<button class="tbl sekunder lebar" onclick="formStatusPokok(\'' + jsq(id) +
      '\')">🔄 Ubah kondisi pokok</button>' +
      '<button class="tbl sekunder lebar" onclick="formCatatPokok(\'' + jsq(id) +
      '\',\'pengamatan\')">📝 Catat pengamatan</button>' +
      '<button class="tbl sekunder lebar" onclick="formPokok(\'' +
      jsq(p.petakId) + '\',\'' + jsq(id) + '\')">✏️ Ubah data pokok</button>' +
      (bolehKelola()
        ? '<button class="tbl bahaya lebar" onclick="hapusPokok(\'' + jsq(id) +
          '\')">🗑️ Hapus pokok</button>' : '') +
      '</div>';
  }

  modalBuka('🌳 ' + p.kode, html);

  if (angka(p.jumlahFoto)) {
    isiGaleriKeWadah('galeriPokok', 'pokok-' + id, ambilFotoPokok(id),
      'Foto tidak dapat dimuat. Periksa sambungan internet.');
  }
}

/**
 * Formulir khusus foto pohon. Dipisahkan dari formCatatPokok supaya
 * menambah foto hanya perlu dua ketukan — memotret pohon adalah hal
 * yang dilakukan sambil berjalan, bukan sambil duduk mengisi borang.
 */
function formFotoPokok(id) {
  var p = pokokById(id);
  if (!p) return;

  var ruas = [
    { k: 'x_info', t: 'info', warna: 'biru',
      isi: '<span>📷</span><span><b>Beberapa foto sekaligus</b>Misalnya tajuk, ' +
        'pangkal batang, dan buah pada hari yang sama. Seluruhnya menjadi bagian ' +
        'dari riwayat pohon ini dan tampil sebagai galeri yang bisa digeser di peta ' +
        'pokok.</span>' },
    { k: 'fotoUrl', n: 'Foto pohon', t: 'fotoBanyak',
      help: 'Berdirilah di tempat yang sama setiap kali memotret. Perbandingan ' +
            'antarwaktu hanya berarti bila sudut pandangnya tetap.' },
    { k: 'tanggal', n: 'Tanggal', t: 'tanggal', bawaan: hariIni(), wajib: true },
    { k: 'keterangan', n: 'Keterangan', t: 'area', baris: 2,
      contoh: 'Tajuk mulai rimbun, buah pentil sudah tampak' }
  ];

  kosongkanFotoBanyak('fotoUrl');

  modalBuka('Tambah foto — ' + p.kode, bentukRuas(ruas, {}), function () {
    if (!S.daring) {
      toast('Menambah foto memerlukan sambungan internet.', 'galat');
      return false;
    }
    var daftar = fotoBanyakTerkumpul('fotoUrl');
    if (!daftar.length) { toast('Pilih foto terlebih dahulu.', 'galat'); return false; }
    var v = kumpulkanRuas();
    panggil('pokok_foto_banyak', {
      pokokId: id, foto: daftar, tanggal: v.tanggal, keterangan: v.keterangan
    }).then(function (r) {
      toast(r.tersimpan + ' foto tersimpan' +

function hitungPilihPokok() {
  var n = 0;
  for (var k in _pokok.dipilih) if (_pokok.dipilih[k]) n++;
  return n;
}

/**
 * Mencentang kotak TIDAK boleh memanggil render(). Pada sub-tab ini ada
 * tabel kilogram yang sedang diisi; menggambar ulang halaman akan
 * menghapus seluruh angka yang sudah diketik — dan pemakainya baru
 * menyadari itu setelah selesai berkeliling kebun.
 */
function tandaiPilihPokok(el) {
  _pokok.dipilih[el.getAttribute('data-id')] = el.checked;
  var label = $('jumlahPilihPokok');
  if (label) label.textContent = hitungPilihPokok() + ' terpilih';
}

function pilihSemuaPokok(nilai) {
  for (var i = 0; i < _pokok.daftar.length; i++) {
    _pokok.dipilih[_pokok.daftar[i].id] = nilai;
  }
  // Kotak centang diubah langsung, bukan lewat render(), agar angka
  // kilogram yang sudah diketik di tabel panen tidak ikut terhapus.
  var kotak = document.querySelectorAll('.pilihPokok');
  for (var j = 0; j < kotak.length; j++) kotak[j].checked = nilai;
  var label = $('jumlahPilihPokok');
  if (label) label.textContent = hitungPilihPokok() + ' terpilih';
}

function terapkanStatusMassal(status) {
  var pilih = [];
  for (var k in _pokok.dipilih) if (_pokok.dipilih[k]) pilih.push(k);
  if (!pilih.length) {
    toast('Belum ada pokok yang dicentang.', 'galat');
    return;
  }
  if (!S.daring) { toast('Sensus memerlukan sambungan internet.', 'galat'); return; }

  var ruas = [
    { k: 'x_info', t: 'info', warna: status === 'mati' ? 'merah' : 'biru',
      isi: '<span>📋</span><span><b>' + pilih.length + ' pokok akan ditandai ' +
        esc(POKOK_LABEL[status]) + '</b>Perubahan ini ikut tercatat sebagai riwayat ' +
        'tiap pokok.</span>' },
    { k: 'tanggal', n: 'Tanggal sensus', t: 'tanggal', wajib: true, bawaan: hariIni() }
  ];
  if (status === 'mati' || status === 'sakit') {
    ruas.push({ k: 'sebab', n: 'Sebab', t: 'teks',
      contoh: status === 'mati' ? 'Busuk pangkal batang' : 'Serangan Ganoderma',
      help: 'Sebab yang dicatat sekarang adalah satu-satunya keterangan yang akan ' +
            'tersisa saat kejadian ini ditelusuri tahun depan.' });
  }

  modalBuka('Tandai ' + POKOK_LABEL[status], bentukRuas(ruas, {}), function () {
    var v = kumpulkanRuas();
    panggil('pokok_status_massal', {
      idPokok: pilih, status: status, sebab: v.sebab, tanggal: v.tanggal
    }).then(function (r) {
      toast(r.diperbarui + ' pokok ditandai ' + POKOK_LABEL[status] + '.', 'sukses');
      _pokok.dipilih = {};
      return muatPokokJagaIsian();
    }).catch(function (e) { toast(e.message, 'galat'); });
    return true;
  }, 'Tandai');
}

function simpanPanenMassal() {
  if (!S.daring) { toast('Pencatatan panen memerlukan sambungan internet.', 'galat'); return; }
  var tanggal = ($('pnTanggal') || {}).value || hariIni();
  var panen = [];
  for (var i = 0; i < _pokok.daftar.length; i++) {
    var el = $('pn_' + _pokok.daftar[i].id);
    if (!el) continue;
    var kg = angka(el.value);
    if (kg > 0) panen.push({ pokokId: _pokok.daftar[i].id, jumlahKg: kg });
  }
  if (!panen.length) {
    toast('Belum ada kilogram yang diisi.', 'galat');
    return;
  }

  var total = 0;
  panen.forEach(function (p) { total += p.jumlahKg; });

  konfirmasi('Simpan panen ' + panen.length + ' pokok?',
    'Total <b>' + rp(bulatKlien(total, 1)) + ' kg</b> pada ' + tglIndo(tanggal, true) + '.',
    function () {
      panggil('pokok_panen_massal', { tanggal: tanggal, panen: panen })
        .then(function (r) {
          toast(r.tercatat + ' pokok tercatat, total ' + r.totalKg + ' kg.', 'sukses');
          return muatPokok(_pokok.petakId, true);
        })
        .catch(function (e) { toast(e.message, 'galat'); });
    }, 'Simpan');
}

/**
 * Memuat ulang data pokok tanpa kehilangan kilogram yang sedang diketik.
 * Sensus dan pengisian panen sering dikerjakan berbarengan sambil
 * berjalan di kebun.
 */
function muatPokokJagaIsian() {
  var isian = {};
  var kotak = document.querySelectorAll('input[id^="pn_"]');
  for (var i = 0; i < kotak.length; i++) {
    if (kotak[i].value !== '') isian[kotak[i].id] = kotak[i].value;
  }
  return muatPokok(_pokok.petakId, true).then(function () {
    for (var k in isian) {
      var el = $(k);
      if (el) el.value = isian[k];
    }
  });
}

function bulatKlien(n, d) {
  var f = Math.pow(10, d || 0);
  return Math.round(angka(n) * f) / f;
}

function isiKoordinatPokok() {
  if (!navigator.geolocation) { toast('Perangkat tidak mendukung GPS.', 'galat'); return; }
  toast('Mengambil posisi…');
  navigator.geolocation.getCurrentPosition(function (pos) {
    if ($('f_lat')) $('f_lat').value = pos.coords.latitude.toFixed(7);
    if ($('f_lng')) $('f_lng').value = pos.coords.longitude.toFixed(7);
    toast('Posisi terisi (ketelitian ±' + Math.round(pos.coords.accuracy) + ' m).',
          'sukses');
  }, function () {
    toast('Gagal membaca GPS. Pastikan izin lokasi diberikan.', 'galat');
  }, { enableHighAccuracy: true, timeout: 15000 });
}

    ruas.push({ k: 'jumlahKg', n: 'Jumlah (kg) — bila panen', t: 'angka', langkah: '0.1' });
  }
  ruas.push({ k: 'keterangan', n: 'Keterangan', t: 'area', baris: 3 });
  ruas.push({ k: 'fotoUrl', n: 'Foto', t: 'foto' });

  modalBuka('Catat — ' + p.kode, bentukRuas(ruas, {}), function () {
    if (!S.daring) { toast('Memerlukan sambungan internet.', 'galat'); return false; }
    var v = kumpulkanRuas();
    if (v.jenis === 'panen' && angka(v.jumlahKg) <= 0) {
      toast('Catatan panen harus menyertakan jumlah kilogram.', 'galat');
      return false;
    }
    v.pokokId = id;
    panggil('pokok_catat', { item: v }).then(function () {
      toast('Catatan tersimpan.', 'sukses');
      modalTutup();
      return muatPokok(_pokok.petakId, true);
    }).catch(function (e) { toast(e.message, 'galat'); });
    return true;
  });
}

function hapusPokok(id) {
  var p = pokokById(id);
  if (!p) return;
  konfirmasi('Hapus pokok ' + esc(p.kode) + '?',
    'Riwayat panennya tetap tersimpan sebagai arsip, tetapi pokok ini hilang dari ' +
    'daftar dan peta.',
    function () {
      panggil('pokok_hapus', { id: id }).then(function () {
        toast('Pokok dihapus.', 'sukses');
        modalTutup();

      }).catch(function (e) { toast(e.message, 'galat'); });
    }, 'Hapus', true);
}

function hapusSeluruhPokok(petakId) {

function unduhPokokGeojson() {
  if (!S.daring) { toast('Ekspor memerlukan sambungan internet.', 'galat'); return; }
  panggil('pokok_geojson', { petakId: _pokok.petakId }).then(function (gj) {
    if (!gj.features.length) {
      toast('Belum ada pokok berkoordinat untuk diekspor.', 'galat');

  }).catch(function (e) { toast(e.message, 'galat'); });

/**
 * Membandingkan dua nomor versi bergaya 1.7.0.
 * Perbandingan teks biasa keliru: '1.10.0' < '1.9.0' bila dibandingkan
 * sebagai untaian huruf.
 */
function bandingVersi(a, b) {
  var pa = String(a || '0').split('.');
  var pb = String(b || '0').split('.');
  for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
    var na = angka(pa[i], 0), nb = angka(pb[i], 0);
    if (na !== nb) return na < nb ? -1 : 1;
  }
  return 0;
}

function catatanVersi(versi, tanggal, butir) {
  var html = '<div class="item"><div class="ikon">v</div><div class="isi">' +
    '<b>' + esc(versi) + '</b><small>' + esc(tanggal) + '</small>' +
    '<ul style="font-size:.82rem;padding-left:16px;margin:4px 0 0;line-height:1.6">';
  for (var i = 0; i < butir.length; i++) html += '<li>' + butir[i] + '</li>';
  return html + '</ul></div></div>';
}

/* ============================================================
   LAPORAN & REKAP — bulanan dan tahunan
   ============================================================
   Rumus di berkas ini adalah salinan dari Laporan.gs. Disengaja:
   rekap harus tetap terbuka saat luring, dan angka yang berbeda
   antara layar dan cetakan membuat pengguna kehilangan kepercayaan
   pada kedua-duanya.

   Bila salah satunya diubah, ubah keduanya.
   ============================================================ */

var _laporan = { data: null, jenis: 'bulanan', tahun: 0, bulan: 0, sumber: '' };

var BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli',
                'Agustus', 'September', 'Oktober', 'November', 'Desember'];

function tabLaporan() {
  if (!_laporan.tahun) {
    var awal = periodeAwal();
    _laporan.tahun = awal.tahun;
    _laporan.bulan = awal.bulan;
  }

  var sub = subAktif('laporan', 'bulanan');
  var html = pil('laporan', [
    { k: 'bulanan', n: 'Rekap Bulanan' },
    { k: 'tahunan', n: 'Rekap Tahunan' }
  ], 'bulanan');

  html += (sub === 'tahunan') ? panelTahunan() : panelBulanan();
  return html;
}

/* ------------------------------------------------------------
   PEMILIH PERIODE
   ------------------------------------------------------------ */

/**
 * Periode yang dibuka pertama kali: bulan TERAKHIR yang benar-benar
 * punya catatan.
 *
 * Membuka bulan berjalan terasa lebih masuk akal, tetapi pada awal
 * bulan — atau pada kelompok yang mencatatnya menyusul — laporan yang
 * terbuka akan kosong seluruhnya. Pengguna yang melihat semua angka nol
 * pada percobaan pertama menyimpulkan fiturnya rusak, bukan bahwa
 * datanya memang belum ada.
 */
function periodeAwal() {
  var sekarang = new Date();
  var terbaru = '';
  var sumber = [['biaya', 'tanggal'], ['panen', 'tanggal'], ['aktivitas', 'waktu']];
  for (var s = 0; s < sumber.length; s++) {
    var baris = S.data[sumber[s][0]] || [];
    for (var i = 0; i < baris.length; i++) {
      var t = String(baris[i][sumber[s][1]] || '').substring(0, 7);
      if (/^\d{4}-\d{2}$/.test(t) && t > terbaru) terbaru = t;
    }
  }
  if (!terbaru) {
    return { tahun: sekarang.getFullYear(), bulan: sekarang.getMonth() + 1 };
  }
  return { tahun: Number(terbaru.substring(0, 4)),
           bulan: Number(terbaru.substring(5, 7)) };
}

function tahunTersediaLokal() {
  var ada = {};
  var sumber = [['biaya', 'tanggal'], ['panen', 'tanggal'], ['aktivitas', 'waktu'],
                ['kerusakan', 'tanggal'], ['jadwal', 'tanggal']];
  for (var s = 0; s < sumber.length; s++) {
    var baris = S.data[sumber[s][0]] || [];
    for (var i = 0; i < baris.length; i++) {
      var t = String(baris[i][sumber[s][1]] || '').substring(0, 4);
      if (/^\d{4}$/.test(t)) ada[t] = true;
    }
  }
  var daftar = [];
  for (var y in ada) daftar.push(Number(y));
  var kini = new Date().getFullYear();
  if (daftar.indexOf(kini) < 0) daftar.push(kini);
  daftar.sort(function (a, b) { return b - a; });
  return daftar;
}

function pemilihPeriode(denganBulan) {
  var tahun = tahunTersediaLokal();
  var opsiTahun = tahun.map(function (t) {
    return '<option value="' + t + '"' +
      (t === _laporan.tahun ? ' selected' : '') + '>' + t + '</option>';
  }).join('');

  var html = '<div class="kartu takCetak"><div class="baris">';
  if (denganBulan) {
    var opsiBulan = '';
    for (var b = 1; b <= 12; b++) {
      opsiBulan += '<option value="' + b + '"' +
        (b === _laporan.bulan ? ' selected' : '') + '>' + BULAN_ID[b - 1] + '</option>';
    }
    html += '<label class="ruas" style="flex:1;min-width:130px;margin:0">' +
      '<span class="nama">Bulan</span>' +
      '<select onchange="_laporan.bulan=Number(this.value);muatLaporan()">' +
      opsiBulan + '</select></label>';
  }
  html += '<label class="ruas" style="flex:1;min-width:110px;margin:0">' +
    '<span class="nama">Tahun</span>' +
    '<select onchange="_laporan.tahun=Number(this.value);muatLaporan()">' +
    opsiTahun + '</select></label>' +
    '<button class="tbl sekunder kecil" style="align-self:flex-end" ' +
    'onclick="muatLaporan()">🔄 Muat ulang</button>' +
    '</div></div>';
  return html;
}

/* ------------------------------------------------------------
   PEMUATAN
   ------------------------------------------------------------ */

function muatLaporan() {
  var jenis = subAktif('laporan', 'bulanan');
  if (_laporan.data && _laporan.data.jenis !== jenis) _laporan.data = null;
  _laporan.jenis = jenis;

  var wadah = $('isiLaporan');
  if (wadah) {
    wadah.innerHTML = '<div class="spanduk biru"><span class="muat"></span>' +
      '<span>Menyusun laporan…</span></div>';
  }

  /* Luring: dihitung dari salinan lokal. Hasilnya sama karena
     rumusnya sama, tetapi ditandai sumbernya supaya pengguna tahu
     laporan ini belum menyertakan data yang belum tersinkron. */
  if (!S.daring) {
    _laporan.data = (jenis === 'tahunan')
      ? laporanTahunanLokal(_laporan.tahun)
      : laporanBulananLokal(_laporan.tahun, _laporan.bulan);
    _laporan.sumber = 'lokal';
    render();
    return Promise.resolve();
  }

  var aksi = jenis === 'tahunan' ? 'laporan_tahunan' : 'laporan_bulanan';
  var data = jenis === 'tahunan'
    ? { tahun: _laporan.tahun }
    : { tahun: _laporan.tahun, bulan: _laporan.bulan };

  return panggil(aksi, data).then(function (r) {
    _laporan.data = r;
    _laporan.sumber = 'peladen';
    render();
  }).catch(function (e) {
    /* Gagal memuat bukan berarti laporan tidak bisa dibuat. */
    _laporan.data = (jenis === 'tahunan')
      ? laporanTahunanLokal(_laporan.tahun)
      : laporanBulananLokal(_laporan.tahun, _laporan.bulan);
    _laporan.sumber = 'lokal';
    render();
    toast('Laporan disusun dari salinan lokal: ' + e.message, 'galat');
  });
}

function panelBulanan() {
  var html = pemilihPeriode(true) + '<div id="isiLaporan">';
  if (_laporan.data && _laporan.data.jenis === 'bulanan') {
    html += gambarLaporan(_laporan.data);
  } else {
    html += '<div class="kartu"><div class="kosong"><span class="muat"></span>' +
      'Menyusun laporan…</div></div>';
    setTimeout(muatLaporan, 30);
  }
  return html + '</div>';
}

function panelTahunan() {
  var html = pemilihPeriode(false) + '<div id="isiLaporan">';
  if (_laporan.data && _laporan.data.jenis === 'tahunan') {
    html += gambarLaporan(_laporan.data);
  } else {
    html += '<div class="kartu"><div class="kosong"><span class="muat"></span>' +
      'Menyusun laporan…</div></div>';
    setTimeout(muatLaporan, 30);
  }
  return html + '</div>';
}

function gambarLaporan(L) {
  var t = L.kini.total;
  var html = '';

  /* Kepala laporan — ikut tercetak, jadi memuat identitas kelompok. */
  html += '<div class="kartu"><div class="baris">' +
    '<div><h2 style="margin:0">' +
    esc(S.pengaturan.namaKelompok || S.pengaturan.namaAplikasi || 'TaniPintar') +
    '</h2>' +
    '<div style="font-size:1.05rem;font-weight:700;color:var(--utama2);margin-top:2px">' +
    'Laporan ' + (L.jenis === 'tahunan' ? 'Tahunan' : 'Bulanan') + ' — ' +
    esc(L.judul) + '</div>' +
    '<small style="color:var(--redup)">Periode ' + tglIndo(L.periode.dari, true) +
    ' sampai ' + tglIndo(L.periode.sampai, true) + '</small></div>' +
    '<div class="kanan takCetak">' +
    '<button class="tbl sekunder kecil" onclick="window.print()">🖨️ Cetak</button> ' +
    '<button class="tbl sekunder kecil" onclick="unduhLaporanCsv()">⬇️ CSV</button>' +
    '</div></div>';

  if (_laporan.sumber === 'lokal') {
    html += '<div class="spanduk kuning"><span>📴</span><span>' +
      '<b>Disusun dari salinan di perangkat ini</b>Catatan yang belum tersinkron ' +
      'ke Spreadsheet belum ikut terhitung. Muat ulang saat ada sinyal untuk angka ' +
      'yang pasti.</span></div>';
  }
  if (!L.kini.adaData) {
    html += '<div class="spanduk merah"><span>📭</span><span>' +
      '<b>Tidak ada catatan pada periode ini</b>Seluruh angka nol di bawah berarti ' +
      'belum dicatat — bukan berarti tidak ada kegiatan.</span></div>';
  }
  html += '</div>';

  /* Ringkasan utama */
  html += '<div class="kisi kisi4" style="margin-bottom:12px">' +
    kartuStat('💰', 'Rp ' + rpSingkat(t.pendapatan), 'Pendapatan',
              deltaTeks(L.perubahan.pendapatan, L.pembanding.judul)) +
    kartuStat('💸', 'Rp ' + rpSingkat(t.biaya), 'Biaya',
              deltaTeks(L.perubahan.biaya, L.pembanding.judul)) +
    kartuStat(t.laba >= 0 ? '📈' : '📉', 'Rp ' + rpSingkat(t.laba), 'Laba Bersih',
              'Margin ' + t.marginPersen + '%') +
    kartuStat('🌾', rp(t.kg) + ' kg', 'Total Panen',
              t.transaksiPanen + ' transaksi') +
    '</div>';

  /* Titik impas — angka paling berguna, diberi ruang sendiri */
  if (t.kg > 0) {
    var sehat = t.hargaRerataPerKg >= t.bepPerKg;
    html += '<div class="spanduk ' + (sehat ? 'hijau' : 'merah') + '">' +
      '<span>' + (sehat ? '⚖️' : '⚠️') + '</span><span>' +
      '<b>Titik impas Rp ' + rp(t.bepPerKg) + ' per kg · harga jual rata-rata Rp ' +
      rp(t.hargaRerataPerKg) + ' per kg</b>' +
      (sehat
        ? 'Penjualan pada periode ini menutup biayanya, dengan selisih Rp ' +
          rp(t.hargaRerataPerKg - t.bepPerKg) + ' per kg.'
        : 'Harga jual berada DI BAWAH titik impas sebesar Rp ' +
          rp(t.bepPerKg - t.hargaRerataPerKg) + ' per kg. Penjualan pada periode ' +
          'ini tidak menutup biayanya.') + '</span></div>';
  }

  /* Catatan naratif — untuk dibacakan di rapat anggota */
  if (L.catatan && L.catatan.length) {
    html += '<div class="kartu"><h3>Catatan</h3>';
    for (var c = 0; c < L.catatan.length; c++) {
      var n = L.catatan[c];
      var ikon = n.jenis === 'bahaya' ? '⚠️' : (n.jenis === 'peringatan' ? '❗'
        : (n.jenis === 'baik' ? '✅' : (n.jenis === 'kosong' ? '📭' : 'ℹ️')));
      var warna = n.jenis === 'bahaya' ? 'merah'
        : (n.jenis === 'peringatan' ? 'kuning'
          : (n.jenis === 'baik' ? 'hijau' : 'biru'));
      html += '<div class="spanduk ' + warna + '"><span>' + ikon + '</span><span>' +
        esc(n.teks) + '</span></div>';
    }
    html += '</div>';
  }

  /* Rincian bulanan pada laporan tahunan */
  if (L.bulanan) html += bagianGrafikBulanan(L);

  /* Perbandingan periode */
  html += bagianPembanding(L);

  /* Per petak */
  html += bagianTabelPetak(L.kini.petak);

  /* Biaya per kategori */
  html += bagianKategoriBiaya(L.kini.kategoriBiaya, t.biaya);

  /* Panen per komoditas */
  html += bagianKomoditas(L.kini.komoditas);

  /* Kegiatan lapangan */
  html += bagianKegiatan(L.kini);

  /* Tanda tangan — laporan ini dibawa ke rapat dan ke bank */
  html += '<div class="kartu"><div class="kisi kisi2" style="margin-top:10px">' +
    '<div style="text-align:center"><small style="color:var(--redup)">Disusun oleh' +
    '</small><div style="height:52px"></div>' +
    '<div style="border-top:1px solid var(--garis);padding-top:5px;font-size:.85rem">' +
    esc(L.dibuatOleh || (S.pengguna ? S.pengguna.nama : '')) + '</div></div>' +
    '<div style="text-align:center"><small style="color:var(--redup)">Mengetahui' +
    '</small><div style="height:52px"></div>' +
    '<div style="border-top:1px solid var(--garis);padding-top:5px;font-size:.85rem">' +
    'Ketua Kelompok</div></div></div>' +
    '<p style="font-size:.72rem;color:var(--redup);text-align:center;margin-top:10px">' +
    'Dibuat ' + esc(String(L.dibuatPada || '').replace('T', ' ').substring(0, 16)) +
    ' · ' + esc(S.pengaturan.namaAplikasi || 'TaniPintar') + ' v' + VERSI_KLIEN +
    '</p></div>';

  return html;
}

function deltaTeks(d, judulPembanding) {
  if (!d) return '';
  if (d.persen === null || d.persen === undefined) {
    /* Persentase tidak dihitung karena pembaginya nol. Menyebutnya
       "tidak ada data pembanding" menyesatkan: periodenya mungkin
       berisi, hanya angka INI yang nol di sana. */
    return d.nilai === 0 ? 'Sama dengan ' + judulPembanding
      : 'Nol pada ' + judulPembanding;
  }
  var tanda = d.nilai > 0 ? '▲ +' : (d.nilai < 0 ? '▼ ' : '');
  return tanda + d.persen + '% vs ' + judulPembanding;
}

/* ---------- grafik 12 bulan ---------- */
function bagianGrafikBulanan(L) {
  var maks = 1;
  for (var i = 0; i < L.bulanan.length; i++) {
    maks = Math.max(maks, L.bulanan[i].pendapatan, L.bulanan[i].biaya);
  }

  var html = '<div class="kartu"><h3>Rincian per bulan</h3>' +
    '<div class="baris" style="font-size:.72rem;margin-bottom:8px">' +
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;' +
    'background:var(--utama2)"></span> Pendapatan</span>' +
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;' +
    'background:var(--bahaya)"></span> Biaya</span></div>';

  for (var b = 0; b < L.bulanan.length; b++) {
    var m = L.bulanan[b];
    html += '<div style="margin-bottom:9px">' +
      '<div class="baris" style="font-size:.78rem">' +
      '<span style="font-weight:700">' + esc(m.nama) + '</span>' +
      '<span class="kanan" style="color:var(--redup)">' +
      (m.adaData
        ? 'Rp ' + rpSingkat(m.pendapatan) + ' · Rp ' + rpSingkat(m.biaya) +
          ' · ' + rp(m.kg) + ' kg'
        : 'belum ada catatan') + '</span></div>' +
      '<div class="batang" style="height:7px;margin-top:3px"><i style="width:' +
      Math.round(m.pendapatan / maks * 100) + '%"></i></div>' +
      '<div class="batang" style="height:7px;margin-top:2px"><i style="width:' +
      Math.round(m.biaya / maks * 100) + '%;background:var(--bahaya)"></i></div>' +
      '</div>';
  }

  if (L.puncakPanen && L.puncakPanen.kg > 0) {
    html += '<hr class="pisah"><div class="kisi kisi3">' +
      barisInfo('Panen terbesar', L.puncakPanen.nama + ' — ' +
                rp(L.puncakPanen.kg) + ' kg') +
      barisInfo('Laba tertinggi', L.puncakLaba
        ? L.puncakLaba.nama + ' — Rp ' + rpSingkat(L.puncakLaba.laba) : '-') +
      barisInfo('Laba terendah', L.terendahLaba
        ? L.terendahLaba.nama + ' — Rp ' + rpSingkat(L.terendahLaba.laba) : '-') +
      '</div>';

  return html + '</div>';
}

/* ---------- pembanding ---------- */
function bagianPembanding(L) {
  var k = L.kini.total, l = L.pembanding.total;
  if (!L.pembanding.adaData) {
    return '<div class="kartu"><h3>Perbandingan</h3>' +
      '<div class="kosong"><span class="ik">📅</span>' +
      'Tidak ada catatan pada ' + esc(L.pembanding.judul) +

    var warna = d.nilai === 0 ? 'var(--redup)'

    return '<tr><td>' + esc(label) + '</td>' +
      '<td class="angka">' + satuan + rp(kini) + '</td>' +

      '<td class="angka" style="color:' + warna + ';font-weight:700">' +
      (d.nilai > 0 ? '+' : '') + satuan + rp(d.nilai) +
      (d.persen !== null && d.persen !== undefined
        ? '<br><small>' + (d.nilai > 0 ? '+' : '') + d.persen + '%</small>' : '') +
      '</td></tr>';

  /* Biaya naik bukan berita buruk dengan sendirinya, jadi warnanya
     tidak dibalik — pembacaannya diserahkan ke pengguna, yang tahu
     apakah kenaikan itu karena pemupukan atau karena pemborosan. */
  return '<div class="kartu"><h3>Dibanding ' + esc(L.pembanding.judul) + '</h3>' +
    '<div class="gulir"><table><thead><tr><th>Keterangan</th>' +
    '<th class="angka">' + esc(L.judul) + '</th>' +
    '<th class="angka">' + esc(L.pembanding.judul) + '</th>' +
    '<th class="angka">Selisih</th></tr></thead><tbody>' +
    baris('Pendapatan', k.pendapatan, l.pendapatan, L.perubahan.pendapatan, 'Rp ') +
    baris('Biaya', k.biaya, l.biaya, L.perubahan.biaya, 'Rp ') +
    baris('Laba', k.laba, l.laba, L.perubahan.laba, 'Rp ') +
    baris('Panen (kg)', k.kg, l.kg, L.perubahan.kg, '') +
    baris('Titik impas per kg', k.bepPerKg, l.bepPerKg, L.perubahan.bepPerKg, 'Rp ') +

}

      '<div class="kosong"><span class="ik">🌾</span>Belum ada catatan yang ' +

    '<div class="gulir"><table><thead><tr><th>Petak</th>' +

    '<th class="angka">Laba</th><th class="angka">Panen</th>' +
    '<th class="angka">BEP/kg</th><th class="angka">Laba/m²</th></tr></thead><tbody>';
  var tot = { biaya: 0, pendapatan: 0, laba: 0, kg: 0 };

    tot.laba += r.laba; tot.kg += r.kg;
    html += '<tr><td><b>' + esc(r.nama) + '</b>' +

      '<td class="angka">' + rp(r.kg) + ' kg</td>' +

      '<td class="angka">' + (r.labaPerM2 ? rp(r.labaPerM2) : '-') + '</td></tr>';

/* ------------------------------------------------------------
   EKSPOR CSV
   ------------------------------------------------------------ */

function unduhLaporanCsv() {
  if (!_laporan.data) return;
  if (!S.daring) {
    unduhBerkas(namaBerkasLaporan(), csvLokal(_laporan.data), 'text/csv;charset=utf-8');
    toast('CSV disusun dari salinan lokal.', 'sukses');
    return;
  }
  var d = _laporan.jenis === 'tahunan'
    ? { jenis: 'tahunan', tahun: _laporan.tahun }
    : { jenis: 'bulanan', tahun: _laporan.tahun, bulan: _laporan.bulan };
  panggil('laporan_csv', d).then(function (r) {
    unduhBerkas(r.namaBerkas, r.isi, 'text/csv;charset=utf-8');
    toast('Berkas CSV diunduh.', 'sukses');
  }).catch(function () {
    /* Gagal di peladen bukan alasan untuk tidak memberi berkas apa pun:
       laporannya sudah ada di layar, jadi CSV-nya bisa disusun di sini. */
    unduhBerkas(namaBerkasLaporan(), csvLokal(_laporan.data), 'text/csv;charset=utf-8');
    toast('CSV disusun dari salinan lokal.', 'sukses');
  });
}

function namaBerkasLaporan() {
  return 'laporan-' + (_laporan.jenis === 'tahunan'
    ? _laporan.tahun
    : _laporan.tahun + '-' + (_laporan.bulan < 10 ? '0' : '') + _laporan.bulan) + '.csv';
}

function barisCsvKlien(kolom) {
  var keluar = [];
  for (var i = 0; i < kolom.length; i++) {
    var v = kolom[i] === null || kolom[i] === undefined ? '' : String(kolom[i]);
    if (v.indexOf(';') >= 0 || v.indexOf('"') >= 0 || v.indexOf('\n') >= 0) {
      v = '"' + v.replace(/"/g, '""') + '"';
    }
    keluar.push(v);
  }
  return keluar.join(';');
}

function csvLokal(L) {
  var b = [];
  b.push(barisCsvKlien(['Laporan', L.judul]));
  b.push(barisCsvKlien(['Periode', L.periode.dari, 'sampai', L.periode.sampai]));
  b.push(barisCsvKlien(['Sumber', 'salinan lokal perangkat']));
  b.push('');
  b.push(barisCsvKlien(['RINGKASAN']));
  b.push(barisCsvKlien(['Pendapatan (Rp)', L.kini.total.pendapatan]));
  b.push(barisCsvKlien(['Biaya (Rp)', L.kini.total.biaya]));
  b.push(barisCsvKlien(['Laba (Rp)', L.kini.total.laba]));
  b.push(barisCsvKlien(['Panen (kg)', L.kini.total.kg]));
  b.push(barisCsvKlien(['Titik impas (Rp/kg)', L.kini.total.bepPerKg]));
  b.push('');
  b.push(barisCsvKlien(['RINCIAN PER PETAK']));
  b.push(barisCsvKlien(['Petak', 'Biaya', 'Pendapatan', 'Laba', 'Panen (kg)']));
  for (var i = 0; i < L.kini.petak.length; i++) {
    var r = L.kini.petak[i];
    b.push(barisCsvKlien([r.nama, r.biaya, r.pendapatan, r.laba, r.kg]));
  }
  return b.join('\r\n');
}

/* ============================================================
   SALINAN RUMUS UNTUK MODE LURING
   Sama persis dengan hitungPeriode() di Laporan.gs.
   ============================================================ */

function tglSaja(v) {
  return String(v === null || v === undefined ? '' : v).substring(0, 10);
}

function dalamRentangLokal(t, dari, sampai) {
  var s = tglSaja(t);
  return s ? (s >= dari && s <= sampai) : false;
}

function rentangBulanLokal(tahun, bulan) {
  var akhir = new Date(tahun, bulan, 0).getDate();
  var mm = (bulan < 10 ? '0' : '') + bulan;
  return { dari: tahun + '-' + mm + '-01',
           sampai: tahun + '-' + mm + '-' + (akhir < 10 ? '0' : '') + akhir };
}

function hitungPeriodeLokal(dari, sampai) {
  var total = { pendapatan: 0, biaya: 0, kg: 0, piutangBaru: 0, diterima: 0,
                transaksiPanen: 0, catatanBiaya: 0, jamKerja: 0, luasDikerjakanM2: 0 };
  var perPetak = {}, perKategori = {}, perKomoditas = {}, perJenis = {};

  function barisPetak(id) {
    var k = String(id || '');
    if (!perPetak[k]) {
      var p = k ? petakById(k) : null;
      perPetak[k] = { petakId: k, nama: p ? p.nama : (k ? '(petak terhapus)'
        : '(tanpa petak)'), komoditas: p ? p.komoditas : '',
        luasM2: p ? angka(p.luasM2) : 0,
        biaya: 0, pendapatan: 0, kg: 0, piutang: 0 };
    }
    return perPetak[k];
  }

  (S.data.biaya || []).forEach(function (b) {
    if (!dalamRentangLokal(b.tanggal, dari, sampai)) return;
    var n = angka(b.nominal);
    total.biaya += n; total.catatanBiaya++;
    barisPetak(b.petakId).biaya += n;
    var kat = b.kategori || 'Lain-lain';
    perKategori[kat] = (perKategori[kat] || 0) + n;
  });

  (S.data.panen || []).forEach(function (h) {
    if (!dalamRentangLokal(h.tanggal, dari, sampai)) return;
    var rpn = angka(h.totalPendapatan), kg = angka(h.jumlahKg),
        dib = angka(h.sudahDibayar);
    total.pendapatan += rpn; total.kg += kg; total.transaksiPanen++;
    total.diterima += Math.min(dib, rpn);
    total.piutangBaru += Math.max(0, rpn - dib);
    var bp = barisPetak(h.petakId);
    bp.pendapatan += rpn; bp.kg += kg; bp.piutang += Math.max(0, rpn - dib);
    var kom = h.komoditas || '(tidak dicatat)';
    if (!perKomoditas[kom]) {
      perKomoditas[kom] = { nama: kom, kg: 0, pendapatan: 0, transaksi: 0 };
    }
    perKomoditas[kom].kg += kg;
    perKomoditas[kom].pendapatan += rpn;
    perKomoditas[kom].transaksi++;
  });

  var pupuk = { selesai: 0, tertunda: 0, terlewat: 0 };
  (S.data.jadwal || []).forEach(function (j) {
    if (!dalamRentangLokal(j.tanggal, dari, sampai)) return;
    if (j.status === 'completed') pupuk.selesai++;
    else if (j.status === 'postponed') pupuk.tertunda++;
    else if (tglSaja(j.tanggal) < hariIni()) pupuk.terlewat++;
  });

  var hama = { laporan: 0, kerugian: 0, masihAktif: 0, tingkatBerat: 0 };
  var daftarHama = [];
  (S.data.kerusakan || []).forEach(function (k) {
    if (!dalamRentangLokal(k.tanggal, dari, sampai)) return;
    hama.laporan++;
    hama.kerugian += angka(k.perkiraanRugiRp);
    if (k.status === 'active') hama.masihAktif++;
    if (k.tingkat === 'Berat' || k.tingkat === 'Kritis / Puso') hama.tingkatBerat++;
    daftarHama.push({ tanggal: tglSaja(k.tanggal), petak: namaPetak(k.petakId),
      gejala: k.judulGejala, tingkat: k.tingkat, status: k.status,
      kerugian: angka(k.perkiraanRugiRp) });
  });

  var jumlahAktivitas = 0;
  (S.data.aktivitas || []).forEach(function (a) {
    if (!dalamRentangLokal(a.waktu, dari, sampai)) return;
    jumlahAktivitas++;
    total.jamKerja += angka(a.durasiMenit) / 60;
    total.luasDikerjakanM2 += angka(a.luasM2);
    var jn = a.jenis || 'Lain-lain';
    perJenis[jn] = (perJenis[jn] || 0) + 1;
  });

  var stok = { masuk: 0, keluar: 0, nilaiMasuk: 0, nilaiKeluar: 0 };
  (S.data.mutasi || []).forEach(function (m) {
    if (!dalamRentangLokal(m.tanggal, dari, sampai)) return;
    var it = itemById(m.itemId);
    var nilai = Math.abs(angka(m.jumlah)) * (it ? angka(it.hargaSatuan) : 0);
    if (angka(m.jumlah) >= 0) { stok.masuk++; stok.nilaiMasuk += nilai; }
    else { stok.keluar++; stok.nilaiKeluar += nilai; }
  });

  total.laba = total.pendapatan - total.biaya;
  total.marginPersen = total.pendapatan > 0
    ? Math.round(total.laba / total.pendapatan * 1000) / 10 : 0;
  total.bepPerKg = total.kg > 0 ? Math.round(total.biaya / total.kg) : 0;
  total.hargaRerataPerKg = total.kg > 0
    ? Math.round(total.pendapatan / total.kg) : 0;
  total.jamKerja = Math.round(total.jamKerja * 10) / 10;

  var petak = [];
  for (var pk in perPetak) {
    var r = perPetak[pk];
    r.laba = r.pendapatan - r.biaya;
    r.bepPerKg = r.kg > 0 ? Math.round(r.biaya / r.kg) : 0;
    r.labaPerM2 = r.luasM2 > 0 ? Math.round(r.laba / r.luasM2) : 0;
    petak.push(r);
  }
  petak.sort(function (a, b) { return b.laba - a.laba; });

  var kategori = [];
  for (var kt in perKategori) {
    kategori.push({ nama: kt, nominal: perKategori[kt],
      persen: total.biaya > 0
        ? Math.round(perKategori[kt] / total.biaya * 1000) / 10 : 0 });
  }
  kategori.sort(function (a, b) { return b.nominal - a.nominal; });

  var komoditas = [];
  for (var km in perKomoditas) {
    var kk = perKomoditas[km];
    kk.hargaRerata = kk.kg > 0 ? Math.round(kk.pendapatan / kk.kg) : 0;
    komoditas.push(kk);
  }
  komoditas.sort(function (a, b) { return b.pendapatan - a.pendapatan; });

  var jenisAkt = [];
  for (var ja in perJenis) jenisAkt.push({ nama: ja, jumlah: perJenis[ja] });
  jenisAkt.sort(function (a, b) { return b.jumlah - a.jumlah; });

  return {
    dari: dari, sampai: sampai, total: total, petak: petak,
    kategoriBiaya: kategori, komoditas: komoditas, pupuk: pupuk, hama: hama,
    daftarHama: daftarHama.sort(function (a, b) {
      return a.tanggal < b.tanggal ? 1 : -1;
    }).slice(0, 20),
    aktivitas: { jumlah: jumlahAktivitas, perJenis: jenisAkt },
    stok: stok, pokok: null,
    adaData: (total.catatanBiaya + total.transaksiPanen + jumlahAktivitas) > 0
  };
}

function bandingkanLokal(kini, lalu) {
  function selisih(a, b) {
    var d = angka(a) - angka(b);
    return { nilai: d,
      persen: angka(b) !== 0 ? Math.round(d / Math.abs(angka(b)) * 1000) / 10 : null,
      arah: d > 0 ? 'naik' : (d < 0 ? 'turun' : 'tetap') };
  }
  return {
    pendapatan: selisih(kini.pendapatan, lalu.pendapatan),
    biaya: selisih(kini.biaya, lalu.biaya),
    laba: selisih(kini.laba, lalu.laba),
    kg: selisih(kini.kg, lalu.kg),
    bepPerKg: selisih(kini.bepPerKg, lalu.bepPerKg)
  };
}

function laporanBulananLokal(tahun, bulan) {
  var r = rentangBulanLokal(tahun, bulan);
  var kini = hitungPeriodeLokal(r.dari, r.sampai);
  var bl = bulan === 1 ? 12 : bulan - 1;
  var tl = bulan === 1 ? tahun - 1 : tahun;
  var rl = rentangBulanLokal(tl, bl);
  var lalu = hitungPeriodeLokal(rl.dari, rl.sampai);

  return {
    jenis: 'bulanan', tahun: tahun, bulan: bulan,
    namaBulan: BULAN_ID[bulan - 1],
    judul: BULAN_ID[bulan - 1] + ' ' + tahun,
    periode: r, kini: kini,
    pembanding: { judul: BULAN_ID[bl - 1] + ' ' + tl, total: lalu.total,
                  adaData: lalu.adaData },
    perubahan: bandingkanLokal(kini.total, lalu.total),
    catatan: catatanLokal(kini, lalu),
    dibuatPada: new Date().toISOString().substring(0, 19),
    dibuatOleh: S.pengguna ? S.pengguna.nama : ''
  };
}

function laporanTahunanLokal(tahun) {
  var r = { dari: tahun + '-01-01', sampai: tahun + '-12-31' };
  var kini = hitungPeriodeLokal(r.dari, r.sampai);

  var bulanan = [];
  for (var b = 1; b <= 12; b++) {
    var rb = rentangBulanLokal(tahun, b);
    var hb = hitungPeriodeLokal(rb.dari, rb.sampai);
    bulanan.push({ bulan: b, nama: BULAN_ID[b - 1],
      singkat: BULAN_ID[b - 1].substring(0, 3),
      pendapatan: hb.total.pendapatan, biaya: hb.total.biaya,
      laba: hb.total.laba, kg: hb.total.kg,
      transaksiPanen: hb.total.transaksiPanen, adaData: hb.adaData });
  }

  var lalu = hitungPeriodeLokal((tahun - 1) + '-01-01', (tahun - 1) + '-12-31');
  var berisi = bulanan.filter(function (x) { return x.adaData; });
  var puncakPanen = null, puncakLaba = null, terendahLaba = null;
  if (berisi.length) {
    puncakPanen = berisi.slice().sort(function (a, b) { return b.kg - a.kg; })[0];
    var ul = berisi.slice().sort(function (a, b) { return b.laba - a.laba; });
    puncakLaba = ul[0];
    terendahLaba = ul[ul.length - 1];
  }

  var catatan = catatanLokal(kini, lalu);
  if (berisi.length > 0 && berisi.length < 12) {
    catatan.push({ jenis: 'info',
      teks: 'Hanya ' + berisi.length + ' dari 12 bulan yang berisi catatan. Angka ' +
            'tahunan menjumlahkan apa adanya, tidak memperkirakan bulan yang kosong.' });
  }

  return {
    jenis: 'tahunan', tahun: tahun, judul: 'Tahun ' + tahun,
    periode: r, kini: kini, bulanan: bulanan,
    pembanding: { judul: 'Tahun ' + (tahun - 1), total: lalu.total,
                  adaData: lalu.adaData },
    perubahan: bandingkanLokal(kini.total, lalu.total),
    puncakPanen: puncakPanen, puncakLaba: puncakLaba, terendahLaba: terendahLaba,
    bulanBerisi: berisi.length, catatan: catatan,
    dibuatPada: new Date().toISOString().substring(0, 19),
    dibuatOleh: S.pengguna ? S.pengguna.nama : ''
  };
}

function catatanLokal(kini, lalu) {
  var out = [];
  if (!kini.adaData) {
    out.push({ jenis: 'kosong',
      teks: 'Tidak ada catatan sama sekali pada periode ini. Angka nol di sini ' +
            'berarti belum dicatat, bukan berarti tidak ada kegiatan.' });
    return out;
  }
  if (kini.total.catatanBiaya === 0 && kini.total.transaksiPanen > 0) {
    out.push({ jenis: 'peringatan',
      teks: 'Ada panen tetapi tidak ada catatan biaya sama sekali. Angka laba dan ' +
            'titik impas pada laporan ini terlalu bagus, karena biayanya belum masuk.' });
  }
  if (kini.total.transaksiPanen === 0 && kini.total.catatanBiaya > 0) {
    out.push({ jenis: 'info',
      teks: 'Belum ada panen pada periode ini, jadi seluruh biaya tampak sebagai ' +
            'kerugian. Ini wajar pada masa tanam dan pemeliharaan.' });
  }
  if (kini.total.piutangBaru > 0) {
    out.push({ jenis: 'peringatan',
      teks: 'Piutang baru Rp ' + rp(kini.total.piutangBaru) + ' belum dibayar ' +
            'pembeli. Angka laba di atas sudah menghitungnya sebagai pendapatan, ' +
            'padahal uangnya belum diterima.' });
  }
  if (kini.pupuk.terlewat > 0) {
    out.push({ jenis: 'peringatan',
      teks: kini.pupuk.terlewat + ' jadwal pemupukan terlewat pada periode ini.' });
  }
  if (kini.hama.tingkatBerat > 0) {
    out.push({ jenis: 'peringatan',
      teks: kini.hama.tingkatBerat + ' laporan kerusakan tingkat berat atau kritis.' });
  }
  return out;
}


/* ============================================================
   PENAMPIL FOTO — geser, cubit-zoom, ketuk-ganda
   ============================================================
   Dibuat sendiri, bukan memakai pustaka luar, karena satu-satunya
   pustaka yang tersedia di aplikasi ini adalah Leaflet. Menambah
   pustaka baru berarti menambah berkas yang harus ditanam, diperiksa
   lisensinya, dan diperbarui — untuk pekerjaan yang muat dalam
   beberapa ratus baris.

   Yang benar-benar dibutuhkan di lapangan: melihat perkembangan satu
   pohon dari bulan ke bulan sambil berdiri di kebun, dengan satu
   tangan, di bawah matahari.
   ============================================================ */

var _galeri = {
  daftar: [],      // [{fotoUrl, judul, keterangan, tanggal}]
  indeks: 0,
  skala: 1,
  geserX: 0,
  geserY: 0
};

/* Keadaan sentuhan. Disimpan di luar objek galeri karena diperbarui
   puluhan kali per detik saat jari bergerak. */
var _sentuh = {
  aktif: false, mulaiX: 0, mulaiY: 0, akhirX: 0, akhirY: 0,
  jarakAwal: 0, skalaAwal: 1, geserAwalX: 0, geserAwalY: 0,
  jariGanda: false, ketukTerakhir: 0
};

/**
 * Membuka penampil. Menerima:
 * - string  → satu foto (bentuk lama, tetap didukung)
 * - larik   → daftar foto, masing-masing {fotoUrl, judul, keterangan}
 */
function bukaGaleri(sumber, indeksAwal) {
  var daftar = [];
  if (typeof sumber === 'string') {
    if (!sumber) return;
    daftar = [{ fotoUrl: sumber, judul: '', keterangan: '' }];
  } else if (sumber && sumber.length) {
    for (var i = 0; i < sumber.length; i++) {
      var f = sumber[i];
      if (typeof f === 'string') daftar.push({ fotoUrl: f, judul: '', keterangan: '' });
      else if (f && f.fotoUrl) daftar.push(f);
    }
  }
  if (!daftar.length) return;

  _galeri.daftar = daftar;
  _galeri.indeks = Math.min(Math.max(angka(indeksAwal), 0), daftar.length - 1);
  aturSkalaGaleri(1, 0, 0);
  gambarGaleri();

  var el = $('zoomFoto');
  el.classList.add('tampil');
  pasangSentuhGaleri();

  /* Penampil ikut masuk riwayat, supaya tombol Kembali di ponsel
     menutup foto — bukan keluar dari aplikasi. */
  if (!_galeriDiRiwayat) {
    try {
      history.pushState({ tp: 'galeri' }, '', location.hash || '');
      _galeriDiRiwayat = true;
    } catch (e) { /* peramban lama */ }
  }
}

var _galeriDiRiwayat = false;

/** Bentuk lama tetap dipakai di banyak tempat. */
function zoomFoto(url) { bukaGaleri(url, 0); }

function tutupGaleri() {
  if (_galeriDiRiwayat) {
    _galeriDiRiwayat = false;
    try { history.back(); return; } catch (e) { /* lanjut tutup langsung */ }
  }
  tutupGaleriDom();
}

function tutupGaleriDom() {
  var el = $('zoomFoto');
  if (el) el.classList.remove('tampil');
  _galeri.daftar = [];
}

function galeriTerbuka() {
  var el = $('zoomFoto');
  return !!(el && el.classList.contains('tampil'));
}

function gambarGaleri() {
  var f = _galeri.daftar[_galeri.indeks];
  if (!f) return;

  var img = $('zoomFotoImg');
  img.src = f.fotoUrl;
  terapkanTransformGaleri();

  var banyak = _galeri.daftar.length > 1;
  $('galeriHitung').textContent = banyak
    ? (_galeri.indeks + 1) + ' / ' + _galeri.daftar.length : '';
  $('galeriKiri').style.display = banyak ? 'flex' : 'none';
  $('galeriKanan').style.display = banyak ? 'flex' : 'none';

  $('galeriJudul').textContent = f.judul || '';
  $('galeriKet').textContent = f.keterangan || '';

  /* Petak jempol hanya berguna bila fotonya lebih dari satu. */
  var jempol = $('galeriJempol');
  if (!banyak) {
    jempol.innerHTML = '';
    jempol.style.display = 'none';
    return;
  }
  jempol.style.display = 'flex';
  var html = '';
  for (var i = 0; i < _galeri.daftar.length; i++) {
    html += '<img src="' + esc(_galeri.daftar[i].fotoUrl) + '" alt="" ' +
      (i === _galeri.indeks ? 'class="aktif" ' : '') +
      'onclick="keGaleri(' + i + ')">';
  }
  jempol.innerHTML = html;

  /* Deretan jempol digulir dengan menghitung sendiri, bukan dengan
     scrollIntoView. scrollIntoView ikut menggulir wadah induknya, yang
     menggeser seluruh tata letak penampil — termasuk tombol geser. */
  var aktif = jempol.querySelector('img.aktif');
  if (aktif) {
    var tengah = aktif.offsetLeft - (jempol.clientWidth / 2) + (aktif.offsetWidth / 2);
    jempol.scrollLeft = Math.max(0, tengah);
  }
}

function keGaleri(i) {
  if (i < 0 || i >= _galeri.daftar.length) return;
  _galeri.indeks = i;
  /* Perbesaran dikembalikan tiap berpindah foto: foto berikutnya yang
     langsung tampil terpotong pada perbesaran foto sebelumnya membuat
     orang mengira fotonya rusak. */
  aturSkalaGaleri(1, 0, 0);
  gambarGaleri();
}

function geserGaleri(arah) {
  var n = _galeri.daftar.length;
  if (n < 2) return;
  keGaleri((_galeri.indeks + arah + n) % n);
}

function aturSkalaGaleri(skala, x, y) {
  _galeri.skala = Math.min(Math.max(skala, 1), 5);
  if (_galeri.skala === 1) { _galeri.geserX = 0; _galeri.geserY = 0; }
  else { _galeri.geserX = x; _galeri.geserY = y; }
}

function terapkanTransformGaleri() {
  var img = $('zoomFotoImg');
  if (!img) return;
  img.style.transform = 'translate(' + _galeri.geserX + 'px,' + _galeri.geserY +
    'px) scale(' + _galeri.skala + ')';
}

function zoomGaleri(delta) {
  aturSkalaGaleri(_galeri.skala + delta, _galeri.geserX, _galeri.geserY);
  terapkanTransformGaleri();
}

/* ------------------------------------------------------------
   SENTUHAN
   ------------------------------------------------------------ */

var _sentuhTerpasang = false;

function jarakDuaJari(e) {
  var dx = e.touches[0].clientX - e.touches[1].clientX;
  var dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function pasangSentuhGaleri() {
  if (_sentuhTerpasang) return;
  _sentuhTerpasang = true;

  var panggung = $('galeriPanggung');
  var img = $('zoomFotoImg');
  if (!panggung || !img) return;

  panggung.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      _sentuh.jariGanda = true;
      _sentuh.jarakAwal = jarakDuaJari(e);
      _sentuh.skalaAwal = _galeri.skala;
      img.classList.add('geser');
      return;
    }
    if (e.touches.length !== 1) return;
    _sentuh.aktif = true;
    _sentuh.jariGanda = false;
    _sentuh.mulaiX = _sentuh.akhirX = e.touches[0].clientX;
    _sentuh.mulaiY = _sentuh.akhirY = e.touches[0].clientY;
    _sentuh.geserAwalX = _galeri.geserX;
    _sentuh.geserAwalY = _galeri.geserY;
  }, { passive: true });

  panggung.addEventListener('touchmove', function (e) {
    if (_sentuh.jariGanda && e.touches.length === 2) {
      var rasio = jarakDuaJari(e) / (_sentuh.jarakAwal || 1);
      aturSkalaGaleri(_sentuh.skalaAwal * rasio, _galeri.geserX, _galeri.geserY);
      terapkanTransformGaleri();
      e.preventDefault();
      return;
    }
    if (!_sentuh.aktif || e.touches.length !== 1) return;
    _sentuh.akhirX = e.touches[0].clientX;
    _sentuh.akhirY = e.touches[0].clientY;

    /* Saat foto diperbesar, satu jari berarti menggeser isi foto.
       Saat tidak diperbesar, satu jari berarti berpindah foto. */
    if (_galeri.skala > 1) {
      _galeri.geserX = _sentuh.geserAwalX + (_sentuh.akhirX - _sentuh.mulaiX);
      _galeri.geserY = _sentuh.geserAwalY + (_sentuh.akhirY - _sentuh.mulaiY);
      img.classList.add('geser');
      terapkanTransformGaleri();
      e.preventDefault();
    }
  }, { passive: false });

  panggung.addEventListener('touchend', function (e) {
    img.classList.remove('geser');

    if (_sentuh.jariGanda) {
      _sentuh.jariGanda = false;
      _sentuh.aktif = false;
      return;
    }
    if (!_sentuh.aktif) return;
    _sentuh.aktif = false;

    var dx = _sentuh.akhirX - _sentuh.mulaiX;
    var dy = _sentuh.akhirY - _sentuh.mulaiY;
    var bergerak = Math.abs(dx) > 8 || Math.abs(dy) > 8;

    /* Ketuk ganda: memperbesar, atau mengembalikan bila sudah besar.
       Diperiksa lebih dulu karena ketukan tidak menghasilkan gerakan. */
    if (!bergerak) {
      var sekarang = Date.now();
      if (sekarang - _sentuh.ketukTerakhir < 300) {
        aturSkalaGaleri(_galeri.skala > 1 ? 1 : 2.5, 0, 0);
        terapkanTransformGaleri();
        _sentuh.ketukTerakhir = 0;
      } else {
        _sentuh.ketukTerakhir = sekarang;
      }
      return;
    }

    if (_galeri.skala > 1) return;   // sedang menggeser isi foto

    /* Geser mendatar berpindah foto; geser ke bawah menutup penampil —
       kebiasaan yang sudah dikenal dari aplikasi galeri ponsel. */
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      geserGaleri(dx < 0 ? 1 : -1);
    } else if (dy > 90 && Math.abs(dx) < 60) {
      tutupGaleri();
    }
  }, { passive: true });

  /* Ketuk ganda dengan tetikus, untuk pemakaian di komputer. */
  img.addEventListener('dblclick', function () {
    aturSkalaGaleri(_galeri.skala > 1 ? 1 : 2.5, 0, 0);
    terapkanTransformGaleri();
  });

  /* Menekan latar gelap di luar foto menutup penampil. */
  panggung.addEventListener('click', function (e) {
    if (e.target === panggung) tutupGaleri();
  });
}

/* ------------------------------------------------------------
   GALERI DI DALAM HALAMAN
   ------------------------------------------------------------ */

/**
 * Deretan jempol yang dapat digulir mendatar. Menekan salah satunya
 * membuka penampil pada foto itu.
 *
 * Daftar foto disimpan di _galeriSiap supaya penampil tidak perlu
 * menerima seluruh base64 lewat atribut onclick — atribut sepanjang
 * itu membuat HTML membengkak berlipat-lipat.
 */
var _galeriSiap = {};

function galeriHtml(kunci, daftar) {
  if (!daftar || !daftar.length) return '';
  _galeriSiap[kunci] = daftar;
  var html = '<div class="galeri">';
  for (var i = 0; i < daftar.length; i++) {
    html += '<div class="bingkai">' +
      '<img src="' + esc(daftar[i].fotoUrl) + '" alt="" loading="lazy" ' +
      'onclick="bukaGaleriSiap(\'' + jsq(kunci) + '\',' + i + ')">' +
      (daftar[i].judul
        ? '<small>' + esc(daftar[i].judul) + '</small>' : '') +
      '</div>';
  }
  return html + '</div>';
}

function bukaGaleriSiap(kunci, indeks) {
  bukaGaleri(_galeriSiap[kunci] || [], indeks);
}

/* ------------------------------------------------------------
   PEMUATAN FOTO
   ------------------------------------------------------------ */

/* Foto tidak lagi ikut bootstrap, jadi diambil saat dibutuhkan lalu
   disimpan sebentar di memori — membuka petak yang sama dua kali
   berturut-turut tidak perlu mengunduh ulang. */
var _cacheFotoPetak = {};
var _cacheFotoPokok = {};

function ambilFotoPetak(petakId) {
  if (_cacheFotoPetak[petakId]) return Promise.resolve(_cacheFotoPetak[petakId]);
  if (!S.daring) return Promise.resolve([]);
  return panggil('foto_daftar', { petakId: petakId }).then(function (r) {
    var daftar = (r.foto || []).map(function (f) {
      return {
        fotoUrl: f.fotoUrl,
        judul: tglIndo(f.tanggal) + (f.hst ? ' · ' + angka(f.hst) + ' HST' : ''),
        keterangan: [f.judul, f.fase, f.catatan].filter(function (x) {
          return !!x;
        }).join(' · '),
        tanggal: f.tanggal, id: f.id
      };
    });
    _cacheFotoPetak[petakId] = daftar;
    return daftar;
  }).catch(function () { return []; });
}

function ambilFotoPokok(pokokId) {
  if (_cacheFotoPokok[pokokId]) return Promise.resolve(_cacheFotoPokok[pokokId]);
  if (!S.daring) return Promise.resolve([]);
  return panggil('pokok_foto', { pokokId: pokokId }).then(function (r) {
    var daftar = (r.foto || []).map(function (f) {
      return {
        fotoUrl: f.fotoUrl,
        judul: tglIndo(f.tanggal),
        keterangan: [labelCatatanPokok(f.jenis), f.keterangan, f.operator]
          .filter(function (x) { return !!x; }).join(' · '),
        tanggal: f.tanggal, id: f.id
      };
    });
    _cacheFotoPokok[pokokId] = daftar;
    return daftar;
  }).catch(function () { return []; });
}

/** Dipanggil setelah menyimpan foto baru, agar galeri ikut segar. */
function lupakanCacheFoto(petakId, pokokId) {
  if (petakId) delete _cacheFotoPetak[petakId];
  if (pokokId) delete _cacheFotoPokok[pokokId];
}

/**
 * Mengisi wadah galeri yang sudah tergambar. Dipakai karena foto
 * datang belakangan — halaman tidak boleh menunggu foto selesai
 * diunduh sebelum menampilkan apa pun.
 */
function isiGaleriKeWadah(idWadah, kunci, janji, kosongTeks) {
  janji.catch(function () { return []; }).then(function (daftar) {
    var w = $(idWadah);
    if (!w) return;
    if (!daftar.length) {
      w.innerHTML = '<div class="kosong" style="padding:14px">' +
        '<span class="ik">📷</span>' + esc(kosongTeks) + '</div>';
      return;
    }
    w.innerHTML = galeriHtml(kunci, daftar);
  });
}

/* ------------------------------------------------------------
   GALERI DI DALAM POPUP PETA
   ------------------------------------------------------------ */

/* Popup Leaflet digambar ulang tiap kali dibuka, jadi keadaan
   "foto ke berapa" disimpan per kunci di luar popup itu sendiri. */
var _popFoto = {};

function popupGaleriHtml(kunci) {
  return '<div class="popFoto" id="pop_' + esc(kunci) + '">' +
    '<div class="kosong" style="padding:8px;font-size:.7rem">Memuat foto…</div></div>';
}

/**
 * Mengisi galeri di dalam popup setelah fotonya selesai diambil.
 * Bila tidak ada foto sama sekali, seluruh bagiannya dihapus —
 * kotak kosong bertuliskan "tidak ada foto" hanya memakan ruang
 * pada popup yang memang sempit.
 */
function isiPopupGaleri(kunci, janji) {
  janji.then(function (daftar) {
    var w = $('pop_' + kunci);
    if (!w) return;
    if (!daftar.length) { w.innerHTML = ''; return; }
    _popFoto[kunci] = { daftar: daftar, indeks: 0 };
    _galeriSiap[kunci] = daftar;
    gambarPopupGaleri(kunci);
  }).catch(function () {
    /* Kegagalan pengambilan tidak boleh meninggalkan tulisan
       "Memuat foto…" yang menggantung selamanya — pengguna akan
       menunggu sesuatu yang tidak akan pernah datang. */
    var w = $('pop_' + kunci);
    if (w) {
      w.innerHTML = '<small style="color:var(--redup);font-size:.66rem">' +
        'Foto tidak dapat dimuat.</small>';
    }
  });
}

function gambarPopupGaleri(kunci) {
  var st = _popFoto[kunci];
  var w = $('pop_' + kunci);
  if (!st || !w) return;
  var f = st.daftar[st.indeks];
  var banyak = st.daftar.length > 1;

  w.innerHTML = '<div class="bingkaiPop">' +
    (banyak ? '<button type="button" class="navPop kiri" ' +
      'onclick="geserPopupGaleri(\'' + jsq(kunci) + '\',-1)">&#8249;</button>' : '') +
    '<img src="' + esc(f.fotoUrl) + '" alt="" ' +
    'onclick="bukaGaleriSiap(\'' + jsq(kunci) + '\',' + st.indeks + ')">' +
    (banyak ? '<button type="button" class="navPop kanan" ' +
      'onclick="geserPopupGaleri(\'' + jsq(kunci) + '\',1)">&#8250;</button>' +
      '<span class="hitungPop">' + (st.indeks + 1) + '/' + st.daftar.length +
      '</span>' : '') +
    '</div>' +
    '<small style="display:block;color:var(--redup);font-size:.66rem;margin-top:3px">' +
    esc(f.judul || '') + ' · ketuk untuk memperbesar</small>';
}

function geserPopupGaleri(kunci, arah) {
  var st = _popFoto[kunci];
  if (!st) return;
  st.indeks = (st.indeks + arah + st.daftar.length) % st.daftar.length;
  gambarPopupGaleri(kunci);
}

/* modalTutupLalu dipakai, bukan modalTutup lalu lanjut langsung:
