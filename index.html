/* ============================================================
   PETA — peta dasar "bawa kunci sendiri" (BYOK)
   ============================================================
   Aplikasi ini TIDAK memakai ubin peta gratis milik pihak lain
   sebagai bawaan. Alasannya bukan teknis melainkan hukum:

   • Ketentuan ubin OpenStreetMap menyatakan layanannya untuk
     pemakaian ringan, dan akses "may be withdrawn at any point" —
     tidak layak dijadikan tumpuan produk yang dijual.
   • Esri World Imagery bukan layanan bebas; pemakaiannya menuntut
     lisensi ArcGIS dan tidak tersedia untuk keperluan komersial.

   Karena itu bawaannya adalah kisi lokal yang digambar sendiri
   (nol panggilan ke luar), dan pengguna bisa memasang kunci
   penyedia peta atas namanya sendiri: MapTiler, Mapbox, Esri
   berlangganan, atau URL XYZ/WMS/ArcGIS REST milik instansi.
   ============================================================ */

var PENYEDIA_PETA = {
  grid: {
    nama: 'Kisi lokal (tanpa layanan luar)',
    perluKunci: false,
    keterangan: 'Digambar di perangkat. Tidak ada permintaan ke internet sama sekali, ' +
                'jadi tetap jalan penuh saat luring.'
  },
  maptiler: {
    nama: 'MapTiler (satelit / jalan)',
    perluKunci: true,
    url: 'https://api.maptiler.com/maps/{gaya}/{z}/{x}/{y}.jpg?key={kunci}',
    gaya: { jalan: 'streets-v2', satelit: 'satellite', topografi: 'outdoor-v2' },
    atribusi: '&copy; MapTiler &copy; OpenStreetMap contributors',
    daftar: 'https://www.maptiler.com/cloud/'
  },
  mapbox: {
    nama: 'Mapbox',
    perluKunci: true,
    url: 'https://api.mapbox.com/styles/v1/mapbox/{gaya}/tiles/{z}/{x}/{y}?access_token={kunci}',
    gaya: { jalan: 'streets-v12', satelit: 'satellite-streets-v12', topografi: 'outdoors-v12' },
    atribusi: '&copy; Mapbox &copy; OpenStreetMap contributors',
    daftar: 'https://account.mapbox.com/'
  },
  esri: {
    nama: 'Esri (langganan ArcGIS)',
    perluKunci: true,
    url: 'https://ibasemaps-api.arcgis.com/arcgis/rest/services/{gaya}/MapServer/tile/{z}/{y}/{x}?token={kunci}',
    gaya: { jalan: 'World_Street_Map', satelit: 'World_Imagery', topografi: 'World_Topo_Map' },
    atribusi: 'Tiles &copy; Esri',
    daftar: 'https://developers.arcgis.com/'
  },
  kustom: {
    nama: 'URL sendiri (XYZ / ArcGIS REST / WMS)',
    perluKunci: false,
    keterangan: 'Untuk instansi yang punya layanan peta sendiri, mis. layanan ArcGIS REST ' +
                'Badan Informasi Geospasial. Periksa dulu ketentuan pemakaian sumbernya, ' +
                'terutama bila dipakai untuk keperluan komersial.'
  }
};

var _peta = null;
var _lapisanPetak = null;
var _lapisanDasar = null;
var _modeGambar = false;
var _titikGambar = [];
var _penandaGambar = [];
var _garisGambar = null;
var _petaSiap = false;

function adaLeaflet() {
  return typeof L !== 'undefined' && L && L.map;
}

function bersihkanPeta() {
  if (_peta) {
    try { _peta.remove(); } catch (e) {}
    _peta = null; _lapisanPetak = null; _lapisanDasar = null;
  }
  _modeGambar = false;
  _titikGambar = [];
  _penandaGambar = [];
  _garisGambar = null;
  _petaSiap = false;
}

/** Membangun URL ubin dari setelan. Mengembalikan null bila memakai kisi lokal. */
function urlUbin() {
  var penyedia = S.pengaturan.petaPenyedia || 'grid';
  if (penyedia === 'grid') return null;
  if (penyedia === 'kustom') {
    var u = String(S.pengaturan.petaKustomUrl || '').trim();
    if (!u) return null;
    var jenis = S.pengaturan.petaKustomJenis || 'xyz';
    // Atribusi yang diisi pengguna dipakai apa adanya. Sebagian besar penyedia
    // peta mewajibkannya terlihat, dan menggantinya dengan teks buatan sendiri
    // justru membuat pemiliknya melanggar perjanjiannya sendiri.
    var atribusi = String(S.pengaturan.petaAtribusi || '').trim() || 'Sumber peta: instansi';
    if (jenis === 'wms') return { wms: true, url: u, atribusi: atribusi,
                                  lapisan: S.pengaturan.petaKustomLapisan || '' };
    if (jenis === 'arcgis') return { url: urlArcgisUbin(u), atribusi: atribusi };
    return { url: u, atribusi: atribusi };
  }
  var p = PENYEDIA_PETA[penyedia];
  if (!p || !p.url) return null;
  var kunci = String(S.pengaturan.petaKunci || '').trim();
  if (p.perluKunci && !kunci) return null;
  var gaya = p.gaya[S.pengaturan.petaGaya || 'satelit'] || p.gaya.satelit;
  return { url: p.url.replace('{gaya}', gaya).replace('{kunci}', encodeURIComponent(kunci)),
           atribusi: p.atribusi };
}

/**
 * Melengkapi URL layanan ArcGIS REST menjadi pola ubin Leaflet.
 * Perhatikan sumbu ArcGIS TERBALIK dari XYZ biasa: barisnya dulu
 * ({y}) baru kolomnya ({x}).
 */
function urlArcgisUbin(mentah) {
  var u = String(mentah).trim().replace(/\/+$/, '');
  u = u.replace(/\/(export|tile|WMTS)(\/.*)?$/i, '');
  if (!/\/(MapServer|ImageServer)$/i.test(u)) {
    if (/\/MapServer\//i.test(u)) u = u.replace(/(\/MapServer)\/.*$/i, '$1');
  }
  return u + '/tile/{z}/{y}/{x}';
}

function uraiWms(mentah) {
  var u = String(mentah).trim();
  var tanya = u.indexOf('?');
  var dasar = tanya >= 0 ? u.substring(0, tanya) : u;
  var lapisan = '';
  if (tanya >= 0) {
    var query = u.substring(tanya + 1).split('&');
    for (var i = 0; i < query.length; i++) {
      var pasang = query[i].split('=');
      if (String(pasang[0]).toLowerCase() === 'layers') {
        lapisan = decodeURIComponent(pasang[1] || '');
      }
    }
  }
  return { dasar: dasar, lapisan: lapisan };
}

function pusatPeta() {
  var petak = S.data.petak || [];
  for (var i = 0; i < petak.length; i++) {
    if (angka(petak[i].pusatLat)) return [angka(petak[i].pusatLat), angka(petak[i].pusatLng)];
  }
  return [angka(S.pengaturan.petaLat, -7.5326), angka(S.pengaturan.petaLng, 110.5970)];
}

function gambarPeta(idElemen) {
  idElemen = idElemen || 'peta';
  var wadah = $(idElemen);
  if (!wadah) return;

  if (!adaLeaflet()) {
    gambarDenahCadangan(wadah);
    return;
  }

  bersihkanPeta();
  try {
    _peta = L.map(idElemen, {
      center: pusatPeta(),
      zoom: angka(S.pengaturan.petaZoom, 15),
      zoomSnap: 0.5,
      maxZoom: 22,
      attributionControl: true
    });
  } catch (e) {
    gambarDenahCadangan(wadah);
    return;
  }

  var ubin = urlUbin();
  if (ubin && ubin.wms) {
    var w = uraiWms(ubin.url);
    _lapisanDasar = L.tileLayer.wms(w.dasar, {
      layers: ubin.lapisan || w.lapisan, format: 'image/png', transparent: false,
      attribution: ubin.atribusi || ''
    }).addTo(_peta);
    _lapisanDasar.on('tileerror', function () {
      if (!wadah._sudahLapor) {
        wadah._sudahLapor = true;
        toast('Lapisan WMS gagal dimuat. Periksa URL dan nama lapisan di Setelan.', 'galat');
      }
    });
  } else if (ubin && ubin.url) {
    _lapisanDasar = L.tileLayer(ubin.url, {
      maxZoom: 22, maxNativeZoom: 19, attribution: ubin.atribusi || ''
    }).addTo(_peta);
    _lapisanDasar.on('tileerror', function () {
      if (!wadah._sudahLapor) {
        wadah._sudahLapor = true;
        toast('Ubin peta gagal dimuat. Periksa kunci penyedia peta di Setelan.', 'galat');
      }
    });
  } else {
    // Kisi lokal: latar digambar CSS, tidak ada permintaan keluar.
    wadah.classList.add('kisiPeta');
    _peta.attributionControl.addAttribution('Kisi lokal — tanpa layanan peta luar');
  }

  _lapisanPetak = L.layerGroup().addTo(_peta);
  gambarPetakDiPeta();

  _peta.on('click', function (ev) {
    if (!_modeGambar) return;
    tambahTitikGambar(ev.latlng.lat, ev.latlng.lng);
  });

  _petaSiap = true;
  setTimeout(function () { if (_peta) _peta.invalidateSize(); }, 120);
}

function gambarDenahCadangan(wadah) {
  // Leaflet tidak tersedia (mis. gagal dimuat). Aplikasi tetap
  // menampilkan denah sederhana supaya petak masih bisa dilihat
  // hubungannya, bukan layar kosong.
  var petak = S.data.petak || [];
  if (!petak.length) {
    wadah.innerHTML = '<div class="kosong"><span class="ik">🗺️</span>Belum ada petak.</div>';
    return;
  }
  var minLat = 999, maxLat = -999, minLng = 999, maxLng = -999;
  for (var i = 0; i < petak.length; i++) {
    var t = petak[i].koordinat || [];
    for (var j = 0; j < t.length; j++) {
      minLat = Math.min(minLat, t[j][0]); maxLat = Math.max(maxLat, t[j][0]);
      minLng = Math.min(minLng, t[j][1]); maxLng = Math.max(maxLng, t[j][1]);
    }
  }
  if (minLat > maxLat) {
    wadah.innerHTML = '<div class="kosong"><span class="ik">🗺️</span>' +
      'Petak belum punya koordinat.</div>';
    return;
  }
  var rentangLat = Math.max(0.0001, maxLat - minLat);
  var rentangLng = Math.max(0.0001, maxLng - minLng);
  var svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" ' +
            'style="width:100%;height:100%;background:#E3EBDE">';
  for (var p = 0; p < petak.length; p++) {
    var titik = petak[p].koordinat || [];
    if (titik.length < 3) continue;
    var poin = [];
    for (var q = 0; q < titik.length; q++) {
      var x = (titik[q][1] - minLng) / rentangLng * 92 + 4;
      var y = 96 - (titik[q][0] - minLat) / rentangLat * 92;
      poin.push(x.toFixed(2) + ',' + y.toFixed(2));
    }
    svg += '<polygon points="' + poin.join(' ') + '" fill="rgba(79,111,82,.45)" ' +
           'stroke="#3A4D39" stroke-width="0.5"><title>' + esc(petak[p].nama) +
           '</title></polygon>';
  }
  svg += '</svg>';
  wadah.innerHTML = svg;
  wadah.insertAdjacentHTML('beforeend',
    '<div style="position:relative;margin-top:-26px;text-align:center;font-size:.7rem;' +
    'color:#3A4D39;font-weight:700">Denah sederhana — pustaka peta tidak dapat dimuat</div>');
}

var WARNA_FASE = {
  semai: '#8AAE7A', vegetatif: '#4F6F52', pembungaan: '#C7924A',
  pembuahan: '#B4732E', siap_panen: '#B4432E', bera: '#8B9382'
};

function gambarPetakDiPeta() {
  if (!_peta || !_lapisanPetak) return;
  _lapisanPetak.clearLayers();
  var petak = S.data.petak || [];
  var kerusakan = S.data.kerusakan || [];
  var semuaTitik = [];

  for (var i = 0; i < petak.length; i++) {
    var p = petak[i];
    var titik = p.koordinat || [];
    if (titik.length < 3) continue;
    var poligon = L.polygon(titik, gayaPetak(p));
    poligon.bindPopup(popupPetak(p), { maxWidth: 260, minWidth: 210 });
    /* Foto diisi saat popup DIBUKA, bukan saat didaftarkan.
       Leaflet baru menaruh isi popup ke dalam DOM ketika popup terbuka;
       mengisinya lebih awal berarti wadahnya belum ada, dan tulisan
       "Memuat foto…" akan tertinggal di sana selamanya. */
    poligon.on('popupopen', (function (petak) {
      return function () {
        isiPopupGaleri('petak-' + petak.id, ambilFotoPetak(petak.id));
      };
    })(p));
    poligon.addTo(_lapisanPetak);
    for (var j = 0; j < titik.length; j++) semuaTitik.push(titik[j]);

    if (angka(p.pusatLat)) {
      L.marker([angka(p.pusatLat), angka(p.pusatLng)], {
        icon: L.divIcon({ className: '', html: '<div class="petaLabel">' +
          esc(p.nama.length > 22 ? p.nama.substring(0, 21) + '…' : p.nama) + '</div>',
          iconSize: [0, 0] })
      }).addTo(_lapisanPetak);
    }
  }

  for (var k = 0; k < kerusakan.length; k++) {
    var kr = kerusakan[k];
    if (!angka(kr.lat) || String(kr.status) !== 'active') continue;
    L.circleMarker([angka(kr.lat), angka(kr.lng)], {
      radius: 8, color: '#B4432E', fillColor: '#B4432E', fillOpacity: 0.8, weight: 2
    }).bindPopup('<b>🐛 ' + esc(kr.judulGejala) + '</b><br>' + esc(namaPetak(kr.petakId)) +
                 '<br>Tingkat: ' + esc(kr.tingkat) + ' — ' + angka(kr.persenTerdampak) +
                 '% area').addTo(_lapisanPetak);
  }

  if (semuaTitik.length && !_modeGambar) {
    try { _peta.fitBounds(L.latLngBounds(semuaTitik), { padding: [24, 24], maxZoom: 18 }); }
    catch (e) {}
  }
}

/**
 * Gaya batas petak. Nilai yang diisi pengguna diutamakan; bila kosong,
 * warna mengikuti fase pertumbuhan seperti sebelumnya.
 *
 * Ini bukan sekadar hiasan: pada kebun dengan puluhan petak berdampingan,
 * membedakan blok milik siapa atau petak mana yang sudah disurvei jauh
 * lebih mudah lewat warna daripada lewat membaca label satu per satu.
 */
function gayaPetak(p) {
  var bawaan = WARNA_FASE[p.fase] || '#4F6F52';
  var garis = warnaSah(p.warnaGaris) || bawaan;
  var isi = warnaSah(p.warnaIsi) || garis;
  var tebal = angka(p.tebalGaris);
  if (tebal <= 0) tebal = 2;
  if (tebal > 12) tebal = 12;
  var opasitas = p.opasitasIsi === '' || p.opasitasIsi === null ||
                 p.opasitasIsi === undefined ? 0.35 : angka(p.opasitasIsi);
  if (opasitas < 0) opasitas = 0;
  if (opasitas > 1) opasitas = 1;
  return { color: garis, weight: tebal, fillColor: isi, fillOpacity: opasitas };
}

/**
 * Hanya menerima warna heksadesimal. Nilai lain ditolak karena akan
 * masuk apa adanya ke atribut gaya Leaflet — jalur penyuntikan yang
 * tidak perlu dibuka hanya demi kolom warna.
 */
function warnaSah(v) {
  var t = String(v === null || v === undefined ? '' : v).trim();
  return /^#[0-9a-fA-F]{6}$/.test(t) ? t : '';
}

function popupPetak(p) {
  var kom = komoditasByNama(p.komoditas);
  var html = '<b>' + esc(p.nama) + '</b><br>' +
    (kom && kom.ikon ? kom.ikon + ' ' : '') + esc(p.komoditas || '-') +
    (p.varietas ? ' — ' + esc(p.varietas) : '') + '<br>' +
    'Luas: <b>' + rp(p.luasM2) + ' m²</b> (' + (angka(p.luasM2) / 10000).toFixed(3) + ' ha)<br>' +
    'Fase: ' + esc(p.fase) + ' · pH ' + (p.ph || '-') + '<br>' +
    'Petani: ' + esc(p.namaPetani || '-');
  var wa = nomorWa(p.noHp);
  if (wa) {
    html += '<br><a href="https://wa.me/' + wa + '" target="_blank" rel="noopener">' +
            '💬 WhatsApp petani</a>';
  }

  /* Galeri di dalam popup. Wadahnya digambar kosong lebih dulu, lalu
     diisi setelah fotonya selesai diambil — popup tidak boleh menunggu
     unduhan sebelum muncul, terutama di jaringan lambat. */
  var adaFoto = false;
  (S.data.fotoTumbuh || []).forEach(function (f) {
    if (String(f.petakId) === String(p.id) && f.adaFoto !== false) adaFoto = true;
  });
  if (adaFoto) html += popupGaleriHtml('petak-' + p.id);

  html += '<br><button class="tbl kecil" style="margin-top:6px" ' +
    'onclick="detailPetak(\'' + jsq(p.id) + '\')">Buka detail</button>';
  return html;
}

/* ---------- mode menggambar poligon ---------- */
function mulaiGambar() {
  if (!_petaSiap) { toast('Peta belum siap.', 'galat'); return; }
  _modeGambar = true;
  _titikGambar = [];
  bersihkanTitikGambar();
  perbaruiPanelGambar();
  toast('Ketuk peta untuk menambah titik batas. Minimal 3 titik.');
}

function batalGambar() {
  _modeGambar = false;
  _titikGambar = [];
  bersihkanTitikGambar();
  perbaruiPanelGambar();
}

function bersihkanTitikGambar() {
  for (var i = 0; i < _penandaGambar.length; i++) {
    try { _peta.removeLayer(_penandaGambar[i]); } catch (e) {}
  }
  _penandaGambar = [];
  if (_garisGambar) { try { _peta.removeLayer(_garisGambar); } catch (e) {} _garisGambar = null; }
}

function tambahTitikGambar(lat, lng) {
  _titikGambar.push([lat, lng]);
  gambarUlangTitik();
  perbaruiPanelGambar();
}

function hapusTitikTerakhir() {
  _titikGambar.pop();
  gambarUlangTitik();
  perbaruiPanelGambar();
}

function gambarUlangTitik() {
  bersihkanTitikGambar();
  for (var i = 0; i < _titikGambar.length; i++) {
    (function (idx) {
      var m = L.circleMarker(_titikGambar[idx], {
        radius: 6, color: '#B4432E', fillColor: '#fff', fillOpacity: 1, weight: 3
      }).addTo(_peta);
      m.on('click', function (ev) {
        if (ev.originalEvent) ev.originalEvent.stopPropagation();
        _titikGambar.splice(idx, 1);
        gambarUlangTitik();
        perbaruiPanelGambar();
      });
      _penandaGambar.push(m);
    })(i);
  }
  if (_titikGambar.length >= 2) {
    _garisGambar = L.polygon(_titikGambar, {
      color: '#B4432E', weight: 2, dashArray: '5,5', fillOpacity: 0.15
    }).addTo(_peta);
  }
}

function perbaruiPanelGambar() {
  var el = $('panelGambar');
  if (!el) return;
  if (!_modeGambar) {
    el.innerHTML = '<button class="tbl kecil" onclick="mulaiGambar()">✏️ Gambar petak baru</button>' +
      '<button class="tbl sekunder kecil" onclick="titikDariGps()">📍 Rekam dari GPS</button>';
    return;
  }
  var luas = _titikGambar.length >= 3 ? luasPoligonM2(_titikGambar) : 0;
  el.innerHTML =
    '<span class="lencana kuning">Mode gambar: ' + _titikGambar.length + ' titik' +
    (luas ? ' · ± ' + rp(luas) + ' m²' : '') + '</span> ' +
    '<button class="tbl sekunder kecil" onclick="titikDariGps()">📍 Tambah titik dari GPS</button> ' +
    '<button class="tbl sekunder kecil" onclick="hapusTitikTerakhir()">↩️ Hapus titik terakhir</button> ' +
    '<button class="tbl kecil hijau" onclick="simpanGambar()"' +
    (_titikGambar.length < 3 ? ' disabled' : '') + '>✓ Simpan sebagai petak</button> ' +
    '<button class="tbl sekunder kecil" onclick="batalGambar()">Batal</button>';
}

function titikDariGps() {
  if (!navigator.geolocation) { toast('Perangkat tidak mendukung GPS.', 'galat'); return; }
  toast('Mencari posisi GPS…');
  navigator.geolocation.getCurrentPosition(function (pos) {
    if (!_modeGambar) mulaiGambar();
    tambahTitikGambar(pos.coords.latitude, pos.coords.longitude);
    if (_peta) _peta.setView([pos.coords.latitude, pos.coords.longitude], 19);
    toast('Titik ditambahkan (ketelitian ± ' + Math.round(pos.coords.accuracy) + ' m).',
          'sukses');
  }, function (e) {
    toast('GPS gagal: ' + (e.message || 'izin ditolak'), 'galat');
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

/** Luas geodesik — rumus yang sama persis dengan yang dipakai peladen. */
function luasPoligonM2(titik) {
  if (!titik || titik.length < 3) return 0;
  var R = 6378137;
  var jumlah = 0;
  for (var i = 0; i < titik.length; i++) {
    var a = titik[i], b = titik[(i + 1) % titik.length];
    var lat1 = a[0] * Math.PI / 180, lng1 = a[1] * Math.PI / 180;
    var lat2 = b[0] * Math.PI / 180, lng2 = b[1] * Math.PI / 180;
    jumlah += (lng2 - lng1) * (2 + Math.sin(lat1) + Math.sin(lat2));
  }
  return Math.round(Math.abs(jumlah * R * R / 2));
}

function simpanGambar() {
  if (_titikGambar.length < 3) { toast('Minimal 3 titik.', 'galat'); return; }
  var titik = _titikGambar.slice();
  formPetak(null, titik);
}


/* ============================================================
   TAB: DASBOR
   ============================================================ */

function tabDasbor() {
  var petak = S.data.petak || [];
  var panen = S.data.panen || [];
  var biaya = S.data.biaya || [];
  var jadwal = S.data.jadwal || [];
  var kerusakan = S.data.kerusakan || [];

  var luasTotal = 0;
  for (var i = 0; i < petak.length; i++) luasTotal += angka(petak[i].luasM2);

  var pendapatan = 0, kg = 0, piutang = 0;
  for (var j = 0; j < panen.length; j++) {
    pendapatan += angka(panen[j].totalPendapatan);
    kg += angka(panen[j].jumlahKg);
    piutang += Math.max(0, angka(panen[j].totalPendapatan) - angka(panen[j].sudahDibayar));
  }
  var totalBiaya = 0;
  for (var k = 0; k < biaya.length; k++) totalBiaya += angka(biaya[k].nominal);

  var jadwalMenunggu = 0, jadwalDekat = 0;
  for (var m = 0; m < jadwal.length; m++) {
    if (jadwal[m].status !== 'pending') continue;
    jadwalMenunggu++;
    var sel = selisihHari(hariIni(), jadwal[m].tanggal);
    if (sel !== null && sel >= 0 && sel <= 3) jadwalDekat++;
  }
  var kerusakanAktif = 0;
  for (var n = 0; n < kerusakan.length; n++) {
    if (kerusakan[n].status === 'active') kerusakanAktif++;
  }

  var prediksi = prediksiPanenLokal();
  var siapPanen = [];
  for (var p = 0; p < prediksi.length; p++) {
    if (prediksi[p].sisaHari <= 14 && prediksi[p].sisaHari >= -21) siapPanen.push(prediksi[p]);
  }

  var html = '';

  html += '<div class="kartu"><div class="baris">' +
    '<div><h2 style="margin:0">Selamat datang, ' +
    esc(String(S.pengguna.nama).split(' ')[0]) + '</h2>' +
    '<small style="color:var(--redup)">' + esc(S.pengguna.kelompok || '') + ' · ' +
    tglIndo(hariIni(), true) + '</small></div>' +
    '<span class="lencana ' + (S.daring ? 'hijau' : 'kuning') + ' kanan">' +
    (S.daring ? '● Daring' : '○ Luring') + '</span></div></div>';

  html += '<div class="kisi kisi4" style="margin-bottom:12px">' +
    kartuStat('🌾', petak.length, 'Petak Aktif',
              (luasTotal / 10000).toFixed(2) + ' ha total') +
    kartuStat('💰', 'Rp ' + rpSingkat(pendapatan - totalBiaya), 'Laba Bersih',
              'Dari ' + rp(kg) + ' kg panen') +
    kartuStat('🧪', jadwalMenunggu, 'Jadwal Pupuk',
              jadwalDekat ? jadwalDekat + ' dalam 3 hari' : 'Tidak ada yang mendesak') +
    kartuStat('🐛', kerusakanAktif, 'Laporan Hama Aktif',
              kerusakanAktif ? 'Perlu ditindaklanjuti' : 'Kebun aman') +
    '</div>';

  if (piutang > 0) {
    html += '<div class="spanduk kuning"><span>🧾</span><span><b>Piutang panen Rp ' +
      rp(piutang) + '</b>Ada pembayaran pembeli yang belum lunas. ' +
      '<button class="tbl kecil" style="margin-top:6px" onclick="pindah(\'keuangan\')">' +
      'Lihat rincian</button></span></div>';
  }

  /* Tindakan cepat */
  if (bolehUbah()) {
    html += '<div class="kartu"><h3>⚡ Catat cepat</h3>' +
      '<div class="kisi kisi4">' +
      tombolCepat('🌾', 'Panen', 'formPanen()') +
      tombolCepat('💸', 'Biaya', 'formBiaya()') +
      tombolCepat('📋', 'Aktivitas', 'formAktivitas()') +
      tombolCepat('🐛', 'Lapor Hama', 'formKerusakan()') +
      '</div></div>';
  }

  /* Menjelang panen */
  html += '<div class="kartu"><h3>📅 Menjelang panen</h3>';
  if (!siapPanen.length) {
    html += '<div class="kosong"><span class="ik">🌱</span>Belum ada petak yang mendekati ' +
      'masa panen dalam 14 hari ke depan.</div>';
  } else {
    for (var q = 0; q < Math.min(siapPanen.length, 5); q++) {
      var s = siapPanen[q];
      var lencana = s.sisaHari <= 0 ? '<span class="lencana merah">Sudah waktunya</span>'
        : '<span class="lencana ' + (s.sisaHari <= 7 ? 'kuning' : 'hijau') + '">' +
          s.sisaHari + ' hari lagi</span>';
      html += '<div class="item"><div class="ikon">' + (s.ikon || '🌾') + '</div>' +
        '<div class="isi"><b>' + esc(s.nama) + '</b>' +
        '<small>' + esc(s.komoditas) + ' · perkiraan ' + rp(s.perkiraanKg) + ' kg · ' +
        (s.berbasisRiwayat ? 'berdasar riwayat panen' : 'perkiraan bawaan komoditas') +
        '</small><div class="batang" style="margin-top:5px"><i style="width:' +
        Math.min(100, s.persen) + '%"></i></div></div>' +
        '<div class="nilai">' + lencana + '<br><small style="color:var(--redup)">Rp ' +
        rpSingkat(s.perkiraanRp) + '</small></div></div>';
    }
  }
  html += '</div>';

  /* Jadwal terdekat */
  html += '<div class="kartu"><h3>🧪 Jadwal pemupukan terdekat</h3>';
  var jadwalUrut = jadwal.filter(function (x) { return x.status === 'pending'; })
    .sort(function (a, b) { return String(a.tanggal) < String(b.tanggal) ? -1 : 1; });
  if (!jadwalUrut.length) {
    html += '<div class="kosong"><span class="ik">✅</span>Tidak ada jadwal tertunda.</div>';
  } else {
    for (var r = 0; r < Math.min(jadwalUrut.length, 5); r++) {
      var jd = jadwalUrut[r];
      var sel2 = selisihHari(hariIni(), jd.tanggal);
      html += '<div class="item"><div class="ikon">🧪</div><div class="isi">' +
        '<b>' + esc(jd.jenisPupuk) + '</b><small>' + esc(namaPetak(jd.petakId)) + ' · ' +

/* ============================================================
   PREDIKSI PANEN — dihitung di klien agar tetap jalan luring.
   Rumusnya sengaja SAMA PERSIS dengan apiPrediksiPanen di peladen;
   kalau berbeda, angka di layar akan berbeda dengan angka di
   laporan dan pengguna kehilangan kepercayaan pada keduanya.
   ============================================================ */

function prediksiPanenLokal(acuan) {
  acuan = acuan || hariIni();
  var petak = S.data.petak || [];
  var panen = S.data.panen || [];
  var hasil = [];

  for (var i = 0; i < petak.length; i++) {
    var p = petak[i];
    if (p.statusLahan === 'Tidak Aktif' || !p.tanggalTanam) continue;
    var kom = komoditasByNama(p.komoditas);
    var siklus = kom ? angka(kom.siklusHari, 90) : 90;
    if (siklus <= 0) siklus = 90;

    var umur = selisihHari(p.tanggalTanam, acuan);
    if (umur === null) continue;

    var namaKom = String(p.komoditas || '').toLowerCase();
    var kgLalu = 0, rpLalu = 0, catatan = 0, kgPetakIni = 0;
    for (var j = 0; j < panen.length; j++) {
      var nk = String(panen[j].komoditas || '').toLowerCase();
      if (namaKom && nk && (nk.indexOf(namaKom) >= 0 || namaKom.indexOf(nk) >= 0)) {
        kgLalu += angka(panen[j].jumlahKg);
        rpLalu += angka(panen[j].totalPendapatan);
        catatan++;
      }
      if (String(panen[j].petakId) === String(p.id)) kgPetakIni += angka(panen[j].jumlahKg);
    }

    var harga = kom ? angka(kom.hargaPerKg, 15000) : 15000;
    if (catatan > 0 && kgLalu > 0) harga = Math.round(rpLalu / kgLalu);

    var hasilPerM2 = kom ? angka(kom.hasilPerM2, 1) : 1;
    if (kgPetakIni > 0 && angka(p.luasM2) > 0) {
      hasilPerM2 = kgPetakIni / angka(p.luasM2);
    }

    var perkiraanKg = Math.round(angka(p.luasM2) * hasilPerM2);
    hasil.push({
      petakId: p.id, nama: p.nama, komoditas: p.komoditas, varietas: p.varietas,
      ikon: kom ? kom.ikon : '🌾', tanggalTanam: p.tanggalTanam, fase: p.fase,
      luasM2: angka(p.luasM2), umurHari: umur, sisaHari: siklus - umur,
      persen: Math.max(0, Math.min(100, Math.round(umur / siklus * 100))),
      mulaiPanen: p.perkiraanPanen || tambahHari(p.tanggalTanam, siklus - 5),
      selesaiPanen: tambahHari(p.tanggalTanam, siklus + 7),
      perkiraanKg: perkiraanKg, hargaPerKg: harga, perkiraanRp: perkiraanKg * harga,
      berbasisRiwayat: (catatan > 0 || kgPetakIni > 0)
    });
  }
  hasil.sort(function (a, b) { return a.sisaHari - b.sisaHari; });
  return hasil;
}

/* ---------- ekspor / impor GeoJSON ---------- */
function unduhGeojson() {
  var fitur = [];
  var petak = S.data.petak || [];
  for (var i = 0; i < petak.length; i++) {
    var p = petak[i];
    var titik = p.koordinat || [];
    if (titik.length < 3) continue;
    var cincin = [];
    for (var j = 0; j < titik.length; j++) cincin.push([titik[j][1], titik[j][0]]);
    cincin.push([titik[0][1], titik[0][0]]);
    fitur.push({
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [cincin] },
      properties: {
        id: p.id, nama: p.nama, petani: p.namaPetani, komoditas: p.komoditas,
        varietas: p.varietas, luas_m2: angka(p.luasM2),
        luas_ha: Number((angka(p.luasM2) / 10000).toFixed(4)),
        tanam: p.tanggalTanam, panen: p.perkiraanPanen, fase: p.fase, ph: p.ph,
        kelompok: p.kelompok, status: p.statusLahan
      }
    });
  }
  if (!fitur.length) { toast('Belum ada petak berkoordinat untuk diekspor.', 'galat'); return; }
  var isi = JSON.stringify({ type: 'FeatureCollection', name: 'TaniPintar_Petak',
                             features: fitur }, null, 2);
  unduhBerkas('petak-tanipintar-' + hariIni() + '.geojson', isi, 'application/geo+json');
  toast(fitur.length + ' petak diekspor.', 'sukses');
}

function unduhBerkas(nama, isi, tipe) {
  try {
    var blob = new Blob([isi], { type: tipe || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nama;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  } catch (e) {
    modalBuka('Salin isi berkas',
      '<p>Peramban tidak mengizinkan unduhan langsung. Salin teks berikut ' +
      'lalu simpan sendiri sebagai <b>' + esc(nama) + '</b>.</p>' +
      '<textarea rows="12" onclick="this.select()">' + esc(isi) + '</textarea>');
  }
}

function imporGeojson() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.geojson,.json,application/geo+json,application/json';
  input.onchange = function () {
    var berkas = input.files && input.files[0];
    if (!berkas) return;
    var pembaca = new FileReader();
    pembaca.onload = function () {
      var gj;
      try { gj = JSON.parse(pembaca.result); }
      catch (e) { toast('Berkas bukan GeoJSON yang sah.', 'galat'); return; }
      var jumlah = (gj.features || []).length;
      if (!jumlah) { toast('Berkas tidak berisi fitur.', 'galat'); return; }
      konfirmasi('Impor ' + jumlah + ' fitur?',
        'Setiap poligon akan menjadi petak baru. Luasnya dihitung ulang dari geometri, ' +
        'bukan dari atribut berkas.',
        function () {
          if (!S.daring) { toast('Impor memerlukan sambungan internet.', 'galat'); return; }
          panggil('petak_impor', { geojson: gj }).then(function (r) {
            toast(r.masuk + ' petak diimpor, ' + r.dilewati + ' dilewati.', 'sukses');
            muatData();
          }).catch(function (e) { toast(e.message, 'galat'); });
        }, 'Impor');
    };
    pembaca.readAsText(berkas);
  };
  input.click();
}

function tabKeuangan() {

/**
 * Laba rugi dihitung di klien dengan rumus yang identik dengan
 * apiLabaRugi di peladen, supaya angkanya tetap muncul saat luring
 * dan tidak pernah berbeda dengan angka di lembar.
 */
function hitungLabaRugi(dari, sampai) {
  var petak = S.data.petak || [];
  var perPetak = {};
  for (var i = 0; i < petak.length; i++) {
    perPetak[petak[i].id] = {
      petakId: petak[i].id, nama: petak[i].nama, komoditas: petak[i].komoditas,
      luasM2: angka(petak[i].luasM2), biaya: 0, pendapatan: 0, kg: 0, piutang: 0
    };
  }
  var lain = { petakId: '', nama: '(tanpa petak)', komoditas: '', luasM2: 0,
               biaya: 0, pendapatan: 0, kg: 0, piutang: 0 };

  function dalam(t) {
    var s = String(t || '');
    if (!s) return false;
    if (dari && s < dari) return false;
    if (sampai && s > sampai) return false;
    return true;
  }

  (S.data.biaya || []).forEach(function (b) {
    if (!dalam(b.tanggal)) return;
    (perPetak[b.petakId] || lain).biaya += angka(b.nominal);
  });
  (S.data.panen || []).forEach(function (h) {
    if (!dalam(h.tanggal)) return;
    var t = perPetak[h.petakId] || lain;
    t.pendapatan += angka(h.totalPendapatan);
    t.kg += angka(h.jumlahKg);
    t.piutang += Math.max(0, angka(h.totalPendapatan) - angka(h.sudahDibayar));
  });

  var daftar = [];
  for (var k in perPetak) daftar.push(perPetak[k]);
  if (lain.biaya || lain.pendapatan) daftar.push(lain);

  var total = { biaya: 0, pendapatan: 0, kg: 0, piutang: 0 };
  daftar.forEach(function (r) {
    r.laba = r.pendapatan - r.biaya;
    r.bepPerKg = r.kg > 0 ? Math.round(r.biaya / r.kg) : 0;
    r.labaPerM2 = r.luasM2 > 0 ? Math.round(r.laba / r.luasM2) : 0;
    total.biaya += r.biaya; total.pendapatan += r.pendapatan;
    total.kg += r.kg; total.piutang += r.piutang;
  });
  total.laba = total.pendapatan - total.biaya;
  total.marginPersen = total.pendapatan > 0
    ? Math.round(total.laba / total.pendapatan * 1000) / 10 : 0;
  total.bepPerKg = total.kg > 0 ? Math.round(total.biaya / total.kg) : 0;
  daftar.sort(function (a, b) { return b.laba - a.laba; });
  return { baris: daftar, total: total };
}

              rp(r.total.kg) + ' kg terjual') +

              'Margin ' + r.total.marginPersen + '%') +
    kartuStat('🧾', 'Rp ' + rpSingkat(r.total.piutang), 'Piutang', 'Belum dibayar pembeli') +

  if (r.total.bepPerKg > 0) {

      rp(r.total.bepPerKg) + ' per kg</b>Selama harga jual di atas angka ini, panen Anda ' +
      'masih menutup biaya. Ini angka yang paling berguna saat menawar dengan pengepul.' +
      '</span></div>';
  }

  html += '<div class="kartu"><h3>Rincian per petak</h3>';
  if (!r.baris.length) {
    html += '<div class="kosong"><span class="ik">📊</span>Belum ada data pada rentang ini.</div>';
  } else {
    html += '<div class="gulir"><table><thead><tr><th>Petak</th>' +
      '<th class="angka">Biaya</th><th class="angka">Pendapatan</th>' +
      '<th class="angka">Laba</th><th class="angka">BEP/kg</th>' +
      '<th class="angka">Laba/m²</th></tr></thead><tbody>';
    for (var i = 0; i < r.baris.length; i++) {
      var b = r.baris[i];
      html += '<tr><td><b>' + esc(b.nama) + '</b><br><small style="color:var(--redup)">' +
        esc(b.komoditas || '-') + '</small></td>' +
        '<td class="angka">' + rp(b.biaya) + '</td>' +
        '<td class="angka">' + rp(b.pendapatan) + '</td>' +
        '<td class="angka" style="color:' + (b.laba >= 0 ? 'var(--sukses)' : 'var(--bahaya)') +
        ';font-weight:800">' + rp(b.laba) + '</td>' +
        '<td class="angka">' + (b.bepPerKg ? rp(b.bepPerKg) : '-') + '</td>' +
        '<td class="angka">' + (b.labaPerM2 ? rp(b.labaPerM2) : '-') + '</td></tr>';
    }
    html += '</tbody><tfoot><tr style="font-weight:800"><td>TOTAL</td>' +
      '<td class="angka">' + rp(r.total.biaya) + '</td>' +
      '<td class="angka">' + rp(r.total.pendapatan) + '</td>' +
      '<td class="angka">' + rp(r.total.laba) + '</td>' +
      '<td class="angka">' + (r.total.bepPerKg ? rp(r.total.bepPerKg) : '-') + '</td>' +
      '<td class="angka"></td></tr></tfoot></table></div>';
  }
  html += '</div>';
  return html;
}

function tagihWa(idPanen) {
  var panen = null;
  (S.data.panen || []).forEach(function (p) { if (p.id === idPanen) panen = p; });
  if (!panen) return;
  var pembeli = null;
  (S.data.pembeli || []).forEach(function (x) { if (x.id === panen.pembeliId) pembeli = x; });
  var wa = pembeli ? nomorWa(pembeli.noHp) : '';
  if (!wa) { toast('Nomor pembeli belum dicatat.', 'galat'); return; }
  var sisa = angka(panen.totalPendapatan) - angka(panen.sudahDibayar);
  var pesan = 'Assalamualaikum, Bapak/Ibu ' + (pembeli.nama || '') + '.\n\n' +
    'Mohon konfirmasi pembayaran untuk transaksi:\n' +
    '• Komoditas: ' + panen.komoditas + '\n' +
    '• Tanggal: ' + tglIndo(panen.tanggal, true) + '\n' +
    '• Jumlah: ' + rp(panen.jumlahKg) + ' kg\n' +
    '• Nilai: Rp ' + rp(panen.totalPendapatan) + '\n' +
    '• Sudah dibayar: Rp ' + rp(panen.sudahDibayar) + '\n' +
    '• Sisa: Rp ' + rp(sisa) + '\n\n' +
    'Terima kasih atas kerja samanya.\n' + (S.pengguna ? S.pengguna.nama : '');
  bukaTautan('https://wa.me/' + wa + '?text=' + encodeURIComponent(pesan));
}

  html += '<div class="kisi kisi3" style="margin-bottom:10px">' +
    kartuStat('⏳', menunggu.length, 'Menunggu', '') +
    kartuStat('✅', selesai.length, 'Selesai', '') +
    kartuStat('⏸️', tunda.length, 'Ditunda', '') + '</div>';

  if (!menunggu.length) {
    html += '<div class="kosong"><span class="ik">✅</span>Tidak ada jadwal tertunda.</div>';
  } else {
    for (var i = 0; i < menunggu.length; i++) {
      html += kartuJadwal(menunggu[i]);
    }
  }
  html += '</div>';

  if (selesai.length) {
    html += '<div class="kartu"><h3>Riwayat pemupukan</h3>';
    var urut = selesai.slice().sort(function (a, b) {
      return String(b.tanggal) < String(a.tanggal) ? -1 : 1;
    });
    for (var j = 0; j < Math.min(urut.length, 12); j++) {
      var s = urut[j];
      html += '<div class="item"><div class="ikon">✅</div><div class="isi">' +
        '<b>' + esc(s.jenisPupuk) + '</b><small>' + esc(namaPetak(s.petakId)) + ' · ' +
        esc(s.dosis) + '</small></div>' +
        '<div class="nilai"><small style="color:var(--redup)">' + tglIndo(s.tanggal) +
        '</small></div></div>';
    }
    html += '</div>';
  }
  return html;
}

function kartuJadwal(j) {
  var sel = selisihHari(hariIni(), j.tanggal);
  var petak = petakById(j.petakId);
  var item = j.itemId ? itemById(j.itemId) : null;
  var stokKurang = item && angka(j.jumlahPakai) > angka(item.stok);

  var warna = sel === null ? 'abu' : (sel < 0 ? 'merah' : (sel <= 2 ? 'kuning' : 'hijau'));
  var labelWaktu = sel === null ? tglIndo(j.tanggal)
    : (sel < 0 ? 'Terlewat ' + (-sel) + ' hari'
      : (sel === 0 ? 'Hari ini' : (sel === 1 ? 'Besok' : sel + ' hari lagi')));

  var html = '<div class="item"><div class="ikon">🧪</div><div class="isi">' +
    '<b>' + esc(j.jenisPupuk) + '</b>' + (j._menunggu ? ' ⏳' : '') +
    '<small>' + esc(namaPetak(j.petakId)) + ' · ' + esc(j.dosis) + '</small>' +
    (j.catatan ? '<small>' + esc(j.catatan) + '</small>' : '') +
    (item ? '<small>Ambil dari stok: ' + esc(item.nama) + ' ' + angka(j.jumlahPakai) + ' ' +
      esc(item.satuan) + (stokKurang
        ? ' <span style="color:var(--bahaya);font-weight:700">— stok kurang (tersedia ' +
          angka(item.stok) + ')</span>' : '') + '</small>' : '');

  if (bolehUbah()) {
    html += '<div class="baris takCetak" style="margin-top:6px">' +
      '<button class="tbl kecil hijau" onclick="tandaiJadwal(\'' + jsq(j.id) +
      '\',\'completed\')">✓ Selesai</button>' +
      '<button class="tbl sekunder kecil" onclick="tandaiJadwal(\'' + jsq(j.id) +
      '\',\'postponed\')">⏸️ Tunda</button>' +
      (petak && nomorWa(petak.noHp)
        ? '<button class="tbl sekunder kecil" onclick="ingatkanWa(\'' + jsq(j.id) +
          '\')">💬 Ingatkan</button>' : '') +
      '<button class="tbl sekunder kecil" onclick="formJadwal(\'' + jsq(j.id) +
      '\')">✏️</button>' +
      '<button class="tbl sekunder kecil" onclick="hapusUmum(\'jadwal_hapus\',\'' +
      jsq(j.id) + '\',\'jadwal pemupukan\')">🗑️</button></div>';
  }
  html += '</div><div class="nilai"><span class="lencana ' + warna + '">' + labelWaktu +
    '</span><br><small style="color:var(--redup)">' + tglIndo(j.tanggal) + '</small></div></div>';
  return html;
}

function tandaiJadwal(id, status) {
  ubah('jadwal_status', { id: id, status: status },
       { pesan: status === 'completed' ? 'Ditandai selesai. Stok ikut disesuaikan.'
                                       : 'Jadwal ditunda.' })
    .catch(function (e) { toast(e.message, 'galat'); });
}

function ingatkanWa(idJadwal) {
  var j = null;
  (S.data.jadwal || []).forEach(function (x) { if (x.id === idJadwal) j = x; });
  if (!j) return;
  var petak = petakById(j.petakId);
  if (!petak) return;
  var wa = nomorWa(petak.noHp);
  if (!wa) { toast('Nomor HP petani belum diisi pada data petak.', 'galat'); return; }
  var pesan = '*[' + (S.pengaturan.namaAplikasi || 'TaniPintar') + ' — Pengingat Pemupukan]*\n\n' +
    'Halo Bapak/Ibu ' + (petak.namaPetani || '') + ',\n\n' +
    '📌 Agenda: Pemupukan ' + j.jenisPupuk + '\n' +
    '🗓️ Tanggal: ' + tglIndo(j.tanggal, true) + '\n' +
    '🌾 Petak: ' + petak.nama + '\n' +
    '⚖️ Dosis: ' + j.dosis + '\n' +
    (j.catatan ? '📝 Catatan: ' + j.catatan + '\n' : '') +
    '\nPastikan tanah lembab saat memupuk dan hindari waktu terik.\n\nSalam,\n' +
    (S.pengguna ? S.pengguna.nama : '');
  bukaTautan('https://wa.me/' + wa + '?text=' + encodeURIComponent(pesan));
}

function bagianKalkulator() {

  var opsiPetak = [{ v: '', l: '— isi manual —' }];
  petak.forEach(function (p) { opsiPetak.push({ v: p.id, l: p.nama }); });

  var jenisPupuk = ['Bokashi / Kompos', 'Pupuk Kandang', 'POC (Pupuk Organik Cair)',
    'NPK 16-16-16', 'Urea', 'SP-36', 'KCl / MOP', 'Dolomit / Kapur Pertanian'];

  var html = '<div class="kartu"><h3>⚖️ Kalkulator Dosis Pupuk</h3>' +
    '<p style="font-size:.82rem;color:var(--redup)">Hitung kebutuhan pupuk berdasarkan ' +
    'luas lahan, jenis komoditas, dan pH tanah. Hasilnya perkiraan lapangan — uji tanah ' +
    'laboratorium tetap lebih akurat.</p>' +
    '<label class="ruas"><span class="nama">Ambil data dari petak</span>' +
    '<select id="kalPetak" onchange="isiDariPetak()">' +
    opsiPetak.map(function (o) {
      return '<option value="' + esc(o.v) + '">' + esc(o.l) + '</option>';
    }).join('') + '</select></label>' +
    '<div class="kisi kisi2">' +
    '<label class="ruas"><span class="nama">Luas lahan (m²)</span>' +
    '<input type="number" id="kalLuas" value="1000" inputmode="decimal"></label>' +
    '<label class="ruas"><span class="nama">Komoditas</span>' +
    '<input type="text" id="kalKomoditas" value="Cabai" placeholder="mis. Cabai Rawit"></label>' +
    '<label class="ruas"><span class="nama">Jenis pupuk</span><select id="kalJenis">' +
    jenisPupuk.map(function (j) { return '<option>' + esc(j) + '</option>'; }).join('') +
    '</select></label>' +
    '<label class="ruas"><span class="nama">pH tanah (opsional)</span>' +
    '<input type="number" id="kalPh" step="0.1" placeholder="mis. 6.4" inputmode="decimal">' +
    '<span class="bantu">Isi bila sudah pernah diukur — dosis disesuaikan.</span></label>' +
    '</div>' +
    '<button class="tbl lebar" onclick="hitungDosis()">Hitung kebutuhan</button>' +
    '<div id="hasilDosis" style="margin-top:12px"></div></div>';
  return html;
}

function isiDariPetak() {
  var id = ($('kalPetak') || {}).value;
  if (!id) return;
  var p = petakById(id);
  if (!p) return;
  if ($('kalLuas')) $('kalLuas').value = angka(p.luasM2);
  if ($('kalKomoditas')) $('kalKomoditas').value = p.komoditas || '';
  if ($('kalPh') && p.ph) $('kalPh').value = p.ph;
}

/* Perhitungan dosis dikerjakan di klien dengan tabel yang sama seperti
   di peladen, supaya kalkulator tetap bisa dipakai di kebun tanpa sinyal. */
var DOSIS_KLIEN = [
  { cocok: ['bokashi', 'kandang', 'kompos'], kgPerM2: 0.25, satuan: 'kg',
    cara: 'Campurkan ke tanah bedengan 7 hari sebelum tanam, atau tabur melingkar di luar tajuk.',
    waktu: 'Sore hari setelah pukul 15.30' },
  { cocok: ['poc', 'cair'], kgPerM2: 0.05, satuan: 'liter',
    cara: 'Encerkan 500 ml POC dalam 1 tangki 16 liter air. Semprot bawah daun atau kocor ' +
          '200 ml per rumpun.',
    waktu: 'Pagi 06.30-08.00 saat stomata terbuka' },
  { cocok: ['npk'], kgPerM2: 0.02, satuan: 'kg',
    cara: 'Tugal sedalam 5 cm berjarak 10 cm dari pangkal batang, atau larutkan 5 sendok ' +
          'makan dalam 10 liter air untuk dikocor.',
    waktu: 'Pagi hari saat tanah lembab' },
  { cocok: ['urea'], kgPerM2: 0.015, satuan: 'kg',
    cara: 'Tabur dalam larikan lalu tutup tanah tipis agar nitrogen tidak menguap.',
    waktu: 'Pagi hari, tanah harus lembab' },
  { cocok: ['sp-36', 'sp36', 'fosfat'], kgPerM2: 0.02, satuan: 'kg',
    cara: 'Berikan sekaligus sebagai pupuk dasar saat olah tanah.', waktu: 'Saat olah tanah' },
  { cocok: ['kcl', 'mop', 'kalium'], kgPerM2: 0.015, satuan: 'kg',
    cara: 'Tugal melingkar saat fase pembungaan dan pembesaran buah.',
    waktu: 'Awal fase generatif' },
  { cocok: ['dolomit', 'kapur'], kgPerM2: 0.1, satuan: 'kg',
    cara: 'Tabur merata saat olah tanah, minimal 2 minggu sebelum pupuk lain.',
    waktu: '2-3 minggu sebelum tanam' }
];
var FAKTOR_KLIEN = { 'cabai': 1.2, 'bawang merah': 1.0, 'jagung': 0.9, 'padi': 0.85,
  'tomat': 1.15, 'kelapa sawit': 1.3, 'durian': 1.4, 'alpukat': 1.25, 'kopi': 1.1,
  'kakao': 1.1, 'kelapa': 1.0 };

function hitungDosis() {
  var luas = angka(($('kalLuas') || {}).value);
  var jenis = String(($('kalJenis') || {}).value || '').toLowerCase();
  var komoditas = String(($('kalKomoditas') || {}).value || '').toLowerCase();
  var ph = angka(($('kalPh') || {}).value, 0);
  var wadah = $('hasilDosis');
  if (luas <= 0) { toast('Luas lahan harus lebih dari 0.', 'galat'); return; }

  var basis = null;
  for (var i = 0; i < DOSIS_KLIEN.length && !basis; i++) {
    for (var j = 0; j < DOSIS_KLIEN[i].cocok.length; j++) {
      if (jenis.indexOf(DOSIS_KLIEN[i].cocok[j]) >= 0) { basis = DOSIS_KLIEN[i]; break; }
    }
  }
  if (!basis) basis = { kgPerM2: 0.2, satuan: 'kg', cara: 'Ikuti anjuran kemasan pupuk.',
                        waktu: 'Pagi atau sore hari' };

  var faktor = 1;
  for (var k in FAKTOR_KLIEN) if (komoditas.indexOf(k) >= 0) { faktor = FAKTOR_KLIEN[k]; break; }

  var faktorPh = 1, catatanPh = '';
  if (ph > 0) {
    if (ph < 5.5) {
      faktorPh = 0.85;
      catatanPh = 'pH ' + ph + ' tergolong masam. Dosis pupuk kimia diturunkan 15% karena ' +
        'sebagian hara akan terikat dan tidak terserap. Dahulukan pengapuran dolomit.';
    } else if (ph > 7.5) {
      faktorPh = 1.1;
      catatanPh = 'pH ' + ph + ' tergolong basa. Fosfat mudah terikat kalsium, dosis ' +
        'dinaikkan 10%.';
    } else {
      catatanPh = 'pH ' + ph + ' berada pada rentang ideal — hara terserap optimal.';
    }
  }

  var jumlah = Math.round(basis.kgPerM2 * luas * faktor * faktorPh * 10) / 10;
  var bagian = Math.ceil(luas / 500);
  var perBagian = Math.round(jumlah / bagian * 100) / 100;

  wadah.innerHTML =
    '<div class="kartu" style="background:var(--latar);margin:0">' +
    '<div style="text-align:center;padding:6px 0 10px">' +
    '<div style="font-size:2rem;font-weight:800;line-height:1">' + jumlah + '</div>' +
    '<div style="font-size:.8rem;color:var(--redup);font-weight:700">' +
    esc(basis.satuan) + ' untuk ' + rp(luas) + ' m²</div></div>' +
    (catatanPh ? '<div class="spanduk ' + (faktorPh === 1 ? 'hijau' : 'kuning') +
      '"><span>⚗️</span><span>' + esc(catatanPh) + '</span></div>' : '') +
    '<div class="item"><div class="ikon">📏</div><div class="isi"><b>Cara aplikasi</b>' +
    '<small>' + esc(basis.cara) + '</small></div></div>' +
    '<div class="item"><div class="ikon">🕐</div><div class="isi"><b>Waktu terbaik</b>' +
    '<small>' + esc(basis.waktu) + '</small></div></div>' +
    '<div class="item"><div class="ikon">🪣</div><div class="isi"><b>Pembagian di lapangan</b>' +
    '<small>Bagi lahan menjadi ' + bagian + ' bagian, masing-masing ± ' + perBagian + ' ' +
    esc(basis.satuan) + ' per 500 m², agar sebarannya merata.</small></div></div>' +
    '<div class="spanduk biru"><span>ℹ️</span><span>Angka ini perkiraan berbasis luas, ' +
    'komoditas, dan pH. Hasil uji tanah laboratorium tetap lebih akurat.</span></div>' +
    (bolehUbah() ? '<button class="tbl lebar" onclick="jadwalkanDariKalkulator(' + jumlah +
      ',\'' + jsq(basis.satuan) + '\')">📅 Jadwalkan pemupukan ini</button>' : '') +
    '</div>';
}

function jadwalkanDariKalkulator(jumlah, satuan) {
  var idPetak = ($('kalPetak') || {}).value || '';
  var jenis = ($('kalJenis') || {}).value || '';
  formJadwal(null, { petakId: idPetak, jenisPupuk: jenis,
                     dosis: jumlah + ' ' + satuan + ' total' });
}

function tabKerusakan() {
  var laporan = (S.data.kerusakan || []).slice().sort(function (a, b) {
    return String(b.tanggal) < String(a.tanggal) ? -1 : 1;
  });
  var aktif = laporan.filter(function (r) { return r.status === 'active'; });
  var rugiTotal = 0;
  laporan.forEach(function (r) { rugiTotal += angka(r.perkiraanRugiRp); });

  var html = '<div class="kisi kisi3" style="margin-bottom:12px">' +
    kartuStat('🐛', aktif.length, 'Laporan Aktif', 'Perlu ditindaklanjuti') +
    kartuStat('📋', laporan.length, 'Total Laporan', '') +
    kartuStat('💔', 'Rp ' + rpSingkat(rugiTotal), 'Perkiraan Kerugian', '') + '</div>';

  html += '<div class="kartu"><div class="baris" style="margin-bottom:8px">' +
    '<h3 style="margin:0">🐛 Laporan Kerusakan Tanaman</h3>' +
    (bolehUbah() ? '<button class="tbl kecil kanan" onclick="formKerusakan()">+ Lapor</button>'
      : '') + '</div>';

  if (!laporan.length) {
    html += '<div class="kosong"><span class="ik">🌿</span>Belum ada laporan kerusakan. ' +
      'Semoga kebun tetap sehat.</div>';
  } else {
    for (var i = 0; i < laporan.length; i++) {
      html += kartuKerusakan(laporan[i]);
    }
  }
  return html + '</div>';
}

function kartuKerusakan(r) {
  var warna = r.tingkat === 'Kritis / Puso' ? 'merah'
    : (r.tingkat === 'Berat' ? 'merah' : (r.tingkat === 'Sedang' ? 'kuning' : 'abu'));
  var html = '<div class="item"><div class="ikon">' +
    (r.status === 'active' ? '🐛' : '✅') + '</div><div class="isi">' +
    '<b>' + esc(r.judulGejala) + '</b>' + (r._menunggu ? ' ⏳' : '') +
    '<small>' + esc(namaPetak(r.petakId)) + ' · ' + esc(r.komoditas || '-') + ' · ' +
    tglIndo(r.tanggal, true) + '</small>' +
    '<small>' + esc(String(r.deskripsi || '').substring(0, 130)) +
    (String(r.deskripsi || '').length > 130 ? '…' : '') + '</small>';

  if (r.diagnosaAi && r.diagnosaAi.namaHamaPenyakit) {
    html += '<small style="color:var(--utama2);font-weight:700">🔬 ' +
      esc(r.diagnosaAi.namaHamaPenyakit) +
      (r.diagnosaAi.keyakinan ? ' (' + r.diagnosaAi.keyakinan + '%)' : '') + '</small>';
  }
  html += '<div class="baris takCetak" style="margin-top:6px">' +
    '<button class="tbl sekunder kecil" onclick="detailKerusakan(\'' + jsq(r.id) +
    '\')">Detail</button>' +
    (bolehUbah() && r.status === 'active'
      ? '<button class="tbl kecil hijau" onclick="tandaiTeratasi(\'' + jsq(r.id) +
        '\')">✓ Sudah teratasi</button>' : '') +
    '</div></div>' +
    '<div class="nilai"><span class="lencana ' + warna + '">' + esc(r.tingkat) + '</span><br>' +
    '<small>' + angka(r.persenTerdampak) + '% area</small><br>' +
    '<small style="color:var(--redup)">Rp ' + rpSingkat(r.perkiraanRugiRp) + '</small></div></div>';
  return html;
}

function detailKerusakan(id) {
  var r = null;
  (S.data.kerusakan || []).forEach(function (x) { if (x.id === id) r = x; });
  if (!r) return;

  var html = '';
  if (r.fotoUrl) {
    html += '<img class="foto" src="' + esc(r.fotoUrl) + '" onclick="zoomFoto(this.src)" ' +
      'style="margin-bottom:10px">';
  }
  html += '<div class="kisi kisi2">' +
    barisInfo('Petak', namaPetak(r.petakId)) + barisInfo('Komoditas', r.komoditas) +
    barisInfo('Tanggal', tglIndo(r.tanggal, true)) + barisInfo('Tingkat', r.tingkat) +
    barisInfo('Area terdampak', angka(r.persenTerdampak) + '%') +
    barisInfo('Perkiraan kerugian', 'Rp ' + rp(r.perkiraanRugiRp)) +
    '</div><hr class="pisah"><p><b>Pengamatan:</b><br>' + esc(r.deskripsi) + '</p>';

  if (r.diagnosaAi && r.diagnosaAi.namaHamaPenyakit) {
    var d = r.diagnosaAi;
    html += '<hr class="pisah"><div class="kartu" style="background:var(--latar);margin:0">' +
      '<h4>🔬 Hasil diagnosis</h4>' +
      '<p><b>' + esc(d.namaHamaPenyakit) + '</b>' +
      (d.keyakinan ? ' <span class="lencana biru">keyakinan ' + d.keyakinan + '%</span>' : '') +
      '</p>' +
      (d.sumber === 'cadangan'
        ? '<div class="spanduk kuning"><span>ℹ️</span><span>Ini hasil dari basis pengetahuan ' +
          'bawaan aplikasi, bukan analisis AI atas foto Anda.</span></div>' : '') +
      '<p><b>Tindakan segera:</b><br>' + esc(d.tindakanSegera || '-') + '</p>' +
      '<p><b>Resep nabati:</b><br>' + esc(d.resepNabati || '-') + '</p>' +
      '<p><b>Pencegahan:</b><br>' + esc(d.pencegahan || '-') + '</p>' +
      (d.kapanKeAhli ? '<p><b>Kapan panggil penyuluh:</b><br>' + esc(d.kapanKeAhli) + '</p>' : '') +
      '</div>';
  }

  html += '<hr class="pisah"><div class="tumpuk">';
  if (bolehUbah()) {
    html += '<button class="tbl lebar" onclick="mintaDiagnosa(\'' + jsq(id) +
      '\')">🔬 Minta diagnosis</button>' +
      '<button class="tbl sekunder lebar" onclick="formKerusakan(\'' + jsq(id) +
      '\')">✏️ Ubah laporan</button>';
  }
  if (bolehKelola()) {
    html += '<button class="tbl bahaya lebar" onclick="hapusUmum(' +
      '\'kerusakan_hapus\',\'' + jsq(id) + '\',\'laporan kerusakan\')">🗑️ Hapus</button>';
  }
  html += '</div>';
  modalBuka(r.judulGejala, html);
}

function tandaiTeratasi(id) {
  var r = null;
  (S.data.kerusakan || []).forEach(function (x) { if (x.id === id) r = x; });
  if (!r) return;
  var salinan = JSON.parse(JSON.stringify(r));
  salinan.status = 'mitigated';
  ubah('kerusakan_simpan', { item: salinan }, { pesan: 'Ditandai sudah teratasi.' })
    .catch(function (e) { toast(e.message, 'galat'); });
}

function mintaDiagnosa(id) {
  var r = null;
  (S.data.kerusakan || []).forEach(function (x) { if (x.id === id) r = x; });
  if (!r) return;
  if (!S.daring) {
    toast('Diagnosis memerlukan sambungan internet.', 'galat');
    return;
  }
  var isi = $('modalIsi');
  if (isi) {
    isi.insertAdjacentHTML('afterbegin',
      '<div class="spanduk biru" id="statusDiagnosa"><span class="muat"></span>' +
      '<span>Menganalisis gejala…</span></div>');
  }
  panggil('ai_diagnosa', {
    komoditas: r.komoditas, judulGejala: r.judulGejala, deskripsi: r.deskripsi,
    fotoBase64: r.fotoUrl
  }).then(function (hasil) {
    var salinan = JSON.parse(JSON.stringify(r));
    salinan.diagnosaAi = hasil.diagnosa;
    // Sumber ikut disimpan supaya pembaca berikutnya tahu angka keyakinan itu
    // berasal dari analisis AI atau sekadar pencocokan kata kunci bawaan.
    salinan.diagnosaAi.sumber = hasil.sumber;
    return ubah('kerusakan_simpan', { item: salinan }, { diam: true }).then(function () {
      modalTutup();
      detailKerusakan(id);
      toast(hasil.sumber === 'gemini' ? 'Diagnosis AI selesai.'
                                      : 'Diagnosis dari basis pengetahuan bawaan.', 'sukses');
    });
  }).catch(function (e) {
    var st = $('statusDiagnosa');
    if (st) st.outerHTML = '<div class="spanduk merah"><span>⚠️</span><span>' +
      esc(e.message) + '</span></div>';
  });
}
