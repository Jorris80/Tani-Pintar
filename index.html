<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,

<style>
/* ============================================================
   TaniPintar — gaya antarmuka
   Tiga mode warna: terang, gelap, dan "silau" (kontras tinggi
   untuk dibaca di bawah matahari langsung saat di kebun).
   ============================================================ */
:root{
  --latar:#FDFBF7; --kartu:#FFFFFF; --garis:#E6E0D4; --tinta:#2C3327;
  --redup:#8B9382; --utama:#3A4D39; --utama2:#4F6F52; --aksen:#C7924A;
  --bahaya:#B4432E; --sukses:#3F7D46; --peringatan:#C08A2E; --info:#31607F;
  --bayang:0 1px 3px rgba(44,51,39,.08); --bulat:16px;
}
html[data-mode="gelap"]{
  --latar:#171A15; --kartu:#212519; --garis:#343A2C; --tinta:#EFEFE6;
  --redup:#9BA391; --utama:#6E9268; --utama2:#83A87B; --aksen:#D9A961;
  --bayang:0 1px 3px rgba(0,0,0,.4);
}
html[data-mode="silau"]{
  --latar:#FFFFFF; --kartu:#FFFFFF; --garis:#000000; --tinta:#000000;
  --redup:#333333; --utama:#000000; --utama2:#1A4D1A; --aksen:#8A5A00;
  --bayang:none; --bulat:8px;
}
html[data-mode="silau"] .kartu{border-width:2px}
html[data-mode="silau"] body{font-weight:600}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--latar); color:var(--tinta);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:700}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1rem} h4{font-size:.9rem}
p{margin:0 0 .7em}
a{color:var(--utama2)}
small{font-size:.78rem}

/* ---------- tata letak ---------- */
#aplikasi{display:flex;min-height:100vh;flex-direction:column}
#atas{
  position:sticky;top:0;z-index:900;background:var(--utama);color:#fff;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
#atas .logo{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;
  overflow:hidden;
}
#atas .logo img{width:100%;height:100%;object-fit:cover}
#atas .judul{flex:1;min-width:0}
#atas .judul b{display:block;font-size:1rem;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#atas .judul span{display:block;font-size:.7rem;opacity:.82;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#atas .aksi{display:flex;gap:6px;align-items:center;flex:0 0 auto}
#atas button{
  background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;
  padding:7px 10px;font-size:.78rem;cursor:pointer;font-family:inherit;font-weight:600;
}
#atas button:active{background:rgba(255,255,255,.3)}

#isi{flex:1;padding:14px;max-width:1200px;width:100%;margin:0 auto}
@media(min-width:900px){
  #isi{padding:20px 24px 40px}
}

/* ---------- navigasi ---------- */
#nav{
  position:sticky;bottom:0;z-index:880;background:var(--kartu);
  border-top:1px solid var(--garis);display:flex;overflow-x:auto;
  padding-bottom:env(safe-area-inset-bottom);scrollbar-width:none;
}
#nav::-webkit-scrollbar{display:none}
#nav button{
  flex:0 0 auto;min-width:72px;background:none;border:0;padding:8px 10px 9px;
  color:var(--redup);font-size:.66rem;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;
  border-top:3px solid transparent;
}
#nav button .ik{font-size:1.15rem;line-height:1}
#nav button.aktif{color:var(--utama2);border-top-color:var(--utama2)}
@media(min-width:900px){
  #nav{position:sticky;top:0;flex-wrap:wrap;justify-content:center;
    border-top:0;border-bottom:1px solid var(--garis);order:-1}
  #nav button{min-width:88px}
}

/* ---------- kartu & komponen ---------- */
.kartu{
  background:var(--kartu);border:1px solid var(--garis);border-radius:var(--bulat);
  padding:14px;margin-bottom:12px;box-shadow:var(--bayang);
}
.kartu.rapat{padding:10px}
.kartu h3{display:flex;align-items:center;gap:7px}
.kisi{display:grid;gap:12px}
.kisi2{grid-template-columns:repeat(2,1fr)}
.kisi3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kisi4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
@media(min-width:900px){
  .kisi2{grid-template-columns:repeat(2,1fr)}
  .lebar2{grid-column:span 2}
}
.baris{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.baris.rapi{flex-wrap:nowrap}
.tumpuk{display:flex;flex-direction:column;gap:8px}
.kanan{margin-left:auto}
.pisah{height:1px;background:var(--garis);margin:10px 0;border:0}

.statistik{text-align:left}
.statistik .angka{font-size:1.5rem;font-weight:800;line-height:1.1;
  font-variant-numeric:tabular-nums}
.statistik .label{font-size:.72rem;color:var(--redup);font-weight:600}
.statistik .ket{font-size:.68rem;color:var(--redup);margin-top:2px}

.lencana{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:.68rem;font-weight:700;background:var(--garis);color:var(--tinta);
  white-space:nowrap;
}
.lencana.hijau{background:#E4F0E2;color:#2C5730}
.lencana.merah{background:#FBE5E0;color:#8E2F1C}
.lencana.kuning{background:#FBF0DA;color:#7A5410}
.lencana.biru{background:#DFEDF6;color:#1E4A63}
.lencana.abu{background:var(--garis);color:var(--redup)}
html[data-mode="gelap"] .lencana.hijau{background:#2A3E28;color:#A9D5A2}
html[data-mode="gelap"] .lencana.merah{background:#43241C;color:#F0A594}
html[data-mode="gelap"] .lencana.kuning{background:#40351B;color:#E6C583}
html[data-mode="gelap"] .lencana.biru{background:#1E3341;color:#96C5E0}

button.tbl,.tbl{
  background:var(--utama);color:#fff;border:0;border-radius:11px;padding:9px 14px;
  font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
}
button.tbl:active{opacity:.85}
button.tbl[disabled]{opacity:.45;cursor:not-allowed}
button.tbl.sekunder{background:var(--kartu);color:var(--tinta);border:1px solid var(--garis)}
button.tbl.bahaya{background:var(--bahaya)}
button.tbl.hijau{background:var(--sukses)}
button.tbl.kecil{padding:6px 10px;font-size:.74rem;border-radius:9px}
button.tbl.lebar{width:100%;justify-content:center}

input,select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--garis);border-radius:11px;
  background:var(--latar);color:var(--tinta);font-family:inherit;font-size:.9rem;
}
html[data-mode="silau"] input,html[data-mode="silau"] select,html[data-mode="silau"] textarea{
  border-width:2px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--utama2);outline-offset:1px}
textarea{min-height:78px;resize:vertical}
label.ruas{display:block;margin-bottom:11px}
label.ruas>span.nama{display:block;font-size:.76rem;font-weight:700;margin-bottom:4px}
label.ruas>span.bantu{display:block;font-size:.7rem;color:var(--redup);margin-top:4px}

/* Tombol kosongkan (x) di dalam kotak isian. Ukuran 30px dipilih agar
   tetap mudah ditekan dengan ibu jari tanpa menutupi teks yang diketik. */
span.kotakIsian{position:relative;display:block}
span.kotakIsian>input{padding-right:38px}
span.kotakIsian>button.kosongkan{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;padding:0;border:0;border-radius:50%;
  background:var(--garis);color:var(--redup);font-size:1.05rem;line-height:1;
  cursor:pointer;display:none;align-items:center;justify-content:center;
}
span.kotakIsian>button.kosongkan:hover{background:var(--bahaya);color:#fff}
span.kotakIsian.terisi>button.kosongkan{display:flex}

/* Pratinjau unggahan beberapa foto. Ukuran petak dibuat cukup besar
   untuk dikenali isinya, tetapi tetap muat tiga kolom di layar ponsel
   tersempit. */
/* Panel pengukuran GPS. Angkanya sengaja besar: dibaca sambil berjalan
   di kebun, sering di bawah matahari langsung. */
.panelUkur{border:2px solid var(--utama2)}
.ukurAngka{gap:8px}
.kotakUkur{text-align:center;background:var(--latar);border-radius:11px;padding:9px 4px}
.kotakUkur .nilai{font-size:1.35rem;font-weight:800;line-height:1.15;color:var(--utama)}
.kotakUkur .label{font-size:.7rem;font-weight:700;color:var(--tinta);margin-top:1px}
.kotakUkur .ket{font-size:.62rem;color:var(--redup);margin-top:1px}
html[data-mode="silau"] .kotakUkur .nilai{font-size:1.5rem}
@media(min-width:640px){.kotakUkur .nilai{font-size:1.6rem}}

.petakFoto{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
@media(min-width:640px){.petakFoto{grid-template-columns:repeat(5,1fr)}}
@media(min-width:900px){.petakFoto{grid-template-columns:repeat(6,1fr)}}
.petakFotoItem{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;
  border:1px solid var(--garis);background:var(--latar)}
.petakFotoItem>img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.petakFotoItem>button.hapusFoto{position:absolute;top:3px;right:3px;width:24px;height:24px;
  padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
  font-size:.95rem;line-height:1;cursor:pointer;display:flex;
  align-items:center;justify-content:center}
.petakFotoItem>button.hapusFoto:hover{background:var(--bahaya)}
@media(pointer:coarse){
  /* Sasaran sentuh diperbesar di perangkat sentuh — 24px terlalu kecil
     untuk ibu jari, dan salah tekan di sini berarti foto terbuang. */
  .petakFotoItem>button.hapusFoto{width:30px;height:30px;font-size:1.1rem}
}
/* Panah pengatur angka bawaan peramban disembunyikan: ia berhimpitan
   dengan tombol silang, dan di ponsel terlalu kecil untuk ditekan
   dengan tepat. Angka tetap bisa diketik seperti biasa. */
span.kotakIsian>input[type=number]{-moz-appearance:textfield;appearance:textfield}
span.kotakIsian>input[type=number]::-webkit-outer-spin-button,
span.kotakIsian>input[type=number]::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
html[data-mode="silau"] span.kotakIsian>button.kosongkan{
  background:var(--tinta);color:var(--latar)}

table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--garis);
  vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;color:var(--redup);
  font-weight:800}
td.angka,th.angka{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.gulir{overflow-x:auto;-webkit-overflow-scrolling:touch}

.kosong{text-align:center;padding:26px 12px;color:var(--redup);font-size:.85rem}
.kosong .ik{font-size:2rem;display:block;margin-bottom:6px;opacity:.5}

/* ---------- batang & grafik CSS ---------- */
.batang{height:9px;background:var(--garis);border-radius:99px;overflow:hidden}
.batang>i{display:block;height:100%;background:var(--utama2);border-radius:99px}
.grafik{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.grafik .kol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:3px;min-width:0}
.grafik .kol i{display:block;width:100%;background:var(--utama2);border-radius:4px 4px 0 0;
  min-height:2px}
.grafik .kol i.b2{background:var(--aksen)}
.grafik .kol i.merah{background:var(--bahaya)}
.grafik .kol small{font-size:.6rem;color:var(--redup);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- peta ---------- */
#peta,.peta{height:340px;border-radius:var(--bulat);overflow:hidden;
  border:1px solid var(--garis);background:var(--garis)}
@media(min-width:900px){#peta,.peta{height:460px}}
.leaflet-container{font-family:inherit;background:#DCE5D8}
.leaflet-popup-content{margin:10px 12px;font-size:.78rem;line-height:1.5}
.leaflet-popup-content-wrapper{border-radius:12px}
@media(pointer:coarse){
  /* Tombol tutup popup bawaan Leaflet terlalu kecil untuk ibu jari. */
  .leaflet-popup-close-button{width:32px;height:32px;font-size:20px;
    display:flex;align-items:center;justify-content:center}
  .leaflet-control-zoom a{width:38px;height:38px;line-height:38px;font-size:1.2rem}
}
html[data-mode="gelap"] .leaflet-container{background:#1E2419}
.petaLabel{
  background:rgba(255,255,255,.9);border:1px solid var(--utama2);border-radius:6px;
  padding:1px 5px;font-size:.66rem;font-weight:800;color:#2C3327;white-space:nowrap;
}
.kisiPeta{background:repeating-linear-gradient(0deg,#CFDCC9 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,#CFDCC9 0 1px,transparent 1px 40px),#E3EBDE}
.chipPeta{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--garis);background:var(--kartu);font-size:.72rem;font-weight:700;
  cursor:pointer;color:var(--tinta);
}
.chipPeta.on{border-color:var(--utama2);color:var(--utama2);background:#EDF3EB}
html[data-mode="gelap"] .chipPeta.on{background:#26301F}

/* ---------- modal ---------- */
.tirai{
  position:fixed;inset:0;background:rgba(20,24,18,.55);z-index:4000;
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  backdrop-filter:blur(2px);
}
@media(min-width:700px){.tirai{align-items:center;padding:20px}}
.modal{
  background:var(--kartu);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
@media(min-width:700px){.modal{border-radius:18px;max-height:86vh}}
.modal .kepala{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.modal .kepala h3{flex:1;margin:0}
.modal .kepala button{background:none;border:0;font-size:1.3rem;color:var(--redup);
  cursor:pointer;padding:0 4px;line-height:1}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:5000;
  background:var(--tinta);color:var(--latar);padding:10px 16px;border-radius:12px;
  font-size:.84rem;font-weight:600;max-width:90vw;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;
}
#toast.tampil{display:block}
#toast.galat{background:var(--bahaya);color:#fff}
#toast.sukses{background:var(--sukses);color:#fff}

/* ---------- penampil foto (galeri) ----------
   Dibuat penuh layar dan gelap: foto tanaman sering diperiksa di bawah
   matahari, dan latar terang membuat rincian daun tidak terlihat. */
#zoomFoto{
  /* Latar dibuat pekat penuh, bukan 94%. Sisa enam persen membuat isi
     modal di belakangnya masih terbaca samar — terlihat seperti cacat
     penggambaran, dan rincian daun jadi sulit dinilai. */
  position:fixed;inset:0;background:#0B0F0A;z-index:6000;display:none;
  flex-direction:column;touch-action:none;user-select:none;
}
#zoomFoto.tampil{display:flex}
#zoomFoto .kepalaFoto{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));color:#fff;flex:0 0 auto;
}
#zoomFoto .kepalaFoto .hitung{font-size:.82rem;font-weight:700;opacity:.85}
#zoomFoto .kepalaFoto button{
  background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;
  border-radius:50%;font-size:1.1rem;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
#zoomFoto .kepalaFoto button:active{background:rgba(255,255,255,.3)}
#zoomFoto .panggung{
  flex:1;position:relative;overflow:hidden;display:flex;
  align-items:center;justify-content:center;
}
#zoomFoto .panggung img{
  max-width:100%;max-height:100%;object-fit:contain;
  transform-origin:center center;transition:transform .12s ease-out;
  -webkit-user-drag:none;
}
#zoomFoto .panggung img.geser{transition:none}
#zoomFoto .navFoto{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.18);color:#fff;font-size:1.3rem;line-height:1;
  display:flex;align-items:center;justify-content:center;
  /* z-index WAJIB ada di sini. Foto diberi transform untuk perbesaran,
     dan transform membuatnya membentuk konteks penumpukan sendiri.
     Akibatnya foto menimpa tombol yang berada SEBELUMNYA di dalam DOM —
     tombol "sebelumnya" jadi tidak bisa ditekan sama sekali, sementara
     tombol "berikutnya" tetap bekerja karena letaknya sesudah foto. */
  z-index:3;
}
#zoomFoto .navFoto:active{background:rgba(255,255,255,.34)}
#zoomFoto .navFoto.kiri{left:10px}
#zoomFoto .navFoto.kanan{right:10px}
#zoomFoto .kakiFoto{
  flex:0 0 auto;color:#fff;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  /* Tinggi dikunci supaya panggung foto TIDAK berubah tinggi saat
     keterangan foto berikutnya lebih panjang atau lebih pendek.
     Tanpa ini, tombol geser melompat di bawah jempol pengguna: tekan
     "berikutnya" dua kali, tekanan kedua mendarat di tempat lain. */
  min-height:66px;box-sizing:border-box;
}
#zoomFoto .kakiFoto .judulFoto{font-size:.92rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zoomFoto .kakiFoto .ketFoto{font-size:.78rem;opacity:.78;margin-top:2px;
  height:2.6em;overflow:auto}
#zoomFoto .jempolFoto{
  display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none;
  /* Tinggi tetap karena alasan yang sama. */
  height:68px;box-sizing:content-box;flex:0 0 auto;
}
#zoomFoto .jempolFoto::-webkit-scrollbar{display:none}
#zoomFoto .jempolFoto img{
  width:52px;height:52px;object-fit:cover;border-radius:7px;flex:0 0 auto;
  opacity:.5;border:2px solid transparent;cursor:pointer;
}
#zoomFoto .jempolFoto img.aktif{opacity:1;border-color:#fff}
#zoomFoto .petunjuk{
  text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);padding-bottom:4px;
}

/* ---------- galeri di dalam halaman ---------- */
.galeri{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.galeri::-webkit-scrollbar{display:none}
.galeri .bingkai{position:relative;flex:0 0 auto;width:104px}
.galeri .bingkai img{
  width:104px;height:104px;object-fit:cover;border-radius:10px;
  border:1px solid var(--garis);cursor:pointer;display:block;
}
.galeri .bingkai small{
  display:block;font-size:.64rem;color:var(--redup);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@media(min-width:700px){
  .galeri .bingkai,.galeri .bingkai img{width:124px}
  .galeri .bingkai img{height:124px}
}

/* ============================================================
   TABLET & SASARAN SENTUH
   ============================================================
   Aplikasi ini dipakai dengan satu tangan, sering sambil berdiri di
   kebun. Tombol yang terlalu kecil bukan sekadar kurang nyaman —
   salah tekan berarti data yang salah tercatat.
   ============================================================ */

/* Sasaran sentuh minimal 44px hanya diberlakukan pada perangkat
   sentuh. Pada tetikus, tombol sebesar itu justru terasa kikuk. */
@media(pointer:coarse){
  .tbl{min-height:44px}
  .tbl.kecil{min-height:38px;padding:9px 12px}
  #nav button{min-height:52px}
  input,select,textarea{min-height:44px;font-size:16px}
  /* 16px mencegah iOS memperbesar halaman sendiri saat kotak isian
     disentuh — pembesaran itu menggeser tata letak dan membingungkan. */
  .modal .kepala button{width:40px;height:40px}
  table td,table th{padding:11px 8px}
  .item{padding:12px 4px}
}

/* Tablet: ruang layar dipakai untuk menampilkan lebih banyak sekaligus,
   bukan sekadar meregangkan tata letak ponsel. */
@media(min-width:640px) and (max-width:899px){
  #isi{padding:18px}
  .kisi3{grid-template-columns:repeat(3,1fr)}
  .kisi4{grid-template-columns:repeat(4,1fr)}
  #peta,.peta{height:420px}
  #nav button{min-width:84px;font-size:.7rem}
  .modal{max-width:640px}
}

/* Tablet mendatar dan layar lebar */
@media(min-width:900px){
  .kartu{padding:16px}
  .modal{max-width:720px}
}

/* Tablet besar: dasbor dan laporan muat dua kolom berdampingan */
@media(min-width:1100px){
  .duaKolom{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .duaKolom>.kartu{margin-bottom:0}
}

/* Layar sangat sempit — ponsel lama masih banyak dipakai di desa */
@media(max-width:360px){
  #isi{padding:10px}
  .kartu{padding:11px}
  .kisi{gap:8px}
  .kisi4{grid-template-columns:repeat(2,1fr)}
  .statistik .angka{font-size:1.25rem}
  #nav button{min-width:64px;font-size:.62rem}
}

/* Layar mendatar dan pendek: bilah navigasi memakan terlalu banyak
   tinggi bila ikonnya tetap bertumpuk di atas tulisan. */
@media(max-height:460px) and (orientation:landscape){
  #nav button{flex-direction:row;gap:6px;min-height:40px;padding:6px 10px}
  #nav button .ik{font-size:1rem}
  #peta,.peta{height:240px}
  .modal{max-height:96vh}
}

/* ---------- galeri di dalam popup peta ---------- */
.popFoto{margin-top:7px}
.popFoto .bingkaiPop{
  position:relative;width:100%;height:118px;border-radius:8px;overflow:hidden;
  background:#DCE5D8;
}
.popFoto .bingkaiPop img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.popFoto .navPop{
  position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;
  border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;
  font-size:.9rem;line-height:1;cursor:pointer;display:flex;
  align-items:center;justify-content:center;padding:0;
}
.popFoto .navPop.kiri{left:5px}
.popFoto .navPop.kanan{right:5px}
.popFoto .hitungPop{
  position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;
  border-radius:999px;padding:1px 8px;font-size:.66rem;font-weight:700;
}

/* ---------- spanduk status ---------- */
.spanduk{
  border-radius:12px;padding:10px 12px;font-size:.8rem;margin-bottom:12px;
  border:1px solid;display:flex;gap:8px;align-items:flex-start;
}
.spanduk.kuning{background:#FBF3E2;border-color:#E4CE9C;color:#6B4F13}
.spanduk.merah{background:#FBE9E4;border-color:#E8BCB0;color:#7A2B18}
.spanduk.biru{background:#E4EFF6;border-color:#B4D2E4;color:#1B455C}
.spanduk.hijau{background:#E7F2E5;border-color:#B8D7B3,;color:#27512B}
html[data-mode="gelap"] .spanduk.kuning{background:#3A3014;border-color:#6B5A26;color:#EBCF8E}
html[data-mode="gelap"] .spanduk.merah{background:#3D211A;border-color:#70392C;color:#F0AC98}
html[data-mode="gelap"] .spanduk.biru{background:#1B2E3A;border-color:#31566B;color:#A7CDE3}
html[data-mode="gelap"] .spanduk.hijau{background:#22301F;border-color:#3E5B3A;color:#A9D3A3}
.spanduk b{display:block}

.pil{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pil::-webkit-scrollbar{display:none}
.pil button{
  flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--garis);
  background:var(--kartu);font-size:.76rem;font-weight:700;cursor:pointer;
  font-family:inherit;color:var(--tinta);
}
.pil button.aktif{background:var(--utama);color:#fff;border-color:var(--utama)}

.item{
  display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--garis);
  align-items:flex-start;
}
.item:last-child{border-bottom:0}
.item .ikon{
  width:36px;height:36px;border-radius:11px;background:var(--garis);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;
}
.item .isi{flex:1;min-width:0}
.item .isi b{display:block;font-size:.87rem}
.item .isi small{color:var(--redup);display:block;line-height:1.4}
.item .nilai{text-align:right;font-weight:800;font-size:.85rem;white-space:nowrap;
  font-variant-numeric:tabular-nums}

.pesan{max-width:86%;padding:9px 12px;border-radius:14px;font-size:.85rem;
  margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.pesan.saya{background:var(--utama);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.pesan.bot{background:var(--garis);color:var(--tinta);border-bottom-left-radius:4px}
.pesan img{max-width:100%;border-radius:9px;margin-bottom:6px;display:block}

.foto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px;
  border:1px solid var(--garis);cursor:zoom-in;background:var(--garis)}

.muat{
  display:inline-block;width:15px;height:15px;border:2px solid var(--garis);
  border-top-color:var(--utama2);border-radius:50%;animation:putar .7s linear infinite;
  vertical-align:-2px;
}
@keyframes putar{to{transform:rotate(360deg)}}

@media print{
  #atas,#nav,#toast,.tirai,.takCetak{display:none !important}
  body{background:#fff;color:#000;font-size:11pt}
  .kartu{border:1px solid #999;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  #isi{padding:0;max-width:none}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div id="aplikasi">
  <header id="atas">
    <div class="logo" id="logoAtas">🌱</div>
    <div class="judul">
      <b id="judulAtas">TaniPintar</b>
      <span id="subJudulAtas">WebGIS &amp; Manajemen Kebun Petani</span>
    </div>
    <div class="aksi">
      <button id="tblMode" title="Ganti mode tampilan">☀️</button>
      <button id="tblProfil">Masuk</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="isi">
    <div class="kosong"><span class="ik">🌾</span>Memuat aplikasi…</div>
  </main>
</div>
<div id="toast"></div>
<div id="zoomFoto">
  <div class="kepalaFoto">
    <button type="button" onclick="tutupGaleri()" aria-label="Tutup">&times;</button>
    <span class="hitung" id="galeriHitung"></span>
    <button type="button" class="kanan" onclick="zoomGaleri(-0.4)" aria-label="Perkecil">&minus;</button>
    <button type="button" onclick="zoomGaleri(0.4)" aria-label="Perbesar">+</button>
  </div>
  <div class="panggung" id="galeriPanggung">
    <button type="button" class="navFoto kiri" id="galeriKiri"
            onclick="geserGaleri(-1)" aria-label="Foto sebelumnya">&#8249;</button>
    <img id="zoomFotoImg" alt="">
    <button type="button" class="navFoto kanan" id="galeriKanan"
            onclick="geserGaleri(1)" aria-label="Foto berikutnya">&#8250;</button>
  </div>
  <div class="jempolFoto" id="galeriJempol"></div>
  <div class="kakiFoto">
    <div class="judulFoto" id="galeriJudul"></div>
    <div class="ketFoto" id="galeriKet"></div>
    <div class="petunjuk">Geser untuk berpindah foto · cubit atau ketuk dua kali untuk memperbesar</div>
  </div>
</div>

   hanya kemampuan membuka tanpa sinyal yang hilang. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Service worker gagal didaftarkan:', e);
    });

<script>

/* Versi antarmuka. HARUS naik bersama APP_VERSI di Code.gs. */
var VERSI_KLIEN = '1.8.0';
var TANGGAL_RILIS_KLIEN = '2026-09-06';

/* ============================================================
   TaniPintar — inti aplikasi
   Satu berkas ini dipakai untuk DUA mode:
   1. Di dalam Google Apps Script  → memakai google.script.run
   2. Sebagai PWA di GitHub Pages  → memakai fetch ke URL Web App
   Modenya dideteksi otomatis, tidak perlu dua versi kode.
   ============================================================ */

var S = {
  siap: false,
  daring: navigator.onLine,
  token: '',
  pengguna: null,
  tab: 'dasbor',
  subtab: {},
  data: {},
  pengaturan: {},
  lisensi: null,
  antrean: [],
  mode: 'terang',
  sibuk: false,
  petaAktif: null,
  chat: [],
  filter: {}
};

var LS = {
  token: 'tanipintar_token',
  pengguna: 'tanipintar_pengguna',
  data: 'tanipintar_data',
  antrean: 'tanipintar_antrean',
  mode: 'tanipintar_mode',
  chat: 'tanipintar_chat'
};

/* ---------- pembantu DOM ---------- */
function $(id) { return document.getElementById(id); }

function esc(t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** Escaping untuk string yang ditaruh di dalam atribut onclick="fn('...')". */
function jsq(t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;')
    .replace(/\r?\n/g, '\\n').replace(/</g, '\\u003c');
}

function angka(v, bawaan) {
  var n = Number(v);
  return (isNaN(n) || v === '' || v === null || v === undefined)
    ? (bawaan === undefined ? 0 : bawaan) : n;
}

function rp(n) {
  var s = String(Math.round(angka(n)));
  var minus = s.charAt(0) === '-';
  if (minus) s = s.substring(1);
  var keluar = '', hitung = 0;
  for (var i = s.length - 1; i >= 0; i--) {
    keluar = s.charAt(i) + keluar;
    hitung++;
    if (hitung % 3 === 0 && i > 0) keluar = '.' + keluar;
  }
  return (minus ? '-' : '') + keluar;
}

function rpSingkat(n) {
  var v = angka(n);
  var tanda = v < 0 ? '-' : '';
  v = Math.abs(v);
  if (v >= 1000000000) return tanda + (v / 1000000000).toFixed(1).replace('.', ',') + ' M';
  if (v >= 1000000) return tanda + (v / 1000000).toFixed(1).replace('.', ',') + ' Jt';
  if (v >= 1000) return tanda + Math.round(v / 1000) + ' Rb';
  return tanda + rp(v);
}

var NAMA_BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt',
                  'Nov', 'Des'];

function tglIndo(t, panjang) {
  var s = String(t || '');
  if (s.length < 10) return s || '-';
  var b = Number(s.substring(5, 7)) - 1;
  if (b < 0 || b > 11) return s;
  return Number(s.substring(8, 10)) + ' ' + NAMA_BULAN[b] +
         (panjang ? ' ' + s.substring(0, 4) : ' ' + s.substring(2, 4));
}

function hariIni() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function tambahHari(tanggal, hari) {
  var d = new Date(String(tanggal) + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + Number(hari));
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function selisihHari(dari, sampai) {
  var a = new Date(String(dari) + 'T00:00:00');
  var b = new Date(String(sampai) + 'T00:00:00');
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function idLokal(awalan) {
  return awalan + '-L' + Date.now().toString(36).toUpperCase() +
         Math.floor(Math.random() * 900 + 100);
}

function nomorWa(noHp) {
  var n = String(noHp || '').replace(/[^0-9]/g, '');
  if (!n) return '';
  if (n.indexOf('62') === 0) return n;
  if (n.charAt(0) === '0') return '62' + n.substring(1);
  if (n.charAt(0) === '8') return '62' + n;
  return n;
}

/**
 * Membuka tautan luar (WhatsApp, peta) dengan penanganan penghalang popup.
 * Catatan: window.open(url,'_blank','noopener') SELALU mengembalikan null,
 * sehingga tidak bisa dipakai untuk mendeteksi kegagalan. Karena itu di sini
 * dibuka tanpa 'noopener' lalu opener-nya dinolkan sendiri.
 */
function bukaTautan(url) {
  var w = window.open(url, '_blank');
  if (w) { try { w.opener = null; } catch (e) {} return true; }
  modalBuka('Tautan tidak bisa dibuka otomatis',
    '<p>Peramban memblokir jendela baru. Salin tautan berikut lalu buka manual:</p>' +
    '<textarea readonly rows="3" onclick="this.select()">' + esc(url) + '</textarea>');
  return false;
}

/* ---------- pesan singkat ---------- */
var _toastWaktu = null;
function toast(pesan, jenis) {
  var el = $('toast');
  el.textContent = pesan;
  el.className = 'tampil' + (jenis ? ' ' + jenis : '');
  if (_toastWaktu) clearTimeout(_toastWaktu);
  _toastWaktu = setTimeout(function () { el.className = ''; },
                           jenis === 'galat' ? 6000 : 3200);
}

/* zoomFoto() kini disediakan oleh parts/15-galeri.js sebagai pembungkus
   penampil galeri, supaya seluruh pemanggilan lama tetap berfungsi. */

/* ============================================================
   TRANSPOR — dua mode
   ============================================================ */

function modeGas() {
  return typeof google !== 'undefined' && google.script && google.script.run;
}

function urlGas() {
  return (window.TANIPINTAR_CONFIG && window.TANIPINTAR_CONFIG.gasUrl) || '';
}

/**
 * Memanggil peladen. Selalu mengembalikan Promise.
 * Di mode PWA memakai Content-Type text/plain supaya peramban TIDAK
 * melakukan permintaan preflight CORS — Apps Script tidak menjawab OPTIONS.

  // peramban. Tidak ada satu pun panggilan jaringan.
  if (typeof DEMO_AKTIF !== 'undefined' && DEMO_AKTIF) {
    return demoPanggil(aksi, data);
  }
  return new Promise(function (selesai, gagal) {
    if (modeGas()) {
      google.script.run
        .withSuccessHandler(function (r) { tanganiBalasan(r, selesai, gagal); })
        .withFailureHandler(function (e) { gagal(new Error(e && e.message ? e.message : String(e))); })
        .apiHandler(aksi, data, S.token);
      return;
    }
    var url = urlGas();
    if (!url) {
      gagal(new Error('Alamat Web App belum diatur. Isi berkas config.js dengan URL ' +
                      'penerapan Apps Script Anda.'));
      return;
    }
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ aksi: aksi, data: data, token: S.token })
    })
      .then(function (r) {
        if (!r.ok) throw new Error('Peladen menjawab kode ' + r.status);
        return r.text();
      })
      .then(function (t) {
        var j;
        try { j = JSON.parse(t); }
        catch (e) {
          throw new Error('Jawaban peladen tidak dapat dibaca. Biasanya karena Web App ' +
            'belum diterapkan dengan akses "Siapa saja" (Anyone).');
        }
        tanganiBalasan(j, selesai, gagal);
      })
      .catch(function (e) { gagal(e); });
  });
}

function tanganiBalasan(r, selesai, gagal) {
  if (!r) { gagal(new Error('Peladen tidak menjawab.')); return; }
  if (r.ok) { selesai(r.data); return; }
  if (r.sesiHabis) {
    S.token = '';
    S.pengguna = null;
    simpanLokal(LS.token, '');
    simpanLokal(LS.pengguna, null);
  }
  var e = new Error(r.pesan || 'Terjadi kesalahan.');
  e.lisensiMati = r.lisensiMati;
  e.lisensi = r.lisensi;
  e.sesiHabis = r.sesiHabis;
  gagal(e);
}

/* ---------- penyimpanan lokal ---------- */
function simpanLokal(kunci, nilai) {
  try {
    if (nilai === null || nilai === undefined || nilai === '') localStorage.removeItem(kunci);
    else localStorage.setItem(kunci, typeof nilai === 'string' ? nilai : JSON.stringify(nilai));
    return true;
  } catch (e) {
    // Kuota localStorage bisa penuh kalau banyak foto tersimpan.
    // Ini dilaporkan, bukan didiamkan, supaya pengguna tahu datanya
    // tidak tersimpan untuk dipakai luring.
    if (kunci === LS.data) {
      toast('Penyimpanan perangkat penuh — data luring tidak tersimpan lengkap.', 'galat');
    }
    return false;
  }
}

function bacaLokal(kunci, bawaan) {
  try {
    var v = localStorage.getItem(kunci);
    if (v === null) return bawaan;
    if (v.charAt(0) === '{' || v.charAt(0) === '[') return JSON.parse(v);
    return v;
  } catch (e) { return bawaan; }
}

/* ============================================================
   ANTREAN LURING (OUTBOX)
   ============================================================
   Saat perangkat luring, setiap perubahan disimpan ke antrean DAN
   diterapkan langsung ke salinan data lokal, supaya layar tetap
   menampilkan hasil pekerjaan petani. Saat kembali daring, antrean
   dikirim satu paket.
*/

var PETA_LEMBAR = {
  petak_simpan: 'petak', biaya_simpan: 'biaya', panen_simpan: 'panen',
  pembeli_simpan: 'pembeli', jadwal_simpan: 'jadwal', kerusakan_simpan: 'kerusakan',
  aktivitas_simpan: 'aktivitas', foto_simpan: 'fotoTumbuh', sensor_simpan: 'sensor',
  item_simpan: 'inventaris', edukasi_simpan: 'edukasi', harga_simpan: 'harga',
  cuaca_simpan: 'cuaca', komoditas_simpan: 'komoditas', pengguna_simpan: 'pengguna'
};
var PETA_HAPUS = {
  petak_hapus: 'petak', biaya_hapus: 'biaya', panen_hapus: 'panen',
  pembeli_hapus: 'pembeli', jadwal_hapus: 'jadwal', kerusakan_hapus: 'kerusakan',
  aktivitas_hapus: 'aktivitas', foto_hapus: 'fotoTumbuh', sensor_hapus: 'sensor',
  item_hapus: 'inventaris', edukasi_hapus: 'edukasi', harga_hapus: 'harga',
  komoditas_hapus: 'komoditas', pengguna_hapus: 'pengguna'
};
var AWALAN = {
  petak_simpan: 'PTK', biaya_simpan: 'BIA', panen_simpan: 'PNN', pembeli_simpan: 'PBL',
  jadwal_simpan: 'JDW', kerusakan_simpan: 'KRS', aktivitas_simpan: 'AKT',
  foto_simpan: 'FTO', sensor_simpan: 'SNS', item_simpan: 'INV', edukasi_simpan: 'EDU',
  harga_simpan: 'HRG', cuaca_simpan: 'CUA', komoditas_simpan: 'KOM', pengguna_simpan: 'USR'
};

/**
 * Titik masuk tunggal untuk semua perubahan data.
 * Daring  → kirim ke peladen, lalu segarkan salinan lokal.
 * Luring  → masuk antrean, terapkan lokal, tampilkan penanda.
 */
function ubah(aksi, data, opsi) {
  opsi = opsi || {};
  if (!S.daring) {
    var lokal = terapkanLokal(aksi, data);
    S.antrean.push({ kunciLokal: idLokal('Q'), aksi: aksi, data: data,
                     waktu: new Date().toISOString() });
    simpanLokal(LS.antrean, S.antrean);
    simpanLokal(LS.data, S.data);
    if (!opsi.diam) toast('Tersimpan di perangkat. Akan dikirim saat ada sinyal.', 'sukses');
    render();
    return Promise.resolve(lokal);
  }
  return panggil(aksi, data).then(function (hasil) {
    terapkanHasil(aksi, data, hasil);
    simpanLokal(LS.data, S.data);
    if (!opsi.diam) toast(opsi.pesan || 'Tersimpan.', 'sukses');
    render();
    return hasil;
  });
}

function terapkanLokal(aksi, data) {
  var lembar = PETA_LEMBAR[aksi];
  if (lembar) {
    var obj = JSON.parse(JSON.stringify(data.item || data));
    if (!obj.id) obj.id = idLokal(AWALAN[aksi] || 'TMP');
    obj._menunggu = true;
    var daftar = S.data[lembar] || (S.data[lembar] = []);
    var ketemu = -1;
    for (var i = 0; i < daftar.length; i++) if (daftar[i].id === obj.id) ketemu = i;
    if (ketemu >= 0) {
      for (var k in obj) daftar[ketemu][k] = obj[k];
      return daftar[ketemu];
    }
    daftar.push(obj);
    return obj;
  }
  var lembarHapus = PETA_HAPUS[aksi];
  if (lembarHapus) {
    var d2 = S.data[lembarHapus] || [];
    for (var j = d2.length - 1; j >= 0; j--) if (d2[j].id === data.id) d2.splice(j, 1);
    return { id: data.id };
  }
  if (aksi === 'jadwal_status') {
    var jd = S.data.jadwal || [];
    for (var q = 0; q < jd.length; q++) {
      if (jd[q].id === data.id) { jd[q].status = data.status; jd[q]._menunggu = true; return jd[q]; }
    }
  }
  if (aksi === 'panen_bayar') {
    var pn = S.data.panen || [];
    for (var w = 0; w < pn.length; w++) {
      if (pn[w].id === data.id) {
        pn[w].sudahDibayar = angka(pn[w].sudahDibayar) + angka(data.nominal);
        pn[w].statusBayar = pn[w].sudahDibayar >= angka(pn[w].totalPendapatan)
          ? 'Lunas' : 'Sebagian';
        pn[w]._menunggu = true;
        return pn[w];
      }
    }
  }
  return { _menunggu: true };
}

function terapkanHasil(aksi, data, hasil) {
  var lembar = PETA_LEMBAR[aksi];
  if (lembar && hasil && hasil.id) {
    var daftar = S.data[lembar] || (S.data[lembar] = []);
    var idLama = (data.item && data.item.id) || data.id || hasil.id;
    var ketemu = -1;
    for (var i = 0; i < daftar.length; i++) {
      if (daftar[i].id === hasil.id || daftar[i].id === idLama) ketemu = i;
    }
    if (ketemu >= 0) daftar[ketemu] = hasil; else daftar.push(hasil);
    return;
  }
  var lembarHapus = PETA_HAPUS[aksi];
  if (lembarHapus) {
    var d2 = S.data[lembarHapus] || [];
    for (var j = d2.length - 1; j >= 0; j--) if (d2[j].id === data.id) d2.splice(j, 1);
    // Penghapusan petak secara paksa juga membuang catatan turunannya.
    if (aksi === 'petak_hapus' && data.paksa) {
      ['biaya', 'panen', 'jadwal', 'kerusakan', 'aktivitas', 'fotoTumbuh'].forEach(function (n) {
        var arr = S.data[n] || [];
        for (var z = arr.length - 1; z >= 0; z--) if (arr[z].petakId === data.id) arr.splice(z, 1);
      });
    }
    return;
  }
  if (aksi === 'jadwal_status' && hasil && hasil.id) {
    var jd = S.data.jadwal || [];
    for (var q = 0; q < jd.length; q++) if (jd[q].id === hasil.id) jd[q] = hasil;
  }
  if (aksi === 'panen_bayar' && hasil && hasil.id) {
    var pn = S.data.panen || [];
    for (var w = 0; w < pn.length; w++) if (pn[w].id === hasil.id) pn[w] = hasil;
  }
  if (aksi === 'stok_mutasi' && hasil && hasil.itemId) {
    var inv = S.data.inventaris || [];
    for (var v = 0; v < inv.length; v++) {
      if (inv[v].id === hasil.itemId) inv[v].stok = hasil.stokBaru;
    }
  }
}

function sinkron() {
  if (!S.daring || !S.antrean.length || !S.token) return Promise.resolve();
  var salinan = S.antrean.slice();
  toast('Mengirim ' + salinan.length + ' catatan tertunda…');
  return panggil('sync_batch', { antrean: salinan }).then(function (hasil) {
    var gagalTersisa = [];
    var pesanGagal = [];
    for (var i = 0; i < hasil.hasil.length; i++) {
      var h = hasil.hasil[i];
      if (h.ok) continue;
      for (var j = 0; j < salinan.length; j++) {
        if (salinan[j].kunciLokal === h.kunciLokal) gagalTersisa.push(salinan[j]);
      }
      if (pesanGagal.length < 3) pesanGagal.push(h.pesan);
    }
    S.antrean = gagalTersisa;
    simpanLokal(LS.antrean, S.antrean);
    if (hasil.gagal > 0) {
      toast(hasil.berhasil + ' terkirim, ' + hasil.gagal + ' gagal: ' +
            pesanGagal.join(' | '), 'galat');
    } else if (hasil.berhasil > 0) {
      toast(hasil.berhasil + ' catatan berhasil dikirim.', 'sukses');
    }
    return muatData(true);
  }).catch(function (e) {
    toast('Sinkronisasi gagal: ' + e.message, 'galat');
  });
}

/* ============================================================
   PEMUATAN DATA
   ============================================================ */

function muatData(diam) {
  if (!S.token) return Promise.resolve();
  return panggil('bootstrap', {}).then(function (d) {
    S.data = {
      petak: d.petak || [], biaya: d.biaya || [], panen: d.panen || [],
      pembeli: d.pembeli || [], jadwal: d.jadwal || [], kerusakan: d.kerusakan || [],
      aktivitas: d.aktivitas || [], fotoTumbuh: d.fotoTumbuh || [], sensor: d.sensor || [],
      sensorBacaan: d.sensorBacaan || [], inventaris: d.inventaris || [],
      edukasi: d.edukasi || [], buletin: d.buletin || [], cuaca: d.cuaca || [],
      harga: d.harga || [], komoditas: d.komoditas || [], pengguna: d.pengguna || [],
      mutasi: d.mutasi || []
    };
    S.pengaturan = d.pengaturan || {};
    S.lisensi = d.lisensi || null;
    S.database = d.database || {};
    S.versiPeladen = d.versiPeladen || '';
    S.tanggalRilis = d.tanggalRilis || '';
    S.siap = true;
    simpanLokal(LS.data, S.data);
    simpanLokal('tanipintar_pengaturan', S.pengaturan);
    terapkanIdentitas();
    if (!diam) render();
    return d;
  }).catch(function (e) {
    if (e.sesiHabis) { render(); return; }
    // Gagal memuat bukan berarti aplikasi mati: salinan lokal dipakai.
    var lokal = bacaLokal(LS.data, null);
    if (lokal) {
      S.data = lokal;
      S.pengaturan = bacaLokal('tanipintar_pengaturan', {});
      S.siap = true;
      terapkanIdentitas();
      toast('Memakai data tersimpan di perangkat. (' + e.message + ')');
    } else {
      toast('Gagal memuat data: ' + e.message, 'galat');
    }
    render();
  });
}

function terapkanIdentitas() {
  var nama = S.pengaturan.namaAplikasi || 'TaniPintar';
  var sub = S.pengaturan.subJudul || 'WebGIS & Manajemen Kebun Petani';
  $('judulAtas').textContent = nama;
  $('subJudulAtas').textContent = sub;
  document.title = nama + ' — ' + sub;
  var logo = S.pengaturan.logoUrl;
  if (logo && String(logo).indexOf('data:image') === 0) {
    $('logoAtas').innerHTML = '<img src="' + esc(logo) + '" alt="">';
  }
}

/* ---------- pencarian data ---------- */
function petakById(id) {
  var d = S.data.petak || [];
  for (var i = 0; i < d.length; i++) if (String(d[i].id) === String(id)) return d[i];
  return null;
}

function namaPetak(id) {
  var p = petakById(id);
  return p ? p.nama : (id ? '(petak terhapus)' : '—');
}

function itemById(id) {
  var d = S.data.inventaris || [];
  for (var i = 0; i < d.length; i++) if (String(d[i].id) === String(id)) return d[i];
  return null;
}

function komoditasByNama(nama) {
  var d = S.data.komoditas || [];
  var cari = String(nama || '').toLowerCase();
  if (!cari) return null;
  for (var i = 0; i < d.length; i++) {
    var n = String(d[i].nama || '').toLowerCase();
    if (n && (cari.indexOf(n) >= 0 || n.indexOf(cari) >= 0)) return d[i];
  }
  return null;
}

/**
 * MODE PEMBACA (viewer).
 *
 * Saat lisensi habis, aplikasi tidak dikunci — ia turun menjadi mode
 * pembaca. Seluruh data lama tetap terbuka, tersaring, dan bisa dicetak;
 * hanya pencatatan baru yang berhenti.
 *
 * Ini keputusan yang disengaja. Mengunci data pelanggan adalah cara
 * tercepat merusak nama baik, dan kelompok tani yang catatannya
 * tersandera tidak akan merekomendasikan aplikasi ini kepada siapa pun.
 * Peladen menegakkan hal yang sama lewat AKSI_TANPA_LISENSI; pemeriksaan
 * di sini hanya agar tombol yang pasti ditolak tidak ditampilkan.
 */
function modePembaca() {
  var l = S.lisensi;
  if (!l) return false;
  if (l.belumDisetel) return false;
  return l.aktif !== true;
}

function bolehUbah() {
  if (!S.pengguna) return false;
  if (modePembaca()) return false;
  return S.pengguna.peran !== 'pengamat';
}

function bolehKelola() {
  if (!S.pengguna) return false;
  if (modePembaca()) return false;
  return S.pengguna.peran === 'penyuluh' || S.pengguna.peran === 'admin';
}

/**
 * Sengaja TIDAK ikut mode pembaca: admin harus tetap bisa membuka panel
 * lisensi untuk mengaktifkan kunci baru. Mengunci jalan keluarnya sendiri
 * akan membuat lisensi mustahil diperpanjang dari dalam aplikasi.
 */
function bolehAdmin() {
  return !!S.pengguna && S.pengguna.peran === 'admin';
}

/** Wewenang admin yang mengubah data — tetap terhenti di mode pembaca. */
function bolehAdminUbah() {
  return bolehAdmin() && !modePembaca();
}


/* ============================================================
   MODAL & FORMULIR
   ============================================================ */

var _modalCallback = null;

/* Benar bila satu langkah riwayat sedang menahan modal yang terbuka. */
var _modalDiRiwayat = false;

function modalBuka(judul, isiHtml, callback, labelTombol) {
  /* Modal lama ditutup langsung, bukan lewat riwayat. Modal yang membuka
     modal lain (mis. Detail lalu Ubah) tidak boleh mendorong dua langkah —
     kalau begitu, satu tekan Kembali hanya akan membuka kembali modal
     sebelumnya, bukan kembali ke daftar. */
  tutupModalDom();
  var tirai = document.createElement('div');
  tirai.className = 'tirai';
  tirai.id = 'tirai';
  tirai.innerHTML =
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div class="kepala"><h3>' + esc(judul) + '</h3>' +
      '<button type="button" onclick="modalTutup()" aria-label="Tutup">&times;</button></div>' +
      '<div id="modalIsi">' + isiHtml + '</div>' +
      (callback ? '<div class="baris" style="margin-top:14px">' +
        '<button type="button" class="tbl sekunder" onclick="modalTutup()">Batal</button>' +
        '<button type="button" class="tbl kanan" id="modalSimpan" ' +
        'title="Enter untuk menyimpan (Ctrl+Enter dari kotak catatan)">' +
        esc(labelTombol || 'Simpan') + '</button></div>' : '') +
    '</div>';
  tirai.onclick = function () { modalTutup(); };
  document.body.appendChild(tirai);
  _modalCallback = callback || null;
  if (callback) $('modalSimpan').onclick = modalKirim;

  if (!_modalDiRiwayat) {
    try {
      history.pushState({ tp: 'modal' }, '', location.hash || '');
      _modalDiRiwayat = true;
    } catch (e) { /* riwayat tidak tersedia — modal tetap berfungsi */ }
  }
  var pertama = tirai.querySelector('input,select,textarea');
  if (pertama && window.innerWidth > 700) setTimeout(function () { pertama.focus(); }, 60);
}

/** Menutup modal secara nyata di DOM. Tidak menyentuh riwayat peramban. */
function tutupModalDom() {
  var t = $('tirai');
  if (t) t.parentNode.removeChild(t);
  _modalCallback = null;
}

/**
 * Menutup modal lewat riwayat peramban, bukan langsung.
 *
 * Alasannya: saat modal dibuka, satu langkah riwayat ikut didorong supaya
 * tombol Kembali di ponsel menutup modal alih-alih keluar dari aplikasi.
 * Bila modal ditutup langsung tanpa menarik langkah itu kembali, riwayat
 * akan menumpuk dan pengguna harus menekan Kembali berkali-kali sebelum
 * benar-benar berpindah.
 */
/* Tindakan yang menunggu langkah riwayat modal selesai ditarik. */
var _lanjutSetelahRiwayat = null;

function modalTutup() {
  modalTutupLalu(null);
}

/**
 * Menutup modal, lalu menjalankan `lanjut` setelah langkah riwayatnya
 * benar-benar tertarik.
 *
 * history.back() berjalan asinkron. Bila tindakan berikutnya — berpindah
 * tab, membuka modal lain — dijalankan langsung sesudahnya, popstate yang
 * menyusul akan mengenai keadaan yang salah: tab yang baru dibuka ikut
 * tertutup. Karena itu tindakan lanjutan dititipkan ke penangan popstate.
 */
function modalTutupLalu(lanjut) {
  if (!$('tirai')) {
    if (lanjut) lanjut();
    return;
  }
  if (_modalDiRiwayat) {
    _modalDiRiwayat = false;
    _lanjutSetelahRiwayat = lanjut || null;
    tutupModalDom();
    try { history.back(); return; } catch (e) { _lanjutSetelahRiwayat = null; }
  }
  tutupModalDom();
  if (lanjut) lanjut();
}

/**
 * PENTING: callback dijalankan LEBIH DULU, modal ditutup hanya bila
 * callback tidak mengembalikan false. Kalau urutannya dibalik, validasi
 * yang gagal akan tetap menutup formulir dan menghapus ketikan pengguna.
 */
function modalKirim() {
  if (!_modalCallback) { modalTutup(); return; }
  var nilai = kumpulkanRuas();
  var hasil;
  try { hasil = _modalCallback(nilai); }
  catch (e) { toast(e.message, 'galat'); return; }
  if (hasil === false) return;
  if (hasil && typeof hasil.then === 'function') {
    var tombol = $('modalSimpan');
    if (tombol) { tombol.disabled = true; tombol.innerHTML = '<span class="muat"></span> Menyimpan…'; }
    hasil.then(function (r) {
      if (r === false) {
        if (tombol) { tombol.disabled = false; tombol.textContent = 'Simpan'; }
        return;
      }
      modalTutup();
    }).catch(function (e) {
      if (tombol) { tombol.disabled = false; tombol.textContent = 'Simpan'; }
      toast(e.message, 'galat');
    });
    return;
  }
  modalTutup();
}

var _ruasAktif = [];

/**
 * Membangun formulir dari daftar ruas.
 * Tipe: teks, angka, tanggal, pilih, area, centang, foto, aksi, info
 */
function bentukRuas(daftar, nilaiAwal) {
  _ruasAktif = daftar;
  nilaiAwal = nilaiAwal || {};
  var html = '';
  for (var i = 0; i < daftar.length; i++) {
    var f = daftar[i];
    var v = nilaiAwal[f.k];
    if (v === undefined || v === null) v = (f.bawaan !== undefined ? f.bawaan : '');
    var id = 'f_' + f.k;

    if (f.t === 'info') {
      html += '<div class="spanduk ' + (f.warna || 'biru') + '">' + f.isi + '</div>';
      continue;
    }
    if (f.t === 'aksi') {
      html += '<label class="ruas"><span class="nama">' + esc(f.n || '') + '</span>' +
        '<button type="button" class="tbl sekunder kecil" onclick="' + f.aksi + '">' +
        esc(f.label) + '</button>' +
        '<span class="bantu" id="f_help_' + f.k + '">' + esc(f.help || '') + '</span></label>';
      continue;
    }

    html += '<label class="ruas"><span class="nama">' + esc(f.n) +
            (f.wajib ? ' *' : '') + '</span>';
    if (f.t === 'pilih') {
      html += '<select id="' + id + '"' + (f.onchange ? ' onchange="' + f.onchange + '"' : '') + '>';
      for (var j = 0; j < f.opsi.length; j++) {
        var o = f.opsi[j];
        var ov = (typeof o === 'object') ? o.v : o;
        var ol = (typeof o === 'object') ? o.l : o;
        html += '<option value="' + esc(ov) + '"' +
                (String(ov) === String(v) ? ' selected' : '') + '>' + esc(ol) + '</option>';
      }
      html += '</select>';
    } else if (f.t === 'area') {
      /* Pada textarea, Enter tetap berarti baris baru — catatan lapangan
         sering butuh beberapa baris. Untuk menyimpan dari sini dipakai
         Ctrl+Enter, dan enterkeyhint dibiarkan "enter". */
      html += '<textarea id="' + id + '" rows="' + (f.baris || 3) + '" ' +
              'enterkeyhint="enter" placeholder="' +
              esc(f.contoh || '') + '">' + esc(v) + '</textarea>';
    } else if (f.t === 'centang') {
      html += '<span class="baris"><input type="checkbox" id="' + id + '" ' +
              'style="width:auto;margin:0" ' + (v === true || v === 'true' ? 'checked' : '') +
              '> <span style="font-size:.84rem">' + esc(f.keterangan || 'Ya') + '</span></span>';
    } else if (f.t === 'warna') {
      /* Input color HTML tidak punya keadaan "kosong" — nilainya selalu
         sebuah warna. Nilai sebenarnya disimpan di input tersembunyi,
         supaya "ikuti warna fase" tetap bisa dipilih. */
      html += '<span class="baris">' +
        '<input type="color" id="' + id + '_pilih" value="' + esc(v || '#4F6F52') + '" ' +
        'style="width:52px;padding:2px;height:38px" ' +
        'oninput="setWarnaRuas(\'' + f.k + '\', this.value)">' +
        '<input type="text" id="' + id + '" value="' + esc(v) + '" ' +
        'placeholder="ikuti warna fase" style="flex:1" ' +
        'oninput="samakanWarnaRuas(\'' + f.k + '\')">' +
        '<button type="button" class="tbl sekunder kecil" ' +
        'onclick="setWarnaRuas(\'' + f.k + '\', \'\')">Kosongkan</button></span>';
    } else if (f.t === 'fotoBanyak') {
      /* Beberapa foto sekaligus. Menyimpannya sebagai larik di satu ruas
         tersembunyi; pemisahannya menjadi baris-baris terpisah dikerjakan
         saat penyimpanan, karena satu sel Spreadsheet hanya memuat satu foto. */
      html += '<div class="baris" style="margin-bottom:6px">' +
        '<button type="button" class="tbl sekunder kecil" onclick="ambilFotoBanyak(\'' +
        f.k + '\',true)">📷 Kamera</button>' +
        '<button type="button" class="tbl sekunder kecil" onclick="ambilFotoBanyak(\'' +
        f.k + '\',false)">🖼️ Pilih beberapa foto</button>' +
        '<button type="button" class="tbl sekunder kecil" onclick="kosongkanFotoBanyak(\'' +
        f.k + '\')">Kosongkan</button></div>' +
        '<input type="hidden" id="' + id + '" value="">' +
        '<div id="pratinjau_' + f.k + '" class="petakFoto"></div>' +
        '<div id="hitung_' + f.k + '" class="bantu"></div>';
    } else if (f.t === 'foto') {
      html += '<div class="baris" style="margin-bottom:6px">' +
        '<button type="button" class="tbl sekunder kecil" onclick="ambilFoto(\'' + f.k +
        '\',true)">📷 Kamera</button>' +
        '<button type="button" class="tbl sekunder kecil" onclick="ambilFoto(\'' + f.k +
        '\',false)">🖼️ Galeri</button>' +
        '<button type="button" class="tbl sekunder kecil" onclick="hapusFoto(\'' + f.k +
        '\')">Hapus</button></div>' +
        '<input type="hidden" id="' + id + '" value="' + esc(v) + '">' +
        '<div id="pratinjau_' + f.k + '">' +
        (v ? '<img class="foto" src="' + esc(v) + '" onclick="zoomFoto(this.src)">' : '') +
        '</div>';
    } else {
      var tipe = f.t === 'angka' ? 'number' : (f.t === 'tanggal' ? 'date' : 'text');
      /* enterkeyhint mengubah tulisan tombol pada papan ketik ponsel dari
         "return" menjadi "go". Tanpa itu, pengguna tidak punya petunjuk
         bahwa menekannya akan menyimpan. */
      var kotak = '<input type="' + tipe + '" id="' + id + '" value="' + esc(v) + '"' +
        ' enterkeyhint="go"' +
        (f.t === 'angka' ? ' step="' + (f.langkah || 'any') + '" inputmode="decimal"' : '') +
        (f.contoh ? ' placeholder="' + esc(f.contoh) + '"' : '') +
        (f.onchange ? ' oninput="' + f.onchange + '"' : '') + '>';
      /* Kotak tanggal punya tombol bawaan peramban sendiri; menambah
         tombol kedua di atasnya justru menutupi ikon kalender. */
      html += (f.t === 'tanggal') ? kotak : bungkusKosongkan(kotak, v);
    }
    if (f.help) html += '<span class="bantu" id="f_help_' + f.k + '">' + f.help + '</span>';
    html += '</label>';
  }
  return html;
}

/**
 * Apakah kejadian papan ketik ini berarti "kirim"?
 *
 * Di ponsel, tombol Go/Enter/Selesai tidak selalu mengirim key 'Enter':
 * sebagian papan ketik Android mengirim keyCode 13 tanpa key, sebagian
 * lagi memicu keydown 'Unidentified' dengan keyCode 229 saat teks masih
 * dalam proses penyusunan (composition). Yang terakhir HARUS diabaikan,
 * kalau tidak formulir akan terkirim di tengah pengetikan kata.
 */
/**
 * Modal dianggap terbuka hanya bila ada tombol simpan di dalamnya.
 * Modal yang sekadar menampilkan keterangan tidak punya apa pun untuk
 * dikirim, dan Enter di sana tidak boleh melakukan apa-apa.
 */
function modalTerbuka() {
  return !!($('tirai') && $('modalSimpan'));
}

function tekanEnter(e) {
  if (!e) return false;
  if (e.isComposing || e.keyCode === 229) return false;
  return e.key === 'Enter' || e.keyCode === 13;
}

/** Enter pada satu ruas memindahkan sorotan ke ruas berikutnya. */
function enterKeRuas(e, idBerikut) {
  if (!tekanEnter(e)) return;
  e.preventDefault();
  var el = $(idBerikut);
  if (el) el.focus();
}

/**
 * Penanganan Enter yang berlaku menyeluruh, dipasang sekali di mulai().
 * Ditulis di satu tempat supaya setiap formulir baru ikut berperilaku
 * sama tanpa perlu ditambal satu per satu.
 */
function pasangEnterMenyeluruh() {
  document.addEventListener('keydown', function (e) {
    if (!tekanEnter(e)) return;
    var t = e.target;
    if (!t) return;
    var tag = String(t.tagName || '').toUpperCase();

    // Tombol dan tautan sudah menangani Enter sendiri.
    if (tag === 'BUTTON' || tag === 'A') return;

    // Textarea: Enter = baris baru. Ctrl+Enter atau Cmd+Enter = kirim.
    if (tag === 'TEXTAREA') {
      if ((e.ctrlKey || e.metaKey) && modalTerbuka()) {
        e.preventDefault();
        modalKirim();
      }
      return;
    }

    if (tag !== 'INPUT' && tag !== 'SELECT') return;
    if (t.type === 'checkbox' || t.type === 'radio' || t.type === 'button') return;

    if (modalTerbuka()) {
      e.preventDefault();
      // Papan ketik ponsel ditutup lebih dulu; bila modal tetap terbuka
      // karena penyimpanan ditolak, ruas yang salah masih terlihat.
      if (t.blur) t.blur();
      modalKirim();
      return;
    }

    /* Di luar modal, Enter berarti "selesai mengetik": papan ketik ponsel
       ditutup dan perubahan diterapkan. Ini penting pada kotak pencarian
       dan penyaringan, yang tanpa ini tidak punya cara untuk ditutup
       selain menekan area kosong. */
    e.preventDefault();
    if (t.blur) t.blur();
    if (typeof t.onchange === 'function') t.onchange();
  });
}

/**
 * Membungkus sebuah kotak isian dengan tombol silang untuk mengosongkannya.
 *
 * Memperbaiki salah ketik di ponsel biasanya berarti menahan tombol hapus
 * belasan kali, atau menyorot seluruh teks dengan tepat — dua-duanya
 * menyusahkan dengan tangan berlumpur di kebun.
 */
function bungkusKosongkan(htmlInput, nilai) {
  var terisi = String(nilai === null || nilai === undefined ? '' : nilai) !== '';
  return '<span class="kotakIsian' + (terisi ? ' terisi' : '') + '">' + htmlInput +
    '<button type="button" class="kosongkan" tabindex="-1" aria-label="Kosongkan isian" ' +
    'onclick="kosongkanIsian(this)">&times;</button></span>';
}

function kosongkanIsian(tombol) {
  var bungkus = tombol.parentNode;
  var el = bungkus.querySelector('input');
  if (!el) return;
  el.value = '';
  bungkus.classList.remove('terisi');
  /* Kejadian input dibangkitkan sendiri supaya penanganan oninput yang
     menempel pada ruas — misalnya perhitungan total panen — ikut berjalan.
     Tanpa ini, total akan tetap menampilkan angka dari nilai yang sudah
     dihapus. */
  try {
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  } catch (e) {
    if (typeof el.oninput === 'function') el.oninput();
  }
  el.focus();
}

/**
 * Menampilkan atau menyembunyikan tombol silang mengikuti isi kotak.
 * Dipasang sekali sebagai penangan menyeluruh, bukan per ruas, supaya
 * setiap kotak isian baru ikut berperilaku sama tanpa perlu diingat.
 */
function pasangKosongkanMenyeluruh() {
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || String(el.tagName).toUpperCase() !== 'INPUT') return;
    var bungkus = el.parentNode;
    if (!bungkus || !bungkus.classList ||
        !bungkus.classList.contains('kotakIsian')) return;
    if (String(el.value) === '') bungkus.classList.remove('terisi');
    else bungkus.classList.add('terisi');
  });
}

function setWarnaRuas(kunci, nilai) {
  var teks = $('f_' + kunci);
  var pilih = $('f_' + kunci + '_pilih');
  if (teks) teks.value = nilai;
  if (pilih && nilai) pilih.value = nilai;
}

function samakanWarnaRuas(kunci) {
  var teks = $('f_' + kunci);
  var pilih = $('f_' + kunci + '_pilih');
  if (!teks || !pilih) return;
  if (/^#[0-9a-fA-F]{6}$/.test(String(teks.value).trim())) pilih.value = teks.value.trim();
}

function kumpulkanRuas() {
  var nilai = {};
  for (var i = 0; i < _ruasAktif.length; i++) {
    var f = _ruasAktif[i];
    if (f.t === 'aksi' || f.t === 'info') continue;
    var el = $('f_' + f.k);
    if (!el) continue;
    if (f.t === 'centang') nilai[f.k] = el.checked;
    else if (f.t === 'angka') nilai[f.k] = el.value === '' ? '' : Number(el.value);
    else nilai[f.k] = el.value;
  }
  return nilai;
}

/* ---------- pengambilan & pengecilan foto ---------- */
function ambilFoto(kunci, pakaiKamera) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  if (pakaiKamera) input.setAttribute('capture', 'environment');
  input.onchange = function () {
    var berkas = input.files && input.files[0];
    if (!berkas) return;
    kecilkanGambar(berkas, 1280, function (dataUrl) {
      var el = $('f_' + kunci);
      if (el) el.value = dataUrl;
      var pra = $('pratinjau_' + kunci);
      if (pra) pra.innerHTML = '<img class="foto" src="' + dataUrl +
                               '" onclick="zoomFoto(this.src)">';
      toast('Foto siap (' + Math.round(dataUrl.length / 1024) + ' KB).');
    });
  };
  input.click();
}

/* Foto yang sedang disiapkan, per ruas. Disimpan di luar DOM karena
   isinya besar; menaruh belasan gambar base64 di atribut value membuat
   halaman berat dan lamban digulir. */
var _fotoBanyak = {};

/**
 * Memilih beberapa foto sekaligus.
 *
 * Setiap berkas diperkecil satu per satu, bukan serentak: memproses
 * sepuluh gambar sekaligus membuat ponsel kelas menengah membeku
 * beberapa detik tanpa satu pun tanda bahwa aplikasinya masih hidup.
 */
function ambilFotoBanyak(kunci, pakaiKamera) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  if (pakaiKamera) input.setAttribute('capture', 'environment');
  else input.setAttribute('multiple', 'multiple');

  input.onchange = function () {
    var berkas = [];
    for (var i = 0; i < (input.files ? input.files.length : 0); i++) {
      berkas.push(input.files[i]);
    }
    if (!berkas.length) return;

    if (!_fotoBanyak[kunci]) _fotoBanyak[kunci] = [];
    var maksSekali = 20;
    if (berkas.length > maksSekali) {
      toast('Maksimal ' + maksSekali + ' foto sekali pilih. ' +
            'Sisanya dapat ditambahkan setelah ini.', 'galat');
      berkas = berkas.slice(0, maksSekali);
    }

    var selesai = 0;
    tandaiProsesFoto(kunci, 0, berkas.length);

    function berikutnya() {
      if (selesai >= berkas.length) {
        tandaiProsesFoto(kunci, 0, 0);
        gambarPratinjauBanyak(kunci);
        toast(berkas.length + ' foto siap disimpan.', 'sukses');
        return;
      }
      var b = berkas[selesai];
      kecilkanGambar(b, 1280, function (dataUrl) {
        _fotoBanyak[kunci].push({ dataUrl: dataUrl, nama: b.name || '' });
        selesai++;
        tandaiProsesFoto(kunci, selesai, berkas.length);
        /* Jeda satu putaran supaya layar sempat menggambar kemajuannya. */
        setTimeout(berikutnya, 0);
      });
    }
    berikutnya();
  };
  input.click();
}

function tandaiProsesFoto(kunci, selesai, total) {
  var el = $('hitung_' + kunci);
  if (!el) return;
  if (total > 0) {
    el.innerHTML = '<span class="muat"></span> Memperkecil foto ' + selesai +
      ' dari ' + total + '…';
  } else {
    var n = (_fotoBanyak[kunci] || []).length;
    el.textContent = n ? n + ' foto siap disimpan. Tekan sebuah foto untuk ' +
      'memperbesarnya.' : '';
  }
}

function gambarPratinjauBanyak(kunci) {
  var wadah = $('pratinjau_' + kunci);
  if (!wadah) return;
  var daftar = _fotoBanyak[kunci] || [];
  var html = '';
  for (var i = 0; i < daftar.length; i++) {
    html += '<div class="petakFotoItem">' +
      '<img src="' + esc(daftar[i].dataUrl) + '" alt="" ' +
      'onclick="bukaGaleri(kumpulanFotoBanyak(\'' + jsq(kunci) + '\'),' + i + ')">' +
      '<button type="button" class="hapusFoto" aria-label="Buang foto ini" ' +
      'onclick="buangFotoBanyak(\'' + jsq(kunci) + '\',' + i + ')">&times;</button>' +
      '</div>';
  }
  wadah.innerHTML = html;
  tandaiProsesFoto(kunci, 0, 0);
}

/** Bentuk yang dipahami galeri: larik objek berruas fotoUrl. */
function kumpulanFotoBanyak(kunci) {
  return (_fotoBanyak[kunci] || []).map(function (f, i) {
    return { fotoUrl: f.dataUrl, judul: 'Foto ' + (i + 1), catatan: f.nama };
  });
}

function buangFotoBanyak(kunci, indeks) {
  if (!_fotoBanyak[kunci]) return;
  _fotoBanyak[kunci].splice(indeks, 1);
  gambarPratinjauBanyak(kunci);
}

function kosongkanFotoBanyak(kunci) {
  _fotoBanyak[kunci] = [];
  gambarPratinjauBanyak(kunci);
}

/** Dipanggil formulir saat menyimpan. */
function fotoBanyakTerkumpul(kunci) {
  return (_fotoBanyak[kunci] || []).map(function (f) { return f.dataUrl; });
}

function lupakanFotoBanyak(kunci) { delete _fotoBanyak[kunci]; }

function hapusFoto(kunci) {
  var el = $('f_' + kunci);
  if (el) el.value = '';
  var pra = $('pratinjau_' + kunci);
  if (pra) pra.innerHTML = '';
}

/**
 * Mengecilkan gambar sebelum disimpan.
 * Batasnya bukan selera: satu sel Google Sheets hanya menampung sekitar
 * 50.000 karakter, jadi data URL harus di bawah ±45.000 karakter.
 * Mutu diturunkan bertahap sampai muat.
 */
function kecilkanGambar(berkas, sisiMaks, selesai) {
  var pembaca = new FileReader();
  pembaca.onload = function () {
    var gbr = new Image();
    gbr.onload = function () {
      var lebar = gbr.width, tinggi = gbr.height;
      if (lebar > sisiMaks || tinggi > sisiMaks) {
        if (lebar > tinggi) { tinggi = Math.round(tinggi * sisiMaks / lebar); lebar = sisiMaks; }
        else { lebar = Math.round(lebar * sisiMaks / tinggi); tinggi = sisiMaks; }
      }
      var kanvas = document.createElement('canvas');
      kanvas.width = lebar; kanvas.height = tinggi;
      kanvas.getContext('2d').drawImage(gbr, 0, 0, lebar, tinggi);
      var mutu = 0.82;
      var keluar = kanvas.toDataURL('image/jpeg', mutu);
      while (keluar.length > 45000 && mutu > 0.28) {
        mutu -= 0.1;
        keluar = kanvas.toDataURL('image/jpeg', mutu);
      }
      if (keluar.length > 45000 && sisiMaks > 640) {
        // Masih terlalu besar walau mutu sudah rendah — perkecil dimensinya.
        kecilkanGambar(berkas, Math.round(sisiMaks * 0.7), selesai);
        return;
      }
      selesai(keluar);
    };
    gbr.onerror = function () { toast('Berkas gambar tidak dapat dibaca.', 'galat'); };
    gbr.src = pembaca.result;
  };
  pembaca.onerror = function () { toast('Gagal membaca berkas.', 'galat'); };
  pembaca.readAsDataURL(berkas);
}

/* ---------- konfirmasi ---------- */
function konfirmasi(judul, pesan, callback, labelTombol, bahaya) {
  modalBuka(judul, '<p>' + pesan + '</p>', function () { callback(); }, labelTombol || 'Ya');
  if (bahaya) {
    var b = $('modalSimpan');
    if (b) b.className = 'tbl bahaya kanan';
  }
}

function pindah(tab, dariRiwayat) {
  if (S.tab === tab) return;
  bersihkanPeta();
  S.tab = tab;

  render();
  window.scrollTo(0, 0);
}

function subPindah(kelompok, nilai, dariRiwayat) {
  if (S.subtab[kelompok] === nilai) return;
  S.subtab[kelompok] = nilai;
  bersihkanPeta();

  // Ringkasan terasa seperti "mundur satu langkah" bagi pengguna, dan
  // tombol Kembali seharusnya menuruti anggapan itu.
  if (!dariRiwayat) dorongRiwayat();
  render();
}

/* ============================================================
   RIWAYAT & TOMBOL KEMBALI PONSEL
   ============================================================
   Tanpa ini, menekan Kembali di Android langsung menutup aplikasi —
   termasuk saat sebuah formulir sedang terbuka. Pengguna yang salah
   tekan kehilangan seluruh ketikannya tanpa peringatan.
   ============================================================ */

function keadaanTampilan() {
  var sub = {};
  for (var k in S.subtab) sub[k] = S.subtab[k];
  return { tp: 'tampilan', tab: S.tab, sub: sub, pokokPetak: S.pokokPetak || '' };
}

function dorongRiwayat() {
  try {
    history.pushState(keadaanTampilan(), '', '#' + S.tab);
  } catch (e) { /* peramban lama — navigasi tetap berjalan tanpa riwayat */ }
}

function gantiRiwayat() {
  try {
    history.replaceState(keadaanTampilan(), '', '#' + S.tab);
  } catch (e) { /* diabaikan */ }
}

/**
 * Menangani tombol Kembali. Urutan pemeriksaannya penting: modal harus
 * ditutup lebih dulu sebelum tab dipindahkan, kalau tidak pengguna akan
 * melihat tab berganti sementara formulirnya masih menutupi layar.
 */
function pasangTombolKembali() {
  window.addEventListener('popstate', function (e) {
    /* Langkah ini ditarik oleh modalTutupLalu(), bukan oleh pengguna.
       Modal sudah tertutup; yang tersisa hanya menjalankan titipannya. */
    if (_lanjutSetelahRiwayat) {
      var lanjut = _lanjutSetelahRiwayat;
      _lanjutSetelahRiwayat = null;
      lanjut();
      return;
    }

    /* Penampil foto ditutup lebih dulu daripada modal: ia digambar di
       atas segalanya, dan menutup modal di baliknya akan terasa seperti
       satu tekan Kembali melompati dua langkah. */
    if (typeof galeriTerbuka === 'function' && galeriTerbuka()) {
      _galeriDiRiwayat = false;
      tutupGaleriDom();
      return;
    }

    if ($('tirai')) {
      _modalDiRiwayat = false;
      tutupModalDom();
      return;
    }
    _modalDiRiwayat = false;

    var st = e.state;
    if (st && st.tp === 'tampilan') {
      /* Sub-tab DIGANTI seluruhnya, bukan digabung. Menggabungkan hanya
         menambah kunci dan tidak pernah menghapusnya, sehingga kembali ke
         keadaan sebelum sebuah sub-tab pernah dibuka tidak akan pernah
         berhasil — sub-tab terakhir tetap menempel. */
      S.subtab = {};
      if (st.sub) {
        for (var k in st.sub) S.subtab[k] = st.sub[k];
      }
      if (st.pokokPetak !== undefined) S.pokokPetak = st.pokokPetak;
      if (st.tab && st.tab !== S.tab) {
        bersihkanPeta();
        S.tab = st.tab;
      }
      render();
      window.scrollTo(0, 0);
      return;
    }

    /* Tidak ada keadaan tersimpan: pengguna sudah di langkah paling awal.
       Aplikasi dibiarkan tertutup — menahannya di sini akan membuat
       aplikasi mustahil ditinggalkan lewat tombol Kembali. */
  });
}

function pil(kelompok, daftar, bawaan) {
  var aktif = S.subtab[kelompok] || bawaan;
  var html = '<div class="pil" style="margin-bottom:12px">';
  for (var i = 0; i < daftar.length; i++) {
    var d = daftar[i];
    html += '<button onclick="subPindah(\'' + kelompok + '\',\'' + d.k + '\')" class="' +
            (aktif === d.k ? 'aktif' : '') + '">' + esc(d.n) + '</button>';
  }
  return html + '</div>';
}

function subAktif(kelompok, bawaan) {
  return S.subtab[kelompok] || bawaan;
}

var _perluRenderPeta = false;

function render() {
  bangunNav();
  var el = $('isi');

  if (!S.token || !S.pengguna) {
    el.innerHTML = spandukDemo() + layarMasuk();
    return;
  }
  if (!S.siap) {
    el.innerHTML = '<div class="kosong"><span class="muat"></span><br>Memuat data kebun…</div>';
    return;
  }

  var html = '';
  html += spandukStatus();

  switch (S.tab) {
    case 'dasbor': html += tabDasbor(); break;
    case 'petak': html += tabPetak(); break;
    case 'pokok': html += tabPokok(); break;
    case 'kalender': html += tabKalender(); break;
    case 'keuangan': html += tabKeuangan(); break;
    case 'pupuk': html += tabPupuk(); break;
    case 'kerusakan': html += tabKerusakan(); break;
    case 'aktivitas': html += tabAktivitas(); break;
    case 'sensor': html += tabSensor(); break;
    case 'stok': html += tabStok(); break;
    case 'cuaca': html += tabCuaca(); break;
    case 'tanibot': html += tabTaniBot(); break;
    case 'edukasi': html += tabEdukasi(); break;
    case 'analisis': html += tabAnalisis(); break;
    case 'penyuluh': html += bolehKelola() ? tabPenyuluh() : '<p>Tidak berwenang.</p>'; break;
    case 'laporan': html += tabLaporan(); break;
    case 'setelan': html += tabSetelan(); break;
    case 'tentang': html += tabTentang(); break;
    default: html += tabDasbor();
  }
  el.innerHTML = html;

  if (_perluRenderPeta) { _perluRenderPeta = false; setTimeout(gambarPeta, 30); }
  if (_perluRenderPetaPokok) {
    _perluRenderPetaPokok = false;
    setTimeout(gambarPetaPokok, 30);
  }
  if (S.tab === 'tanibot') gulirChatKeBawah();
}
