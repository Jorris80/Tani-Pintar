   Ruas mengikuti lembar Aktivitas:
   petakId, jenis, judul, waktu, operator, catatan, fotoUrl,
   durasiMenit, luasM2
   ============================================================ */

function tabAktivitas() {
  var aktivitas = (S.data.aktivitas || []).slice().sort(function (a, b) {
    return String(b.waktu) < String(a.waktu) ? -1 : 1;
  });
  var filterPetak = S.filter.aktivitasPetak || '';
  if (filterPetak) {
    aktivitas = aktivitas.filter(function (a) {
      return String(a.petakId) === String(filterPetak);
    });
  }

  var menitTotal = 0, luasTotal = 0;
  aktivitas.forEach(function (a) {
    menitTotal += angka(a.durasiMenit); luasTotal += angka(a.luasM2);
  });

  var opsi = '<option value="">Semua petak</option>';
  (S.data.petak || []).forEach(function (p) {
    opsi += '<option value="' + esc(p.id) + '"' +
      (String(p.id) === String(filterPetak) ? ' selected' : '') + '>' + esc(p.nama) + '</option>';
  });

  var html = '<div class="kisi kisi3" style="margin-bottom:12px">' +
    kartuStat('📋', aktivitas.length, 'Catatan Aktivitas', '') +
    kartuStat('⏱️', Math.round(menitTotal / 60 * 10) / 10 + ' jam', 'Total Waktu Kerja', '') +
    kartuStat('📐', rp(luasTotal) + ' m²', 'Luas Dikerjakan', '') + '</div>';

  html += '<div class="kartu"><div class="baris" style="margin-bottom:8px">' +
    '<h3 style="margin:0">📋 Buku Harian Kebun</h3>' +
    (bolehUbah() ? '<button class="tbl kecil kanan" onclick="formAktivitas()">+ Catat</button>'
      : '') + '</div>' +
    '<label class="ruas takCetak"><span class="nama">Saring petak</span>' +
    '<select onchange="S.filter.aktivitasPetak=this.value;render()">' + opsi + '</select></label>';

  if (!aktivitas.length) {
    html += '<div class="kosong"><span class="ik">📋</span>Belum ada catatan aktivitas. ' +
      'Catatan harian membantu menelusuri sebab-akibat ketika hasil panen naik atau turun.' +
      '</div>';
  } else {
    var tanggalTerakhir = '';
    for (var i = 0; i < aktivitas.length; i++) {
      var a = aktivitas[i];
      var tgl = String(a.waktu || '').substring(0, 10);
      if (tgl !== tanggalTerakhir) {
        tanggalTerakhir = tgl;
        html += '<div style="margin:12px 0 4px;font-size:.75rem;font-weight:800;' +
          'color:var(--redup);letter-spacing:.06em">' + tglIndo(tgl, true) + '</div>';
      }
      html += '<div class="item"><div class="ikon">' + ikonAktivitas(a.jenis) + '</div>' +
        '<div class="isi"><b>' + esc(a.judul || a.jenis) + '</b>' +
        (a._menunggu ? ' ⏳' : '') +
        '<small>' + esc(a.jenis || '-') + ' · ' + esc(namaPetak(a.petakId)) +
        (a.operator ? ' · oleh ' + esc(a.operator) : '') + '</small>' +
        (a.catatan ? '<small>' + esc(a.catatan) + '</small>' : '') +
        (a.fotoUrl ? '<img class="foto" src="' + esc(a.fotoUrl) +
          '" onclick="zoomFoto(this.src)" style="max-height:120px;margin-top:6px">' : '') +
        (bolehUbah() ? '<div class="baris takCetak" style="margin-top:5px">' +
          '<button class="tbl sekunder kecil" onclick="formAktivitas(\'' + jsq(a.id) +
          '\')">✏️</button>' +
          '<button class="tbl sekunder kecil" onclick="hapusUmum(\'aktivitas_hapus\',\'' +
          jsq(a.id) + '\',\'catatan aktivitas\')">🗑️</button></div>' : '') +
        '</div><div class="nilai">' +
        (angka(a.durasiMenit) ? '<small>' + angka(a.durasiMenit) + ' menit</small><br>' : '') +
        (angka(a.luasM2) ? '<small style="color:var(--redup)">' + rp(a.luasM2) +
          ' m²</small>' : '') + '</div></div>';
    }
  }
  return html + '</div>';
}

function ikonAktivitas(jenis) {
  var j = String(jenis || '').toLowerCase();
  if (j.indexOf('pupuk') >= 0) return '🧪';
  if (j.indexOf('siram') >= 0 || j.indexOf('air') >= 0) return '💧';
  if (j.indexOf('semprot') >= 0 || j.indexOf('pestisida') >= 0) return '🧴';
  if (j.indexOf('tanam') >= 0) return '🌱';
  if (j.indexOf('panen') >= 0) return '🌾';
  if (j.indexOf('gulma') >= 0 || j.indexOf('rumput') >= 0 || j.indexOf('siang') >= 0) return '🌿';
  if (j.indexOf('pangkas') >= 0) return '✂️';
  if (j.indexOf('olah') >= 0 || j.indexOf('bajak') >= 0) return '🚜';
  return '📋';
}

/* ============================================================
   TAB: SENSOR TANAH
   Ruas lembar Sensor: petakId, kode, status, baterai, sinyal,
   terakhirBaca, kelembapan, ph, ecUsCm, suhuC, nPpm, pPpm, kPpm,
   kalibrasi*
   ============================================================ */

function tabSensor() {
  var sub = subAktif('sensor', 'daftar');
  var html = pil('sensor', [
    { k: 'daftar', n: 'Sensor' },
    { k: 'bacaan', n: 'Riwayat Bacaan' },
    { k: 'kalibrasi', n: 'Kalibrasi pH' }
  ], 'daftar');
  if (sub === 'bacaan') html += bagianBacaan();
  else if (sub === 'kalibrasi') html += bagianKalibrasi();
  else html += bagianSensor();
  return html;
}

function bagianSensor() {
  var sensor = S.data.sensor || [];
  var html = '<div class="kartu"><div class="baris" style="margin-bottom:8px">' +
    '<h3 style="margin:0">📡 Sensor & Titik Ukur</h3>' +
    (bolehUbah() ? '<button class="tbl kecil kanan" onclick="formSensor()">+ Sensor</button>'
      : '') + '</div>';

  if (!sensor.length) {
    html += '<div class="kosong"><span class="ik">📡</span>Belum ada sensor terdaftar. ' +
      'Sensor bisa berupa alat digital maupun titik pengukuran manual yang Anda catat ' +
      'sendiri dengan alat pH genggam.</div>';
  } else {
    for (var i = 0; i < sensor.length; i++) {
      var s = sensor[i];
      var umurBacaan = s.terakhirBaca
        ? selisihHari(String(s.terakhirBaca).substring(0, 10), hariIni()) : null;
      var basi = umurBacaan !== null && umurBacaan > 7;
      html += '<div class="kartu rapat"><div class="baris" style="margin-bottom:8px">' +
        '<div><b>' + esc(s.kode || s.id) + '</b>' + (s._menunggu ? ' ⏳' : '') +
        '<br><small style="color:var(--redup)">' + esc(namaPetak(s.petakId)) +
        (angka(s.baterai) ? ' · 🔋 ' + angka(s.baterai) + '%' : '') +
        (angka(s.sinyal) ? ' · 📶 ' + angka(s.sinyal) + '%' : '') + '</small></div>' +
        '<span class="lencana ' + (basi ? 'kuning' : (umurBacaan === null ? 'abu' : 'hijau')) +
        ' kanan">' + (umurBacaan === null ? 'Belum ada bacaan'
          : (umurBacaan === 0 ? 'Terbaca hari ini' : umurBacaan + ' hari lalu')) +
        '</span></div>' +
        '<div class="kisi kisi4">' +
        petakUkur('💧', s.kelembapan, '%', 'Kelembapan', nilaiSehat('kelembapan', s.kelembapan)) +
        petakUkur('⚗️', s.ph, '', 'pH Tanah', nilaiSehat('ph', s.ph)) +
        petakUkur('🌡️', s.suhuC, '°C', 'Suhu', nilaiSehat('suhu', s.suhuC)) +
        petakUkur('⚡', s.ecUsCm, ' µS', 'EC', '') +
        '</div>' +
        ((s.nPpm || s.pPpm || s.kPpm) ? '<div class="kisi kisi3" style="margin-top:6px">' +
          petakUkur('N', s.nPpm, ' ppm', 'Nitrogen', '') +
          petakUkur('P', s.pPpm, ' ppm', 'Fosfor', '') +
          petakUkur('K', s.kPpm, ' ppm', 'Kalium', '') + '</div>' : '') +
        (s.kalibrasiTanggal
          ? '<small style="color:var(--redup);display:block;margin-top:6px">⚗️ Kalibrasi ' +
            'terakhir ' + tglIndo(s.kalibrasiTanggal, true) + ' · offset ' +
            angka(s.kalibrasiOffset) + ' · slope ' + angka(s.kalibrasiSlope) + '</small>'
          : '<small style="color:var(--peringatan);display:block;margin-top:6px">⚠️ Belum ' +
            'pernah dikalibrasi — bacaan pH belum dikoreksi.</small>') +
        (bolehUbah() ? '<div class="baris takCetak" style="margin-top:8px">' +
          '<button class="tbl kecil" onclick="formBacaan(\'' + jsq(s.id) +
          '\')">📥 Catat bacaan</button>' +
          '<button class="tbl sekunder kecil" onclick="formSensor(\'' + jsq(s.id) +
          '\')">✏️ Ubah</button>' +
          '<button class="tbl sekunder kecil" onclick="subPindah(\'sensor\',\'kalibrasi\')">' +
          '⚗️ Kalibrasi</button></div>' : '') +
        '</div>';
    }
  }
  return html + '</div>';
}

function petakUkur(ikon, nilai, satuan, label, status) {
  var warna = status === 'baik' ? 'var(--sukses)'
    : (status === 'waspada' ? 'var(--peringatan)' : (status === 'buruk' ? 'var(--bahaya)'
      : 'var(--tinta)'));
  var kosong = (nilai === '' || nilai === null || nilai === undefined);
  return '<div style="text-align:center;padding:8px 4px;background:var(--latar);' +
    'border-radius:10px"><div style="font-size:.9rem">' + ikon + '</div>' +
    '<div style="font-weight:800;font-size:1rem;color:' + warna + '">' +
    (kosong ? '-' : esc(nilai) + satuan) +
    '</div><small style="color:var(--redup);font-size:.62rem">' + esc(label) + '</small></div>';
}

function nilaiSehat(jenis, nilai) {
  var v = angka(nilai, NaN);
  if (isNaN(v) || nilai === '' || nilai === null) return '';
  if (jenis === 'ph') {
    if (v >= 6 && v <= 7) return 'baik';
    if (v >= 5.5 && v <= 7.5) return 'waspada';
    return 'buruk';
  }
  if (jenis === 'kelembapan') {
    if (v >= 60 && v <= 80) return 'baik';
    if (v >= 40 && v <= 90) return 'waspada';
    return 'buruk';
  }
  if (jenis === 'suhu') {
    if (v >= 24 && v <= 32) return 'baik';
    if (v >= 18 && v <= 36) return 'waspada';
    return 'buruk';
  }
  return '';
}

function bagianBacaan() {
  var bacaan = (S.data.sensorBacaan || []).slice().sort(function (a, b) {
    return String(b.waktu) < String(a.waktu) ? -1 : 1;
  });
  var html = '<div class="kartu"><h3>Riwayat Bacaan (' + bacaan.length + ')</h3>' +
    '<p style="font-size:.8rem;color:var(--redup)">Nilai pH yang ditampilkan sudah ' +
    'dikoreksi dengan hasil kalibrasi terakhir alat.</p>';
  if (!bacaan.length) {
    html += '<div class="kosong"><span class="ik">📥</span>Belum ada bacaan tercatat.</div>';
  } else {
    html += '<div class="gulir"><table><thead><tr><th>Waktu</th><th>Sensor</th>' +
      '<th class="angka">Lembap</th><th class="angka">pH</th><th class="angka">Suhu</th>' +
      '<th class="angka">EC</th><th>Sumber</th></tr></thead><tbody>';
    for (var i = 0; i < Math.min(bacaan.length, 200); i++) {
      var b = bacaan[i];
      var sn = null;
      (S.data.sensor || []).forEach(function (x) { if (x.id === b.sensorId) sn = x; });
      html += '<tr><td>' + esc(String(b.waktu || '').replace('T', ' ').substring(0, 16)) + '</td>' +
        '<td>' + esc(sn ? (sn.kode || sn.id) : b.sensorId) + '</td>' +
        '<td class="angka">' + (b.kelembapan === '' ? '-' : esc(b.kelembapan)) + '</td>' +
        '<td class="angka">' + (b.ph === '' ? '-' : esc(b.ph)) + '</td>' +
        '<td class="angka">' + (b.suhuC === '' ? '-' : esc(b.suhuC)) + '</td>' +
        '<td class="angka">' + (b.ecUsCm === '' ? '-' : esc(b.ecUsCm)) + '</td>' +
        '<td><small>' + esc(b.sumber || 'manual') + '</small></td></tr>';
    }
    html += '</tbody></table></div>';
  }
  return html + '</div>';
}

function bagianKalibrasi() {
  var opsi = (S.data.sensor || []).map(function (s) {
    return '<option value="' + esc(s.id) + '">' + esc(s.kode || s.id) + ' — ' +
      esc(namaPetak(s.petakId)) + '</option>';
  }).join('');

  return '<div class="kartu"><h3>⚗️ Kalibrasi Dua Titik pH</h3>' +
    '<p style="font-size:.82rem;color:var(--redup)">Elektroda pH melenceng setelah beberapa ' +
    'minggu terpapar tanah dan pupuk. Kalibrasi dua titik memakai larutan buffer pH 7,00 dan ' +
    'pH 4,01 untuk menghitung offset dan slope, sehingga bacaan berikutnya dikoreksi ' +
    'otomatis oleh aplikasi.</p>' +
    (!opsi ? '<div class="kosong"><span class="ik">📡</span>Daftarkan sensor terlebih ' +
      'dahulu di sub-tab Sensor.</div>' :
      '<label class="ruas"><span class="nama">Sensor</span>' +
      '<select id="kalSensor">' + opsi + '</select></label>' +
      '<div class="kisi kisi2">' +
      '<label class="ruas"><span class="nama">Bacaan pada buffer pH 7,00</span>' +
      '<input type="number" id="kalBaca7" step="0.01" inputmode="decimal" placeholder="6.82">' +
      '<span class="bantu">Celupkan probe ke buffer 7,00, tunggu angka stabil ±30 detik.</span>' +
      '</label>' +
      '<label class="ruas"><span class="nama">Bacaan pada buffer pH 4,01</span>' +
      '<input type="number" id="kalBaca4" step="0.01" inputmode="decimal" placeholder="3.95">' +
      '<span class="bantu">Bilas probe dengan air suling sebelum pindah larutan.</span>' +
      '</label></div>' +
      '<button class="tbl lebar" onclick="kirimKalibrasi()">Hitung & simpan kalibrasi</button>' +
      '<div id="hasilKalibrasi" style="margin-top:10px"></div>') +
    '<hr class="pisah"><h4>Langkah di lapangan</h4>' +
    '<ol style="font-size:.84rem;padding-left:18px;margin:0;line-height:1.7">' +
    '<li>Bersihkan probe dengan air suling, keringkan dengan tisu tanpa menggosok membran.</li>' +
    '<li>Celupkan ke buffer pH 7,00. Tunggu hingga angka tidak berubah selama 30 detik.</li>' +
    '<li>Catat angka yang <b>terbaca</b> — bukan angka 7,00.</li>' +
    '<li>Bilas ulang, lalu celupkan ke buffer pH 4,01 dan catat bacaannya.</li>' +
    '<li>Masukkan kedua angka di atas dan simpan.</li>' +
    '<li>Ulangi setiap 2-4 minggu, atau setelah probe terkena pupuk pekat.</li>' +
    '</ol></div>';
}

function kirimKalibrasi() {
  var sensorId = ($('kalSensor') || {}).value;
  var b7 = angka(($('kalBaca7') || {}).value, NaN);
  var b4 = angka(($('kalBaca4') || {}).value, NaN);
  var wadah = $('hasilKalibrasi');
  if (isNaN(b7) || isNaN(b4)) { toast('Isi kedua bacaan buffer.', 'galat'); return; }
  if (!S.daring) { toast('Kalibrasi memerlukan sambungan internet.', 'galat'); return; }

  wadah.innerHTML = '<div class="spanduk biru"><span class="muat"></span>' +
    '<span>Menghitung…</span></div>';

  panggil('sensor_kalibrasi', { sensorId: sensorId, bacaanPh7: b7, bacaanPh4: b4 })
    .then(function (r) {
      wadah.innerHTML = '<div class="kartu" style="background:var(--latar);margin:0">' +
        '<div class="kisi kisi2">' +
        barisInfo('Offset', r.offset) + barisInfo('Slope', r.slope) + '</div>' +
        '<div class="spanduk ' + (r.sehat ? 'hijau' : 'kuning') + '"><span>' +
        (r.sehat ? '✅' : '⚠️') + '</span><span>' + esc(r.pesan) + '</span></div></div>';
      muatData(true);
    })
    .catch(function (e) {
      wadah.innerHTML = '<div class="spanduk merah"><span>⚠️</span><span>' +
        esc(e.message) + '</span></div>';
    });
}

/* ============================================================
   TAB: STOK / INVENTARIS
   Ruas lembar Inventaris: nama, kategori, stok, satuan, hargaSatuan,
   pemakaianHarian, titikPesanUlang, catatan
   ============================================================ */

function tabStok() {
  var item = S.data.inventaris || [];
  var kritis = item.filter(function (i) {
    return angka(i.titikPesanUlang) > 0 && angka(i.stok) <= angka(i.titikPesanUlang);
  });
  var nilaiTotal = 0;
  item.forEach(function (i) { nilaiTotal += angka(i.stok) * angka(i.hargaSatuan); });

  var html = '<div class="kisi kisi3" style="margin-bottom:12px">' +
    kartuStat('📦', item.length, 'Jenis Barang', '') +
    kartuStat('⚠️', kritis.length, 'Perlu Dipesan', kritis.length ? 'Di bawah titik pesan'
      : 'Semua aman') +
    kartuStat('💰', 'Rp ' + rpSingkat(nilaiTotal), 'Nilai Persediaan', '') + '</div>';

  if (kritis.length) {
    html += '<div class="spanduk kuning"><span>⚠️</span><span><b>' + kritis.length +
      ' barang mencapai titik pesan ulang</b>' +
      kritis.map(function (k) { return esc(k.nama); }).join(', ') + '</span></div>';
  }

  html += '<div class="kartu"><div class="baris" style="margin-bottom:8px">' +
    '<h3 style="margin:0">📦 Persediaan Sarana Produksi</h3>' +
    '<button class="tbl sekunder kecil takCetak" onclick="laporanStok()">📈 Prediksi habis' +
    '</button>' +
    (bolehUbah() ? '<button class="tbl kecil" onclick="formItem()">+ Barang</button>' : '') +
    '</div>';

  if (!item.length) {
    html += '<div class="kosong"><span class="ik">📦</span>Belum ada barang tercatat.</div>';
  } else {
    var urut = item.slice().sort(function (a, b) {
      var ka = (angka(a.titikPesanUlang) > 0 && angka(a.stok) <= angka(a.titikPesanUlang))
        ? 0 : 1;
      var kb = (angka(b.titikPesanUlang) > 0 && angka(b.stok) <= angka(b.titikPesanUlang))
        ? 0 : 1;
      if (ka !== kb) return ka - kb;
      return String(a.nama) < String(b.nama) ? -1 : 1;
    });
    for (var i = 0; i < urut.length; i++) {
      var it = urut[i];
      var titik = angka(it.titikPesanUlang);
      var rendah = titik > 0 && angka(it.stok) <= titik;
      var persen = titik > 0
        ? Math.min(100, Math.round(angka(it.stok) / (titik * 3) * 100)) : 100;
      html += '<div class="item"><div class="ikon">' + (rendah ? '⚠️' : '📦') + '</div>' +
        '<div class="isi"><b>' + esc(it.nama) + '</b>' + (it._menunggu ? ' ⏳' : '') +
        '<small>' + esc(it.kategori || '-') +
        (it.catatan ? ' · ' + esc(it.catatan) : '') + '</small>' +
        '<div class="batang" style="margin-top:5px"><i style="width:' + persen + '%;' +
        (rendah ? 'background:var(--bahaya)' : '') + '"></i></div>' +
        '<small>Titik pesan ulang ' + titik + ' ' + esc(it.satuan) +
        ' · Rp ' + rp(it.hargaSatuan) + '/' + esc(it.satuan) +
        (angka(it.pemakaianHarian) ? ' · perkiraan pakai ' + angka(it.pemakaianHarian) +
          '/hari' : '') + '</small>' +
        (bolehUbah() ? '<div class="baris takCetak" style="margin-top:6px">' +
          '<button class="tbl kecil" onclick="formMutasi(\'' + jsq(it.id) +
          '\',\'masuk\')">+ Masuk</button>' +
          '<button class="tbl sekunder kecil" onclick="formMutasi(\'' + jsq(it.id) +
          '\',\'keluar\')">− Keluar</button>' +
          '<button class="tbl sekunder kecil" onclick="formItem(\'' + jsq(it.id) +
          '\')">✏️</button>' +
          (bolehKelola() ? '<button class="tbl sekunder kecil" onclick="hapusUmum(' +
            '\'item_hapus\',\'' + jsq(it.id) + '\',\'barang persediaan\')">🗑️</button>' : '') +
          '</div>' : '') +
        '</div><div class="nilai"><b style="font-size:1.05rem;color:' +
        (rendah ? 'var(--bahaya)' : 'var(--tinta)') + '">' + angka(it.stok) + '</b><br>' +
        '<small style="color:var(--redup)">' + esc(it.satuan) + '</small></div></div>';
    }
  }
  html += '</div>';

  /* Riwayat mutasi */
  var mutasi = (S.data.mutasi || []).slice().sort(function (a, b) {
    return String(b.tanggal) < String(a.tanggal) ? -1 : 1;
  });
  if (mutasi.length) {
    html += '<div class="kartu"><h3>Riwayat keluar-masuk</h3>' +
      '<div class="gulir"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Jenis</th>' +
      '<th class="angka">Jumlah</th><th>Keterangan</th></tr></thead><tbody>';
    for (var m = 0; m < Math.min(mutasi.length, 60); m++) {
      var mu = mutasi[m];
      var brg = itemById(mu.itemId);
      var masuk = angka(mu.jumlah) >= 0;
      html += '<tr><td>' + tglIndo(mu.tanggal) + '</td>' +
        '<td>' + esc(brg ? brg.nama : mu.itemId) + '</td>' +
        '<td><span class="lencana ' + (masuk ? 'hijau' : 'kuning') + '">' +
        esc(mu.jenis || (masuk ? 'masuk' : 'keluar')) + '</span></td>' +
        '<td class="angka">' + (masuk ? '+' : '') + angka(mu.jumlah) + '</td>' +
        '<td><small>' + esc(mu.keterangan || '') + '</small></td></tr>';
    }
    html += '</tbody></table></div></div>';
  }
  return html;
}

function laporanStok() {
  if (!S.daring) { toast('Prediksi memerlukan sambungan internet.', 'galat'); return; }
  panggil('stok_prediksi', {}).then(function (r) {
    var daftar = r.item || [];
    if (!daftar.length) { toast('Belum ada barang untuk diprediksi.', 'galat'); return; }
    var ring = r.ringkasan || {};
    var html = '<div class="kisi kisi3">' +
      kartuStat('🔴', angka(ring.kritis), 'Kritis', '') +
      kartuStat('🟡', angka(ring.waspada), 'Waspada', '') +
      kartuStat('🟢', angka(ring.aman), 'Aman', '') + '</div>' +
      '<div class="spanduk biru"><span>🛒</span><span><b>Perkiraan belanja 30 hari: Rp ' +
      rp(ring.totalPerkiraanBelanja30Hari) + '</b>Angka ini menjumlahkan kekurangan setiap ' +
      'barang dikalikan harga satuannya.</span></div>';

    for (var i = 0; i < daftar.length; i++) {
      var it = daftar[i];
      var w = it.tingkat === 'kritis' ? 'merah' : (it.tingkat === 'waspada' ? 'kuning' : 'hijau');
      html += '<div class="item"><div class="ikon">' +
        (it.tingkat === 'kritis' ? '🔴' : (it.tingkat === 'waspada' ? '🟡' : '🟢')) + '</div>' +
        '<div class="isi"><b>' + esc(it.nama) + '</b>' +
        '<small>Stok ' + it.stok + ' ' + esc(it.satuan) + ' · pakai ' + it.pemakaianHarian +
        ' ' + esc(it.satuan) + '/hari</small>' +
        '<small>' + (it.terukur ? '✔️ ' : '⚠️ ') + esc(it.alasan) + '</small>' +
        (it.saranPesan > 0 ? '<small>Saran pesan <b>' + it.saranPesan + ' ' +
          esc(it.satuan) + '</b> (± Rp ' + rp(it.perkiraanBiaya) + ')</small>' : '') +
        '</div><div class="nilai"><span class="lencana ' + w + '">' +
        (it.sisaHari >= 999 ? 'Tak terhitung' : it.sisaHari + ' hari') + '</span></div></div>';
    }
    modalBuka('Prediksi kebutuhan stok', html);
  }).catch(function (e) { toast(e.message, 'galat'); });
}

/* ============================================================
   TAB: CUACA
   Ruas lembar Cuaca: tanggal, lokasi, suhuMin, suhuMax, kondisi,
   curahHujanMm, kelembapan, anginKmh, peluangHujan, sumber
   ============================================================ */

function tabCuaca() {
  var cuaca = S.data.cuaca || [];
  var html = '<div class="kartu"><div class="baris" style="margin-bottom:8px">' +
    '<h3 style="margin:0">🌦️ Prakiraan Cuaca</h3>' +
    '<button class="tbl kecil kanan takCetak" onclick="ambilCuaca()">🔄 Perbarui</button>' +
    '</div>';

  var hariNi = hariIni();
  var urut = cuaca.slice().sort(function (a, b) {
    return String(a.tanggal) < String(b.tanggal) ? -1 : 1;
  }).filter(function (c) { return String(c.tanggal) >= hariNi; });

  if (!urut.length) {
    html += '<div class="kosong"><span class="ik">🌤️</span>Belum ada prakiraan tersimpan. ' +
      'Tekan Perbarui untuk mengambil ramalan 7 hari dari Open-Meteo.</div>';
  } else {
    html += '<div class="kisi kisi4">';
    for (var i = 0; i < Math.min(urut.length, 8); i++) {
      var c = urut[i];
      html += '<div style="text-align:center;padding:10px 6px;background:var(--latar);' +
        'border-radius:12px">' +
        '<small style="color:var(--redup);font-weight:700">' +
        (String(c.tanggal) === hariNi ? 'Hari ini' : tglIndo(c.tanggal)) + '</small>' +
        '<div style="font-size:1.6rem;line-height:1.3">' + ikonCuaca(c.kondisi) + '</div>' +
        '<div style="font-weight:800">' + angka(c.suhuMax) + '° / ' +
        angka(c.suhuMin) + '°</div>' +
        '<small style="color:var(--redup);font-size:.66rem">' + esc(c.kondisi || '') +
        '</small><br>' +
        '<small style="font-size:.66rem">💧 ' + angka(c.curahHujanMm) + ' mm · ' +
        angka(c.peluangHujan) + '%</small>' +
        '</div>';
    }
    html += '</div>';

    /* Saran pemupukan — dihitung ulang di klien dengan kaidah yang sama
       seperti saranPemupukanCuaca() di peladen, supaya tetap tampil luring. */
    html += '<hr class="pisah"><h4>Saran waktu pemupukan</h4>';
    for (var j = 0; j < Math.min(urut.length, 5); j++) {
      var s = saranPupukLokal(urut[j]);
      var w = s.status === 'tunda' ? 'merah' : (s.status === 'hati-hati' ? 'kuning' : 'hijau');
      html += '<div class="item"><div class="ikon">' + ikonCuaca(urut[j].kondisi) + '</div>' +
        '<div class="isi"><b>' + tglIndo(urut[j].tanggal, true) + '</b>' +
        '<small>' + esc(s.saran) + '</small></div>' +
        '<div class="nilai"><span class="lencana ' + w + '">' + esc(s.status) +
        '</span></div></div>';
    }

    /* Peringatan cuaca ekstrem */
    var ekstrem = urut.filter(function (c) {
      return angka(c.curahHujanMm) > 50 || angka(c.anginKmh) > 40 || angka(c.suhuMax) > 37;
    });
    if (ekstrem.length) {
      html += '<div class="spanduk merah"><span>⛈️</span><span><b>Cuaca ekstrem terdeteksi' +
        '</b>' + ekstrem.map(function (e) {
          return tglIndo(e.tanggal) + ' (' +
            (angka(e.curahHujanMm) > 50 ? 'hujan ' + angka(e.curahHujanMm) + ' mm'
              : (angka(e.anginKmh) > 40 ? 'angin ' + angka(e.anginKmh) + ' km/j'
                : 'suhu ' + angka(e.suhuMax) + '°')) + ')';
        }).join(', ') +
        '. Amankan mulsa, tegakkan ajir, perbaiki drainase, dan tunda penyemprotan.</span></div>';
      if (bolehKelola()) {
        html += '<button class="tbl sekunder lebar takCetak" onclick="siapkanPeringatanWa()">' +
          '💬 Siapkan pesan peringatan untuk anggota</button>';
      }
    }
  }
  html += '<div class="spanduk biru"><span>ℹ️</span><span>Data cuaca dari <b>Open-Meteo</b> ' +
    '(lisensi CC-BY 4.0, gratis dan boleh dipakai komersial). Titik acuan diambil dari ' +
    'koordinat petak pertama, atau dari koordinat yang diisi di Setelan ▸ Umum.</span></div>';
  return html + '</div>';
}

function saranPupukLokal(c) {
  var hujan = angka(c.curahHujanMm);
  var peluang = angka(c.peluangHujan);
  if (hujan >= 20 || peluang >= 80 || String(c.kondisi).indexOf('Badai') >= 0) {
    return { status: 'tunda',
      saran: 'Tunda pemupukan. Curah hujan ' + hujan + ' mm berpotensi mencuci pupuk ' +
        'sebelum sempat terserap akar.' };
  }
  if (hujan >= 5 || peluang >= 50) {
    return { status: 'hati-hati',
      saran: 'Boleh memupuk pagi hari, tetapi pilih cara yang segera terbenam ' +
        '(tugal atau larikan lalu tutup tanah). Hindari tabur di permukaan.' };
  }
  if (angka(c.suhuMax) >= 34) {
    return { status: 'hati-hati',
      saran: 'Suhu ' + angka(c.suhuMax) + '°C terlalu terik. Pupuk sebelum jam 8 pagi ' +
        'atau sesudah jam 15.30, lalu siram.' };
  }
  return { status: 'aman',
    saran: 'Kondisi baik untuk pemupukan. Tanah lembab tanpa risiko pencucian.' };
}

function ikonCuaca(kondisi) {
  var k = String(kondisi || '').toLowerCase();
  if (k.indexOf('badai') >= 0) return '⛈️';
  if (k.indexOf('deras') >= 0 || k.indexOf('lebat') >= 0) return '🌧️';
  if (k.indexOf('hujan') >= 0) return '🌧️';
  if (k.indexOf('gerimis') >= 0) return '🌦️';
  if (k.indexOf('kabut') >= 0) return '🌫️';
  if (k.indexOf('berawan sebagian') >= 0 || k.indexOf('cerah berawan') >= 0) return '🌤️';
  if (k.indexOf('berawan') >= 0) return '☁️';
  if (k.indexOf('cerah') >= 0) return '☀️';
  return '🌤️';
}

function ambilCuaca() {
  if (!S.daring) { toast('Perbarui cuaca memerlukan sambungan internet.', 'galat'); return; }
  toast('Mengambil prakiraan…');
  var d = {};
  if (S.pengaturan.lat && S.pengaturan.lon) {
    d.lat = angka(S.pengaturan.lat); d.lng = angka(S.pengaturan.lon);
  }
  panggil('cuaca_ambil', d).then(function () {
    return muatData();
  }).then(function () {
    toast('Prakiraan cuaca diperbarui.', 'sukses');
  }).catch(function (e) { toast(e.message, 'galat'); });
}

function siapkanPeringatanWa() {
  var hariNi = hariIni();
  var cuaca = (S.data.cuaca || []).filter(function (c) {
    return String(c.tanggal) >= hariNi &&
      (angka(c.curahHujanMm) > 50 || angka(c.anginKmh) > 40 || angka(c.suhuMax) > 37);
  });
  if (!cuaca.length) return;
  var pesan = '*[' + (S.pengaturan.namaAplikasi || 'TaniPintar') +
    ' — Peringatan Cuaca]*\n\nBapak/Ibu anggota kelompok tani,\n\n' +
    'Prakiraan cuaca menunjukkan kondisi ekstrem pada:\n';
  cuaca.forEach(function (c) {
    pesan += '• ' + tglIndo(c.tanggal, true) + ' — ' + (c.kondisi || '') +
      ', hujan ' + angka(c.curahHujanMm) + ' mm, angin ' + angka(c.anginKmh) + ' km/j\n';
  });
  pesan += '\nMohon: amankan mulsa dan ajir, perbaiki saluran drainase, ' +
    'tunda penyemprotan dan pemupukan, serta panen lebih awal bila buah sudah masak.\n\n' +
    'Salam,\n' + (S.pengguna ? S.pengguna.nama : '');

  modalBuka('Pesan peringatan cuaca',
    '<p style="font-size:.83rem;color:var(--redup)">Salin pesan ini lalu kirim ke grup ' +
    'WhatsApp kelompok tani.</p>' +
    '<textarea rows="12" id="pesanCuaca" onclick="this.select()">' + esc(pesan) + '</textarea>' +
    '<button class="tbl lebar" onclick="salinTeks(\'pesanCuaca\')">📋 Salin pesan</button>');
}

function salinTeks(idElemen) {
  var el = $(idElemen);
  if (!el) return;
  el.focus();
  el.select();
  try {
    document.execCommand('copy');
    toast('Disalin ke papan klip.', 'sukses');
  } catch (e) {
    toast('Salin manual: tekan dan tahan pada teks.', 'galat');
  }
}

   TAB: TANIBOT (asisten AI)
   ============================================================ */

var _chatRiwayat = [];

function tabTaniBot() {
  var html = '<div class="kartu"><div class="baris" style="margin-bottom:8px">' +
    '<h3 style="margin:0">🤖 TaniBot</h3>' +
    '<button class="tbl sekunder kecil kanan" onclick="hapusRiwayatChat()">Bersihkan</button>' +
    '</div>' +
    '<p style="font-size:.82rem;color:var(--redup)">TaniBot mengetahui isi kebun Anda — ' +
    'petak, komoditas, jadwal pupuk, dan riwayat panen — sehingga jawabannya menyesuaikan ' +
    'kondisi nyata di lapangan.</p>' +
    '<div id="chatKotak" class="chat">' + gambarChat() + '</div>' +
    '<div class="baris takCetak" style="margin-top:8px">' +
    '<input type="text" id="chatMasuk" placeholder="Tanyakan apa saja tentang kebun Anda…" ' +
    'onkeydown="if(event.key===\'Enter\')kirimChat()" style="flex:1">' +
    '<button class="tbl" onclick="kirimChat()" id="chatKirim">Kirim</button></div>' +
    '<div class="baris takCetak" style="margin-top:8px;flex-wrap:wrap">' +
    saranChat('Kapan waktu terbaik memupuk petak saya?') +
    saranChat('Petak mana yang paling menguntungkan?') +
    saranChat('Bagaimana cara mengatasi daun menguning?') +
    saranChat('Apa yang sebaiknya saya tanam setelah panen ini?') +
    '</div></div>';

  if (!S.daring) {
    html += '<div class="spanduk kuning"><span>📴</span><span><b>Sedang luring</b>' +
      'TaniBot membutuhkan sambungan internet. Riwayat percakapan tetap tersimpan.</span></div>';
  }
  return html;
}

function saranChat(teks) {
  return '<button class="tbl sekunder kecil" onclick="isiChat(' + jsAtr(teks) + ')">' +
    esc(teks) + '</button>';
}

function jsAtr(s) {
  return "'" + jsq(s) + "'";
}

function isiChat(teks) {
  var el = $('chatMasuk');
  if (el) { el.value = teks; kirimChat(); }
}

function gambarChat() {
  if (!_chatRiwayat.length) {
    return '<div class="kosong"><span class="ik">🤖</span>Selamat datang. Tanyakan apa saja ' +
      'seputar budidaya, hama, pemupukan, atau kondisi kebun Anda.</div>';
  }
  var html = '';
  for (var i = 0; i < _chatRiwayat.length; i++) {
    var p = _chatRiwayat[i];
    html += '<div class="gel ' + (p.peran === 'pengguna' ? 'saya' : 'bot') + '">' +
      esc(p.teks).replace(/\n/g, '<br>') + '</div>';
  }
  return html;
}

function gulirChatKeBawah() {
  var k = $('chatKotak');
  if (k) k.scrollTop = k.scrollHeight;
}

function kirimChat() {
  var el = $('chatMasuk');
  if (!el) return;
  var teks = String(el.value || '').trim();
  if (!teks) return;
  if (!S.daring) { toast('TaniBot memerlukan sambungan internet.', 'galat'); return; }

  _chatRiwayat.push({ peran: 'pengguna', teks: teks });
  el.value = '';
  var kotak = $('chatKotak');
  kotak.innerHTML = gambarChat() +
    '<div class="gel bot" id="chatTunggu"><span class="muat"></span> Mengetik…</div>';
  gulirChatKeBawah();
  var tblKirim = $('chatKirim');
  if (tblKirim) tblKirim.disabled = true;

  var riwayatKirim = _chatRiwayat.slice(-10).map(function (p) {
    return { peran: p.peran, teks: p.teks };
  });

  panggil('ai_chat', { pesan: teks, riwayat: riwayatKirim })
    .then(function (r) {
      _chatRiwayat.push({ peran: 'bot', teks: r.balasan });
      simpanLokal(LS.chat, _chatRiwayat.slice(-40));
    })
    .catch(function (e) {
      _chatRiwayat.push({ peran: 'bot', teks: '⚠️ ' + e.message });
    })
    .then(function () {
      var k = $('chatKotak');
      if (k) { k.innerHTML = gambarChat(); gulirChatKeBawah(); }
      var t = $('chatKirim');
      if (t) t.disabled = false;
    });
}

function hapusRiwayatChat() {
  konfirmasi('Bersihkan percakapan?', 'Seluruh riwayat obrolan dengan TaniBot akan dihapus ' +
    'dari perangkat ini.', function () {
      _chatRiwayat = [];
      simpanLokal(LS.chat, []);
      render();
    }, 'Bersihkan', true);
}

   TAB: EDUKASI
   ============================================================ */

function tabEdukasi() {
  var modul = S.data.edukasi || [];
  var kategori = {};
  modul.forEach(function (m) {
    var k = m.kategori || 'Umum';
    if (!kategori[k]) kategori[k] = [];
    kategori[k].push(m);
  });

  var html = '<div class="kartu"><div class="baris" style="margin-bottom:8px">' +
    '<h3 style="margin:0">\ud83d\udcda Pusat Belajar</h3>' +
    (bolehKelola() ? '<button class="tbl kecil kanan" onclick="formEdukasi()">+ Modul</button>'
      : '') + '</div>' +
    '<p style="font-size:.82rem;color:var(--redup)">Modul bertanda \ud83d\udcf4 tersimpan di ' +
    'perangkat dan tetap terbuka tanpa sinyal \u2014 berguna saat berada di kebun.</p>';

  if (!modul.length) {
    html += '<div class="kosong"><span class="ik">\ud83d\udcda</span>Belum ada modul edukasi.</div>';
  } else {
    for (var k in kategori) {
      html += '<div style="margin:12px 0 6px;font-size:.75rem;font-weight:800;' +
        'color:var(--redup);letter-spacing:.06em">' + esc(k) + '</div>';
      for (var i = 0; i < kategori[k].length; i++) {
        var m = kategori[k][i];
        var luring = (m.luring === true || m.luring === 'TRUE' || m.luring === 'true');
        html += '<div class="item" style="cursor:pointer" onclick="bukaModul(\'' +
          jsq(m.id) + '\')"><div class="ikon">\ud83d\udcd6</div>' +
          '<div class="isi"><b>' + esc(m.judul) + '</b>' +
          '<small>' + esc(String(m.ringkasan || '').substring(0, 110)) + '</small>' +
          '<small>' + (angka(m.menitBaca) ? '\u23f1\ufe0f ' + angka(m.menitBaca) +
            ' menit baca' : '') +
          (m.lencana ? ' \u00b7 ' + esc(m.lencana) : '') +
          (luring ? ' \u00b7 \ud83d\udcf4 tersedia luring' : '') + '</small></div>' +
          '<div class="nilai">\u203a</div></div>';
      }
    }
  }
  return html + '</div>';
}

function bukaModul(id) {
  var m = null;
  (S.data.edukasi || []).forEach(function (x) { if (x.id === id) m = x; });
  if (!m) return;

  var html = '';
  if (m.ringkasan) html += '<p style="font-size:.88rem">' + esc(m.ringkasan) + '</p>';

  var langkah = m.langkah || [];
  if (typeof langkah === 'string') langkah = [langkah];
  if (langkah.length) {
    html += '<hr class="pisah"><h4>Langkah pelaksanaan</h4><ol style="font-size:.86rem;' +
      'padding-left:18px;line-height:1.75;margin:0">';
    for (var i = 0; i < langkah.length; i++) html += '<li>' + esc(langkah[i]) + '</li>';
    html += '</ol>';
  }

  var manfaat = m.manfaat || [];
  if (typeof manfaat === 'string') manfaat = [manfaat];
  if (manfaat.length) {
    html += '<hr class="pisah"><h4>Manfaat</h4><ul style="font-size:.86rem;padding-left:18px;' +
      'line-height:1.75;margin:0">';
    for (var j = 0; j < manfaat.length; j++) html += '<li>' + esc(manfaat[j]) + '</li>';
    html += '</ul>';
  }

  if (bolehKelola()) {
    html += '<hr class="pisah"><div class="tumpuk">' +
      '<button class="tbl sekunder lebar" onclick="formEdukasi(\'' + jsq(id) +
      '\')">\u270f\ufe0f Ubah modul</button>' +
      '<button class="tbl bahaya lebar" onclick="hapusUmum(\'edukasi_hapus\',\'' +
      jsq(id) + '\',\'modul edukasi\')">\ud83d\uddd1\ufe0f Hapus</button></div>';
  }
  modalBuka('\ud83d\udcd6 ' + m.judul, html);
}

/* ============================================================
   TAB: ANALISIS
   ============================================================ */

function tabAnalisis() {
  var sub = subAktif('analisis', 'historis');
  var html = pil('analisis', [
    { k: 'historis', n: 'Tren Historis' },
    { k: 'harga', n: 'Harga Pasar' },
    { k: 'rotasi', n: 'Saran Rotasi' }
  ], 'historis');
  if (sub === 'harga') html += bagianHarga();
  else if (sub === 'rotasi') html += bagianRotasi();
  else html += bagianHistoris();
  return html;
}

function bagianHistoris() {
  var panen = S.data.panen || [];
  if (!panen.length) {
    return '<div class="kartu"><div class="kosong"><span class="ik">📊</span>' +
      'Belum ada catatan panen untuk dianalisis. Analisis tren mulai berguna setelah ' +
      'minimal 3-4 musim tercatat.</div></div>';
  }

  /* Agregasi per bulan */
  var perBulan = {};
  panen.forEach(function (p) {
    var bln = String(p.tanggal || '').substring(0, 7);
    if (!bln) return;
    if (!perBulan[bln]) perBulan[bln] = { kg: 0, rp: 0, n: 0 };
    perBulan[bln].kg += angka(p.jumlahKg);
    perBulan[bln].rp += angka(p.totalPendapatan);
    perBulan[bln].n++;
  });
  var bulan = [];
  for (var b in perBulan) bulan.push({ bln: b, d: perBulan[b] });
  bulan.sort(function (x, y) { return x.bln < y.bln ? -1 : 1; });
  var maksKg = 1;
  bulan.forEach(function (x) { if (x.d.kg > maksKg) maksKg = x.d.kg; });

  /* Agregasi per komoditas */
  var perKom = {};
  panen.forEach(function (p) {
    var k = p.komoditas || '(tidak dicatat)';
    if (!perKom[k]) perKom[k] = { kg: 0, rp: 0, n: 0 };
    perKom[k].kg += angka(p.jumlahKg);
    perKom[k].rp += angka(p.totalPendapatan);
    perKom[k].n++;
  });
  var komoditas = [];
  for (var c in perKom) {
    komoditas.push({ nama: c, kg: perKom[c].kg, rp: perKom[c].rp, n: perKom[c].n,
                     rerata: perKom[c].kg > 0 ? Math.round(perKom[c].rp / perKom[c].kg) : 0 });
  }
  komoditas.sort(function (x, y) { return y.rp - x.rp; });

  var html = '<div class="kartu"><h3>Produksi per bulan</h3>';
  for (var i = 0; i < bulan.length; i++) {
    var x = bulan[i];
    html += '<div style="margin-bottom:8px"><div class="baris" style="font-size:.8rem">' +
      '<span>' + esc(namaBulan(x.bln)) + '</span>' +
      '<b class="kanan">' + rp(x.d.kg) + ' kg · Rp ' + rpSingkat(x.d.rp) + '</b></div>' +
      '<div class="batang"><i style="width:' + Math.round(x.d.kg / maksKg * 100) +
      '%"></i></div></div>';
  }
  html += '</div>';

  html += '<div class="kartu"><h3>Perbandingan komoditas</h3>' +
    '<div class="gulir"><table><thead><tr><th>Komoditas</th><th class="angka">Transaksi</th>' +
    '<th class="angka">Total kg</th><th class="angka">Pendapatan</th>' +
    '<th class="angka">Harga rerata</th></tr></thead><tbody>';
  for (var j = 0; j < komoditas.length; j++) {
    var k = komoditas[j];
    html += '<tr><td><b>' + esc(k.nama) + '</b></td>' +
      '<td class="angka">' + k.n + '</td>' +
      '<td class="angka">' + rp(k.kg) + '</td>' +
      '<td class="angka">' + rp(k.rp) + '</td>' +
      '<td class="angka">' + rp(k.rerata) + '</td></tr>';
  }
  html += '</tbody></table></div></div>';

  /* Musim terbaik */
  if (bulan.length >= 4) {
    var terbaik = bulan.slice().sort(function (x, y) { return y.d.rp - x.d.rp; })[0];
    html += '<div class="spanduk hijau"><span>📈</span><span><b>Bulan paling produktif: ' +
      esc(namaBulan(terbaik.bln)) + '</b>Rp ' + rp(terbaik.d.rp) + ' dari ' +
      rp(terbaik.d.kg) + ' kg. Pola ini berguna untuk mengatur jadwal tanam musim berikutnya, ' +
      'tapi ingat harga pasar juga dipengaruhi pasokan daerah lain.</span></div>';
  }
  return html;
}

function namaBulan(ym) {
  var n = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus',
    'September', 'Oktober', 'November', 'Desember'];
  var b = String(ym).split('-');
  if (b.length < 2) return ym;
  return (n[Number(b[1]) - 1] || b[1]) + ' ' + b[0];
}

function bagianHarga() {
  var harga = (S.data.harga || []).slice().sort(function (a, b) {
    return String(b.tanggal) < String(a.tanggal) ? -1 : 1;
  });
  var html = '<div class="kartu"><div class="baris" style="margin-bottom:8px">' +
    '<h3 style="margin:0">💹 Harga Pasar</h3>' +
    (bolehUbah() ? '<button class="tbl kecil kanan" onclick="formHarga()">+ Catat harga</button>'
      : '') + '</div>' +
    '<p style="font-size:.82rem;color:var(--redup)">Harga dicatat manual dari pasar, ' +
    'pengepul, atau info dinas setempat. Pencatatan rutin membuat Anda punya data tawar ' +
    'sendiri, tidak bergantung kabar mulut ke mulut.</p>';

  if (!harga.length) {
    html += '<div class="kosong"><span class="ik">💹</span>Belum ada catatan harga.</div>';
  } else {
    /* Kelompokkan per komoditas untuk melihat tren */
    var perKom = {};
    harga.forEach(function (h) {
      var k = h.komoditas || '-';
      if (!perKom[k]) perKom[k] = [];
      perKom[k].push(h);
    });
    for (var k in perKom) {
      var daftar = perKom[k];
      var terbaru = daftar[0];
      var sebelum = daftar.length > 1 ? daftar[1] : null;
      var beda = sebelum ? angka(terbaru.hargaPerKg) - angka(sebelum.hargaPerKg) : 0;
      var persen = sebelum && angka(sebelum.hargaPerKg) > 0
        ? Math.round(beda / angka(sebelum.hargaPerKg) * 1000) / 10 : 0;
      html += '<div class="item"><div class="ikon">' +
        (beda > 0 ? '📈' : (beda < 0 ? '📉' : '➖')) + '</div>' +
        '<div class="isi"><b>' + esc(k) + '</b>' +
        '<small>' + esc(terbaru.pasar || '-') + ' · ' + tglIndo(terbaru.tanggal, true) +
        '</small>' +
        (sebelum ? '<small>Sebelumnya Rp ' + rp(sebelum.hargaPerKg) + ' (' +
          tglIndo(sebelum.tanggal) + ')</small>' : '') +
        '</div><div class="nilai"><b>Rp ' + rp(terbaru.hargaPerKg) + '</b><br>' +
        (sebelum ? '<small style="color:' + (beda >= 0 ? 'var(--sukses)' : 'var(--bahaya)') +
          '">' + (beda >= 0 ? '+' : '') + persen + '%</small>' : '') + '</div></div>';
    }

    html += '<hr class="pisah"><div class="gulir"><table><thead><tr><th>Tanggal</th>' +
      '<th>Komoditas</th><th>Pasar</th><th class="angka">Harga/kg</th><th>Sumber</th>' +
      '<th class="takCetak"></th></tr></thead><tbody>';
    for (var i = 0; i < Math.min(harga.length, 60); i++) {
      var h = harga[i];
      html += '<tr><td>' + tglIndo(h.tanggal) + '</td><td>' + esc(h.komoditas) + '</td>' +
        '<td>' + esc(h.pasar || '-') + '</td>' +
        '<td class="angka"><b>' + rp(h.hargaPerKg) + '</b></td>' +
        '<td><small>' + esc(h.sumber || '-') +
        (h.catatan ? '<br>' + esc(h.catatan) : '') + '</small></td>' +
        '<td class="takCetak">' +
        (bolehUbah() ? '<button class="tbl sekunder kecil" onclick="formHarga(\'' +
          jsq(h.id) + '\')">\u270f\ufe0f</button>' : '') + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }
  return html + '</div>';
}

function bagianRotasi() {
  var opsi = (S.data.petak || []).map(function (p) {
    return '<option value="' + esc(p.id) + '">' + esc(p.nama) + ' — ' + esc(p.komoditas) +

function mintaRotasi() {
  var id = ($('rotPetak') || {}).value;
  if (!id) return;
  if (!S.daring) { toast('Saran rotasi memerlukan sambungan internet.', 'galat'); return; }
  var wadah = $('hasilRotasi');
  wadah.innerHTML = '<div class="spanduk biru"><span class="muat"></span>' +
    '<span>Menyusun saran…</span></div>';

  panggil('ai_rotasi', { petakId: id }).then(function (r) {
    var s = r.saran || {};
    var html = '<div class="kartu" style="background:var(--latar);margin:0">';
    if (r.sumber !== 'gemini') {
      html += '<div class="spanduk kuning"><span>ℹ️</span><span>Saran ini berasal dari ' +
        'kaidah rotasi umum yang tertanam di aplikasi, bukan analisis AI.</span></div>';
    }
    var pilihan = s.pilihan || [];
    for (var i = 0; i < pilihan.length; i++) {
      var p = pilihan[i];
      html += '<div class="item"><div class="ikon">' + (p.ikon || '🌱') + '</div>' +
        '<div class="isi"><b>' + esc(p.komoditas) + '</b>' +
        '<small>' + esc(p.alasan || '') + '</small>' +
        (p.catatan ? '<small>' + esc(p.catatan) + '</small>' : '') + '</div>' +
        '<div class="nilai">' + (p.prioritas
          ? '<span class="lencana ' + (i === 0 ? 'hijau' : 'abu') + '">' + esc(p.prioritas) +
            '</span>' : '') + '</div></div>';
    }
    if (s.hindari) {
      html += '<div class="spanduk merah"><span>🚫</span><span><b>Sebaiknya dihindari</b>' +
        esc(s.hindari) + '</span></div>';
    }
    if (s.perbaikanTanah) {
      html += '<div class="spanduk hijau"><span>🌿</span><span><b>Perbaikan tanah</b>' +
        esc(s.perbaikanTanah) + '</span></div>';
    }
    html += '</div>';
    wadah.innerHTML = html;
  }).catch(function (e) {
    wadah.innerHTML = '<div class="spanduk merah"><span>⚠️</span><span>' + esc(e.message) +
      '</span></div>';
  });
}

function tabPenyuluh() {
  var sub = subAktif('penyuluh', 'ringkas');
  var html = pil('penyuluh', [
    { k: 'ringkas', n: 'Ringkasan Kelompok' },

  ], 'ringkas');
  if (sub === 'buletin') html += bagianBuletin();
  else if (sub === 'petani') html += bagianDaftarPetani();
  else html += bagianRingkasKelompok();
  return html;

function bagianRingkasKelompok() {
  var petak = S.data.petak || [];
  var perKelompok = {};
  petak.forEach(function (p) {
    var k = p.kelompok || '(tanpa kelompok)';
    if (!perKelompok[k]) {
      perKelompok[k] = { luas: 0, petak: 0, petani: {}, komoditas: {} };
    }
    perKelompok[k].luas += angka(p.luasM2);
    perKelompok[k].petak++;
    if (p.namaPetani) perKelompok[k].petani[p.namaPetani] = true;
    if (p.komoditas) {
      perKelompok[k].komoditas[p.komoditas] =
        (perKelompok[k].komoditas[p.komoditas] || 0) + angka(p.luasM2);
    }
  });

  var kerusakanAktif = (S.data.kerusakan || []).filter(function (r) {
    return r.status === 'active';
  });
  var jadwalTerlewat = (S.data.jadwal || []).filter(function (j) {
    var sel = selisihHari(hariIni(), j.tanggal);
    return j.status === 'pending' && sel !== null && sel < 0;
  });

  var html = '<div class="kartu"><h3>👥 Ringkasan Wilayah Binaan</h3>';
  var adaKelompok = false;
  for (var k in perKelompok) {
    adaKelompok = true;
    var d = perKelompok[k];
    var jumlahPetani = Object.keys(d.petani).length;
    var komTeratas = [];
    for (var c in d.komoditas) komTeratas.push({ n: c, l: d.komoditas[c] });
    komTeratas.sort(function (a, b) { return b.l - a.l; });
    html += '<div class="item"><div class="ikon">👥</div><div class="isi">' +
      '<b>' + esc(k) + '</b>' +
      '<small>' + d.petak + ' petak · ' + jumlahPetani + ' petani · ' +
      (d.luas / 10000).toFixed(2) + ' ha</small>' +
      '<small>Komoditas utama: ' + komTeratas.slice(0, 3).map(function (x) {
        return esc(x.n) + ' (' + (x.l / 10000).toFixed(2) + ' ha)';
      }).join(', ') + '</small></div></div>';
  }
  if (!adaKelompok) {
    html += '<div class="kosong"><span class="ik">👥</span>Belum ada data kelompok. ' +
      'Isi kolom kelompok pada data petak.</div>';
  }
  html += '</div>';

  if (kerusakanAktif.length) {
    html += '<div class="kartu"><h3>🐛 Perlu kunjungan lapangan</h3>';
    for (var i = 0; i < kerusakanAktif.length; i++) {
      var r = kerusakanAktif[i];
      var p = petakById(r.petakId);
      var wa = p ? nomorWa(p.noHp) : '';
      html += '<div class="item"><div class="ikon">🐛</div><div class="isi">' +
        '<b>' + esc(r.judulGejala) + '</b>' +
        '<small>' + esc(namaPetak(r.petakId)) +
        (p && p.namaPetani ? ' · ' + esc(p.namaPetani) : '') + ' · ' +
        tglIndo(r.tanggal, true) + '</small>' +
        '<small>Tingkat ' + esc(r.tingkat) + ' · ' + angka(r.persenTerdampak) +
        '% area terdampak</small>' +
        '<div class="baris takCetak" style="margin-top:5px">' +
        '<button class="tbl sekunder kecil" onclick="detailKerusakan(\'' + jsq(r.id) +
        '\')">Detail</button>' +
        (wa ? '<button class="tbl sekunder kecil" onclick="bukaTautan(\'https://wa.me/' + wa +
          '\')">💬 Hubungi</button>' : '') + '</div></div></div>';
    }
    html += '</div>';
  }

  if (jadwalTerlewat.length) {
    html += '<div class="spanduk kuning"><span>⏰</span><span><b>' + jadwalTerlewat.length +
      ' jadwal pemupukan terlewat</b>Perlu diingatkan kepada petani bersangkutan. ' +
      'Buka tab Pupuk untuk mengirim pengingat WhatsApp satu per satu.</span></div>';
  }
  return html;
}

/**
 * Meminta peladen menyusun daftar penerima. Peladen mengembalikan tautan
 * wa.me yang sudah berisi teks pesan; pengiriman tetap manual.
 */
function siapkanBuletin(id) {
  if (!S.daring) { toast('Perlu sambungan internet.', 'galat'); return; }
  var b = null;
  (S.data.buletin || []).forEach(function (x) { if (x.id === id) b = x; });
  if (!b) return;

  panggil('buletin_kirim', { item: b }).then(function (r) {
    var daftar = r.penerima || [];
    if (!daftar.length) {
      toast('Tidak ada nomor HP petani yang cocok dengan wilayah sasaran.', 'galat');
      return;
    }
    var html = '<p style="font-size:.83rem">Tekan tombol satu per satu. WhatsApp terbuka ' +
      'dengan pesan yang sudah terisi \u2014 Anda tinggal menekan kirim.</p>' +
      '<div class="spanduk kuning"><span>\u23f1\ufe0f</span><span>Beri jeda beberapa detik ' +
      'antar pengiriman agar nomor Anda tidak ditandai sebagai spam oleh WhatsApp.</span></div>';
    for (var i = 0; i < daftar.length; i++) {
      html += '<div class="item"><div class="ikon">' + (i + 1) + '</div><div class="isi">' +
        '<b>' + esc(daftar[i].nama) + '</b><small>' + esc(daftar[i].nomor) + '</small></div>' +
        '<div class="nilai"><button class="tbl kecil" onclick="bukaTautan(' +
        jsAtr(daftar[i].tautan) + ')">Kirim</button></div></div>';
    }
    html += '<hr class="pisah"><h4>Teks pesan</h4>' +
      '<textarea rows="8" id="teksBuletin" onclick="this.select()">' +
      esc(r.teksPesan) + '</textarea>' +
      '<button class="tbl sekunder lebar" onclick="salinTeks(\'teksBuletin\')">' +
      '\ud83d\udccb Salin untuk ditempel ke grup</button>';
    modalBuka('Kirim buletin \u2014 ' + daftar.length + ' penerima', html);
    muatData(true);
  }).catch(function (e) { toast(e.message, 'galat'); });
}

function bagianDaftarPetani() {
  var petak = S.data.petak || [];
  var petani = {};
  petak.forEach(function (p) {
    var n = p.namaPetani || '(tanpa nama)';
    if (!petani[n]) petani[n] = { nama: n, noHp: p.noHp, kelompok: p.kelompok,
                                  petak: [], luas: 0 };
    petani[n].petak.push(p);
    petani[n].luas += angka(p.luasM2);
    if (!petani[n].noHp && p.noHp) petani[n].noHp = p.noHp;
  });
  var daftar = [];
  for (var n in petani) daftar.push(petani[n]);
  daftar.sort(function (a, b) { return b.luas - a.luas; });

  var html = '<div class="kartu"><h3>Daftar Petani Binaan (' + daftar.length + ')</h3>';
  if (!daftar.length) {
    html += '<div class="kosong"><span class="ik">👨‍🌾</span>Belum ada data petani.</div>';
  } else {
    html += '<div class="gulir"><table><thead><tr><th>Petani</th><th>Kelompok</th>' +
      '<th class="angka">Petak</th><th class="angka">Luas</th>' +
      '<th class="takCetak">Kontak</th></tr></thead><tbody>';
    for (var i = 0; i < daftar.length; i++) {
      var d = daftar[i];
      var wa = nomorWa(d.noHp);
      html += '<tr><td><b>' + esc(d.nama) + '</b><br><small style="color:var(--redup)">' +
        d.petak.map(function (p) { return esc(p.komoditas); }).join(', ') + '</small></td>' +
        '<td>' + esc(d.kelompok || '-') + '</td>' +
        '<td class="angka">' + d.petak.length + '</td>' +
        '<td class="angka">' + (d.luas / 10000).toFixed(3) + ' ha</td>' +
        '<td class="takCetak">' + (wa
          ? '<button class="tbl sekunder kecil" onclick="bukaTautan(\'https://wa.me/' + wa +
            '\')">💬</button>' : '-') + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }
  return html + '</div>';
}

/* ---------- peta dasar (BYOK) ---------- */

/* Rancangan setelan peta yang sedang disunting. Diperlukan karena mengganti
   pilihan penyedia harus menggambar ulang panel (kolom isiannya berbeda-beda),
   sementara render() membaca S.pengaturan yang belum berubah — tanpa ini,
   pilihan selalu melompat kembali ke nilai tersimpan dan kolom URL kustom
   tidak pernah muncul. */
var _petaDraf = null;

function drafPeta() {
  if (!_petaDraf) {
    var p = S.pengaturan || {};
    _petaDraf = {
      petaPenyedia: p.petaPenyedia || 'grid',
      petaKunci: p.petaKunci || '',
      petaGaya: p.petaGaya || 'satelit',
      petaKustomUrl: p.petaKustomUrl || '',
      petaKustomJenis: p.petaKustomJenis || 'xyz',
      petaKustomLapisan: p.petaKustomLapisan || '',
      petaAtribusi: p.petaAtribusi || ''
    };
  }
  return _petaDraf;
}

/** Menyimpan isian yang sedang tampak sebelum panel digambar ulang. */
function serapIsianPeta() {
  var d = drafPeta();
  ['petaKunci', 'petaGaya', 'petaKustomUrl', 'petaKustomJenis',
   'petaKustomLapisan', 'petaAtribusi'].forEach(function (k) {
    var el = $('set_' + k);
    if (el) d[k] = el.value;
  });
  return d;
}

function ubahPenyediaPeta(nilai) {
  serapIsianPeta();
  drafPeta().petaPenyedia = nilai;
  render();
}

function ubahJenisKustom(nilai) {
  serapIsianPeta();
  drafPeta().petaKustomJenis = nilai;
  render();
}

/**
 * Menarik satu ubin sungguhan lalu melaporkan hasilnya. Tanpa ini, satu-satunya
 * cara mengetahui URL salah adalah melihat peta kosong tanpa penjelasan — dan
 * pengguna akan menyangka aplikasinya yang rusak.
 */
function ujiUbinPeta() {
  serapIsianPeta();
  var simpanan = S.pengaturan;
  S.pengaturan = Object.assign({}, simpanan, _petaDraf);
  var ubin = urlUbin();
  S.pengaturan = simpanan;

  var wadah = $('hasilUjiPeta');
  if (!ubin) {
    wadah.innerHTML = '<div class="spanduk kuning"><span>⚠️</span><span>' +
      '<b>Belum ada yang bisa diuji</b>URL atau kunci masih kosong, jadi aplikasi ' +
      'akan menampilkan kisi lokal.</span></div>';
    return;
  }
  if (ubin.wms) {
    var w = uraiWms(ubin.url);
    wadah.innerHTML = '<div class="spanduk biru"><span>ℹ️</span><span><b>Layanan WMS</b>' +
      'Alamat dasar: <code>' + esc(w.dasar) + '</code><br>Lapisan: <code>' +
      esc(ubin.lapisan || w.lapisan || '(kosong — wajib diisi)') + '</code><br>' +
      'Ubin WMS tidak dapat diuji satu per satu; simpan lalu buka tab WebGIS untuk ' +
      'melihat hasilnya.</span></div>';
    return;
  }

  wadah.innerHTML = '<div class="spanduk biru"><span class="muat"></span>' +
    '<span>Menarik satu ubin percobaan…</span></div>';

  /* Ubin pada zoom 12 di sekitar Jawa Barat — cukup untuk membuktikan
     layanan menjawab, tanpa bergantung pada letak kebun pengguna. */
  var contoh = ubin.url.replace('{z}', '12').replace('{x}', '3288')
    .replace('{y}', '2124').replace('{-y}', '1971').replace('{s}', 'a')
    .replace('{r}', '');

  var gambar = new Image();
  var selesai = false;
  var pewaktu = setTimeout(function () {
    if (selesai) return;
    selesai = true;
    wadah.innerHTML = '<div class="spanduk kuning"><span>⏱️</span><span>' +
      '<b>Tidak ada jawaban dalam 10 detik</b>Layanan mungkin lambat, atau alamatnya ' +
      'tidak dapat dijangkau dari jaringan ini.</span></div>';
  }, 10000);

  gambar.onload = function () {
    if (selesai) return;
    selesai = true;
    clearTimeout(pewaktu);
    wadah.innerHTML = '<div class="spanduk hijau"><span>✅</span><span>' +
      '<b>Ubin berhasil dimuat</b>Layanan menjawab dengan gambar ' +
      gambar.naturalWidth + '×' + gambar.naturalHeight + ' piksel. ' +
      'Tekan Simpan, lalu buka tab WebGIS.</span></div>' +
      '<img src="' + esc(contoh) + '" alt="" style="width:128px;height:128px;' +
      'border-radius:8px;border:1px solid var(--garis);margin-top:6px">';
  };
  gambar.onerror = function () {
    if (selesai) return;
    selesai = true;
    clearTimeout(pewaktu);
    wadah.innerHTML = '<div class="spanduk merah"><span>⚠️</span><span>' +
      '<b>Ubin gagal dimuat</b>Yang dicoba:<br><code style="word-break:break-all">' +
      esc(contoh) + '</code><br><br>Yang paling sering menjadi sebab: kunci salah atau ' +
      'sudah habis kuotanya; URL kurang bagian <code>{z}/{x}/{y}</code>; jenis layanan ' +
      'salah pilih (ArcGIS dipilih sebagai XYZ atau sebaliknya); atau layanan menolak ' +
      'permintaan dari alamat situs ini.</span></div>';
  };
  gambar.src = contoh;
}

function simpanSetelanPeta() {
  if (!S.daring) { toast('Mengubah setelan memerlukan sambungan internet.', 'galat'); return; }
  var d = serapIsianPeta();
  var isi = {
    petaPenyedia: d.petaPenyedia,
    petaKunci: d.petaKunci,
    petaGaya: d.petaGaya,
    petaKustomUrl: d.petaKustomUrl,
    petaKustomJenis: d.petaKustomJenis,
    petaKustomLapisan: d.petaKustomLapisan,
    petaAtribusi: d.petaAtribusi
  };

  if (isi.petaPenyedia === 'kustom' && !String(isi.petaKustomUrl).trim()) {
    toast('URL layanan wajib diisi untuk pilihan URL sendiri.', 'galat');
    return;
  }
  if (isi.petaPenyedia === 'kustom' && isi.petaKustomJenis === 'xyz' &&
      String(isi.petaKustomUrl).indexOf('{z}') < 0) {
    toast('URL XYZ harus memuat {z}, {x}, dan {y}. Bila layanan Anda ArcGIS REST, ' +
          'pilih jenis ArcGIS.', 'galat');
    return;
  }

  ubah('setelan_simpan', { pengaturan: isi }, { pesan: 'Setelan peta disimpan.' })
    .then(function () {
      for (var k in isi) S.pengaturan[k] = isi[k];
      _petaDraf = null;
      bersihkanPeta();
      render();
    })
    .catch(function (e) { toast(e.message, 'galat'); });
}

  }, null, 2);

}

function segarkanPaksa() {
  if (!S.daring) { toast('Perlu sambungan internet.', 'galat'); return; }

}

function bersihkanLokal() {
  konfirmasi('Hapus salinan lokal?',
    S.antrean.length
      ? '⚠️ Masih ada ' + S.antrean.length + ' perubahan yang belum terkirim. ' +
        'Perubahan itu akan HILANG permanen.'
      : 'Data di Spreadsheet tidak terpengaruh. Aplikasi akan memuat ulang dari peladen.',
    function () {
      try {
        localStorage.removeItem(LS.data);
        localStorage.removeItem(LS.antrean);
        localStorage.removeItem(LS.chat);
        localStorage.removeItem('tanipintar_pengaturan');
      } catch (e) { /* penyimpanan mungkin dikunci peramban */ }
      S.antrean = [];
      muatData();

        '<td><span class="lencana ' + (u.peran === 'admin' ? 'merah'
          : (u.peran === 'penyuluh' ? 'kuning' : 'abu')) + '">' + esc(u.peran) + '</span></td>' +
        '<td>' + esc(u.kelompok || '-') + '</td>' +

function resetPin(id) {
  var u = null;
  (S.data.pengguna || []).forEach(function (x) { if (x.id === id) u = x; });
  if (!u) return;
  konfirmasi('Setel ulang PIN?',
    'PIN <b>' + esc(u.nama) + '</b> akan dikembalikan ke <b>1234</b>. ' +
    'Sampaikan kepada yang bersangkutan agar segera menggantinya.',
    function () {
      panggil('reset_pin', { id: id }).then(function () {
        toast('PIN dikembalikan ke 1234.', 'sukses');
      }).catch(function (e) { toast(e.message, 'galat'); });
    }, 'Setel ulang');
}

/* ---------- lisensi ---------- */
function bagianLisensi() {
  var l = S.lisensi || {};
  var db = S.database || {};

  var html = '<div class="kartu"><h3>🔐 Status Lisensi</h3>';

  if (l.belumDisetel) {
    html += '<div class="spanduk kuning"><span>🔧</span><span><b>Kunci publik penyedia ' +
      'belum dipasang</b>Berkas <code>Lisensi.gs</code> masih memakai modulus contoh, ' +
      'sehingga pemeriksaan lisensi dilewati. Ini normal saat pengembangan; sebelum dijual, ' +
      'penyedia harus menempelkan modulus kunci publiknya.</span></div>';
  } else if (l.aktif) {
    html += '<div class="spanduk hijau"><span>✅</span><span><b>Lisensi aktif</b>' +
      'Terdaftar atas nama ' + esc(l.pelanggan || '-') + '. ' +
      (l.sampai ? 'Berlaku sampai ' + tglIndo(l.sampai, true) +
        (l.sisaHari !== undefined ? ' (' + l.sisaHari + ' hari lagi)' : '')
        : 'Berlaku selamanya.') + '</span></div>';
  } else if (l.jenis === 'percobaan') {
    html += '<div class="spanduk kuning"><span>⏳</span><span><b>Masa percobaan</b>' +
      'Tersisa ' + angka(l.sisaHari) + ' hari, dengan batas ' + angka(l.batasPetak) +
      ' petak. Saat ini terpakai ' + (S.data.petak || []).length + ' petak.</span></div>';
  } else {
    html += '<div class="spanduk merah"><span>🔒</span><span><b>Lisensi tidak aktif</b>' +
      esc(l.pesan || 'Masa percobaan berakhir.') + ' Data lama tetap dapat dibaca dan ' +
      'dicetak, tetapi pencatatan baru dikunci sampai lisensi diaktifkan.</span></div>';
  }

  html += '<hr class="pisah"><h4>ID Database Anda</h4>' +
    '<p style="font-size:.82rem;color:var(--redup)">Kunci lisensi diikat pada ID ini. ' +
    'Kirimkan kepada penyedia saat memesan lisensi — kunci yang diterbitkan tidak akan ' +
    'berfungsi pada Spreadsheet lain.</p>' +
    '<textarea rows="2" id="idDb" onclick="this.select()" readonly>' + esc(db.id || '') +
    '</textarea>' +
    '<div class="baris" style="margin-top:6px">' +
    '<button class="tbl sekunder kecil" onclick="salinTeks(\'idDb\')">📋 Salin ID</button>' +
    (S.pengaturan.noWaPenyedia
      ? '<button class="tbl kecil" onclick="pesanLisensiWa()">💬 Kirim ke penyedia</button>'
      : '') + '</div>';

  html += '<hr class="pisah"><h4>Aktivasi</h4>' +
    '<label class="ruas"><span class="nama">Tempel kunci lisensi</span>' +
    '<textarea rows="5" id="kunciLisensi" placeholder="TPTR1.xxxxx.yyyyy"></textarea>' +
    '<span class="bantu">Kunci berupa satu blok teks panjang. Tempel apa adanya, ' +
    'termasuk bila terpotong beberapa baris.</span></label>' +
    '<button class="tbl lebar" onclick="aktifkanLisensi()">Aktifkan lisensi</button>' +
    '<div id="hasilLisensi" style="margin-top:10px"></div>';

  if (l.aktif) {
    html += '<hr class="pisah"><div class="kisi kisi2">' +
      barisInfo('Pelanggan', l.pelanggan) + barisInfo('Paket', l.paket) +
      barisInfo('Berlaku sampai', l.sampai ? tglIndo(l.sampai, true) : 'Tanpa batas waktu') +
      barisInfo('Sisa waktu', l.sisaHari === null || l.sisaHari === undefined
        ? 'Tanpa batas' : angka(l.sisaHari) + ' hari') +
      barisInfo('Batas petak', l.batasPetak ? angka(l.batasPetak) : 'Tanpa batas') +
      barisInfo('Terikat database', l.terikatDb ? 'Ya — hanya berlaku di spreadsheet ini'
        : 'Tidak') + '</div>';
  }

  html += '</div>';
  return html;
}

function pesanLisensiWa() {
  var wa = nomorWa(S.pengaturan.noWaPenyedia);
  if (!wa) { toast('Nomor penyedia belum disetel.', 'galat'); return; }
  var pesan = 'Halo, saya ingin memesan lisensi TaniPintar.\n\n' +
    'Nama: ' + (S.pengaturan.namaKelompok || (S.pengguna ? S.pengguna.nama : '')) + '\n' +
    'ID Database: ' + ((S.database || {}).id || '') + '\n' +
    'Jumlah petak saat ini: ' + (S.data.petak || []).length + '\n\n' +
    'Mohon informasi paket dan cara pembayarannya. Terima kasih.';
  bukaTautan('https://wa.me/' + wa + '?text=' + encodeURIComponent(pesan));
}

function aktifkanLisensi() {
  var kunci = String(($('kunciLisensi') || {}).value || '').replace(/\s+/g, '');
  var wadah = $('hasilLisensi');
  if (!kunci) { toast('Tempel kunci lisensi terlebih dahulu.', 'galat'); return; }
  if (!S.daring) { toast('Aktivasi memerlukan sambungan internet.', 'galat'); return; }

  wadah.innerHTML = '<div class="spanduk biru"><span class="muat"></span>' +
    '<span>Memeriksa kunci…</span></div>';

  panggil('lisensi_aktifkan', { kunci: kunci }).then(function (r) {
    wadah.innerHTML = '<div class="spanduk hijau"><span>✅</span><span><b>Lisensi aktif</b>' +
      'Terdaftar atas nama ' + esc(r.pelanggan || '-') + '.</span></div>';
    return muatData();
  }).catch(function (e) {
    var pesan = String(e.message || '').toLowerCase();
    var saran;
    if (pesan.indexOf('database lain') >= 0) {
      saran = 'Kirim ulang ID Database Anda kepada penyedia agar kunci diterbitkan ulang ' +
        'untuk spreadsheet ini.';
    } else if (pesan.indexOf('kedaluwarsa') >= 0) {
      saran = 'Hubungi penyedia untuk perpanjangan.';
    } else if (pesan.indexOf('tanda tangan') >= 0) {
      saran = 'Kunci ini bukan terbitan penyedia aplikasi Anda.';
    } else if (pesan.indexOf('kunci publik') >= 0) {
      saran = 'Penyedia belum memasang kunci publiknya di berkas Lisensi.gs.';
    } else {
      saran = 'Pastikan kunci disalin utuh, termasuk tanda titik di tengahnya.';
    }
    wadah.innerHTML = '<div class="spanduk merah"><span>⚠️</span><span><b>' +
      esc(e.message) + '</b>' + esc(saran) + '</span></div>';
  });
}


/* ============================================================
   FORMULIR PEMASUKAN DATA
   Semua formulir memakai bentukRuas() + modalBuka() sehingga
   perilaku tombol, penyimpanan, dan penanganan galat seragam.

/** Penghapusan generik dengan konfirmasi — dipakai semua tab. */
function hapusUmum(aksi, id, sebutan) {
  konfirmasi('Hapus ' + sebutan + '?',
    'Baris ini akan dihapus dari Spreadsheet dan tidak bisa dikembalikan dari dalam aplikasi.',
    function () {
      ubah(aksi, { id: id }, { pesan: 'Terhapus.' })
        .catch(function (e) { toast(e.message, 'galat'); });
    }, 'Hapus', true);
}

function opsiPetak(kosong) {
  var o = [];
  if (kosong) o.push({ v: '', l: kosong });
  (S.data.petak || []).forEach(function (p) { o.push({ v: p.id, l: p.nama }); });
  return o;
}

function opsiKomoditas() {
  var o = [];
  (S.data.komoditas || []).forEach(function (k) { o.push({ v: k.nama, l: k.nama }); });
  if (!o.length) o.push({ v: '', l: '(belum ada komoditas)' });
  return o;
}

function cariById(nama, id) {
  var d = S.data[nama] || [];
  for (var i = 0; i < d.length; i++) if (String(d[i].id) === String(id)) return d[i];
  return null;
}

        : 'Isi manual, atau gambar batas petak di peta agar terhitung otomatis.' },

    { k: 'fase', n: 'Fase pertumbuhan', t: 'pilih',
      opsi: ['persiapan', 'vegetatif', 'pembungaan', 'pembuahan', 'siap_panen', 'bera'] },
    { k: 'statusLahan', n: 'Status lahan', t: 'pilih', opsi: ['Aktif', 'Tidak Aktif'] },
    { k: 'ph', n: 'pH tanah', t: 'angka', langkah: '0.1' },
    { k: 'kelembapan', n: 'Kelembapan (%)', t: 'angka' },
    { k: 'bahanOrganik', n: 'Bahan organik (%)', t: 'angka', langkah: '0.1' },
    { k: 'catatan', n: 'Catatan', t: 'area' },
    { k: 'x_gaya', t: 'info', warna: 'biru',
      isi: '<span>🎨</span><span><b>Tampilan batas di peta</b>Dikosongkan berarti ' +
        'warna mengikuti fase pertumbuhan. Isi sendiri bila Anda ingin membedakan ' +
        'blok, pemilik, atau petak yang sudah disurvei.</span>' },
    { k: 'warnaGaris', n: 'Warna garis batas', t: 'warna',
      help: 'Kosongkan untuk mengikuti warna fase.' },
    { k: 'tebalGaris', n: 'Tebal garis (piksel)', t: 'angka',
      help: 'Kosong atau 0 berarti 2 piksel. Batas atas 12.' },

/** Mengisi perkiraan panen dari siklus komoditas saat tanggal tanam berubah. */
function isiPerkiraanPanen() {
  var tanam = ($('f_tanggalTanam') || {}).value;
  var kom = ($('f_komoditas') || {}).value;
  var el = $('f_perkiraanPanen');
  if (!tanam || !el) return;
  var k = komoditasByNama(kom);
  var siklus = k ? angka(k.siklusHari, 90) : 90;
  el.value = tambahHari(tanam, siklus);
  var bantu = $('f_help_perkiraanPanen');
  if (bantu) {
    bantu.textContent = 'Dihitung dari siklus ' + siklus + ' hari untuk ' +
      (kom || 'komoditas ini') + '. Boleh diubah manual.';
  }
}

function formPanen(id) {
  var h = id ? cariById('panen', id) : null;
  var awal = h ? JSON.parse(JSON.stringify(h)) : {
    tanggal: hariIni(), mutu: 'Grade A', statusBayar: 'Lunas'
  };

  var opsiPembeli = [{ v: '', l: '— tidak dicatat —' }];

  ];

function isiKomoditasDariPetak() {
  var id = ($('f_petakId') || {}).value;
  var p = petakById(id);
  if (!p) return;
  if ($('f_komoditas') && !$('f_komoditas').value) $('f_komoditas').value = p.komoditas || '';
  var kom = komoditasByNama(p.komoditas);
  if (kom && $('f_hargaPerKg') && !angka($('f_hargaPerKg').value)) {
    $('f_hargaPerKg').value = angka(kom.hargaPerKg);
    hitungTotalPanen();
  }
}

function hitungTotalPanen() {
  var kg = angka(($('f_jumlahKg') || {}).value);
  var harga = angka(($('f_hargaPerKg') || {}).value);
  var el = $('f_totalPendapatan');
  if (el) el.value = Math.round(kg * harga);
  sesuaikanDibayar();
}

function isiNamaPembeli() {
  var id = ($('f_pembeliId') || {}).value;
  var p = null;
  (S.data.pembeli || []).forEach(function (x) { if (x.id === id) p = x; });
  if (p && $('f_pembeli')) $('f_pembeli').value = p.nama;
}

function sesuaikanDibayar() {
  var status = ($('f_statusBayar') || {}).value;
  var total = angka(($('f_totalPendapatan') || {}).value);
  var el = $('f_sudahDibayar');
  if (!el) return;
  if (status === 'Lunas') el.value = total;
  else if (status === 'Belum Bayar') el.value = 0;
}

function formBayar(idPanen) {
  var p = cariById('panen', idPanen);
  if (!p) return;
  var sisa = angka(p.totalPendapatan) - angka(p.sudahDibayar);

  var ruas = [

function pisahBaris(teks) {

  String(teks || '').split('\n').forEach(function (b) {
    var t = b.replace(/^\s*[-•*\d.)\s]+/, '').trim();
    if (t) hasil.push(t);
  });
  return hasil;
}

/* ============================================================
   INISIALISASI
   ============================================================ */

function mulai() {
  /* Pulihkan keadaan dari perangkat sebelum apa pun digambar,
     supaya aplikasi langsung berguna walau dibuka tanpa sinyal. */
  S.mode = bacaLokal(LS.mode, 'terang');
  terapkanMode();
  S.token = bacaLokal(LS.token, '') || '';
  S.pengguna = bacaLokal(LS.pengguna, null);
  S.antrean = bacaLokal(LS.antrean, []) || [];
  S.data = bacaLokal(LS.data, {}) || {};
  S.pengaturan = bacaLokal('tanipintar_pengaturan', {}) || {};
  _chatRiwayat = bacaLokal(LS.chat, []) || [];

  var tblMode = $('tblMode');
  if (tblMode) tblMode.onclick = gantiMode;
  var tblProfil = $('tblProfil');
  if (tblProfil) tblProfil.onclick = bukaProfil;

  /* Tab awal dari alamat, supaya tautan langsung ke satu tab bisa dibagikan. */
  var hash = String(location.hash || '').replace('#', '');
  if (hash) {
    var bagian = hash.split('/');
    S.tab = bagian[0];
    if (bagian[1]) S.subtab[bagian[0]] = bagian[1];
  }

  window.addEventListener('online', function () {
    S.daring = true;
    render();
    sinkron();
  });
  window.addEventListener('offline', function () {
    S.daring = false;
    toast('Sambungan terputus. Aplikasi lanjut bekerja luring.');
    render();
  });

  /* hashchange sengaja TIDAK dipasang: popstate sudah menangani semuanya,
     dan memasang keduanya membuat satu tekan Kembali diproses dua kali. */
  pasangTombolKembali();

  /* Langkah riwayat pertama diganti, bukan didorong. Bila didorong, akan
     ada satu langkah kosong di bawahnya — pengguna harus menekan Kembali
     dua kali sebelum aplikasi benar-benar tertutup. */
  gantiRiwayat();

  document.addEventListener('keydown', function (e) {
    if (galeriTerbuka()) {
      if (e.key === 'Escape') { tutupGaleri(); return; }
      if (e.key === 'ArrowLeft') { geserGaleri(-1); return; }
      if (e.key === 'ArrowRight') { geserGaleri(1); return; }
      return;
    }
    if (e.key === 'Escape') modalTutup();
  });
  pasangEnterMenyeluruh();
  pasangKosongkanMenyeluruh();

  perbaruiTombolProfil();
  bangunNav();

  if (!S.token) {
    render();
    return;
  }

  /* Tampilkan salinan lokal lebih dulu, baru segarkan dari peladen.
     Petani melihat datanya dalam sekejap, bukan layar kosong. */
  if (S.data && S.data.petak) {
    S.siap = true;
    render();
  }
  muatData().then(function () {
    if (S.antrean.length && S.daring) sinkron();
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', mulai);
} else {
  mulai();
}


/* ============================================================
   MANAJEMEN PER POKOK
   ============================================================
   Dimuat per petak, bukan sekaligus. Satu kebun sawit 20 ha
   berisi ±2.900 pokok; mengirim semuanya setiap kali aplikasi
   dibuka akan membuat pemuatan berat di jaringan desa.
   ============================================================ */

var _pokok = { petakId: '', daftar: [], catatan: [], ringkasan: null, dipilih: {} };

var POKOK_WARNA = {
  produktif: '#3F7D46',
  belum_produktif: '#7FA96B',
  sakit: '#C08A2E',
  mati: '#B4432E',
  kosong: '#8B9382'
};
var POKOK_LABEL = {
  produktif: 'Produktif',
  belum_produktif: 'Belum produktif',
  sakit: 'Sakit',
  mati: 'Mati',
  kosong: 'Titik kosong'
};

/**
 * Tanaman semusim tidak dicatat per pokok. Ini bukan pembatasan
 * teknis melainkan anjuran pemakaian: satu petak cabai berisi ribuan
 * tanaman yang dibongkar tiap musim, dan mencatatnya satu per satu
 * tidak mengubah satu pun keputusan.
 */
var POKOK_KOMODITAS_TAHUNAN = ['sawit', 'kelapa', 'durian', 'alpukat', 'kopi', 'kakao',
  'jeruk', 'mangga', 'karet', 'rambutan', 'manggis', 'lengkeng', 'pala', 'cengkeh',
  'kayu', 'jambu', 'nangka', 'petai', 'melinjo', 'vanili', 'lada'];


function komoditasTahunan(namaKomoditas) {
  var n = String(namaKomoditas || '').toLowerCase();
  for (var i = 0; i < POKOK_KOMODITAS_TAHUNAN.length; i++) {
    if (n.indexOf(POKOK_KOMODITAS_TAHUNAN[i]) >= 0) return true;
  }
  return false;
}

/** Jarak tanam lazim, dipakai sebagai isian awal formulir. */
var POKOK_JARAK_KLIEN = {
  'sawit': { dalam: 9.4, pola: 'segitiga' },
  'kelapa': { dalam: 8, pola: 'segitiga' },
  'durian': { dalam: 10, pola: 'persegi' },
  'alpukat': { dalam: 8, pola: 'persegi' },
  'kopi': { dalam: 2.5, pola: 'persegi' },
  'kakao': { dalam: 3, pola: 'persegi' },
  'jeruk': { dalam: 5, pola: 'persegi' },
  'mangga': { dalam: 8, pola: 'persegi' },
  'karet': { dalam: 6, pola: 'persegi' }
};

function jarakLazim(namaKomoditas) {
  var n = String(namaKomoditas || '').toLowerCase();
  for (var k in POKOK_JARAK_KLIEN) {
    if (n.indexOf(k) >= 0) return POKOK_JARAK_KLIEN[k];
  }
  return { dalam: 8, pola: 'persegi' };
}

/* ------------------------------------------------------------
   PEMUATAN
   ------------------------------------------------------------ */

function bukaPokok(petakId) {
  var petak = petakById(petakId);
  if (!petak) return;
  modalTutupLalu(function () { lanjutBukaPokok(petakId); });
}

function lanjutBukaPokok(petakId) {

  if (!S.daring && _pokok.petakId !== petakId) {
    toast('Data pokok dimuat dari peladen dan belum tersedia luring untuk petak ini.',
          'galat');
    return;
  }

  S.pokokPetak = petakId;
  if (_pokok.petakId !== petakId) {
    _pokok = { petakId: petakId, daftar: [], catatan: [], ringkasan: null, dipilih: {} };
  }
  if (S.tab === 'pokok') {
    // Sudah di tab Pokok, hanya petaknya yang berganti — riwayat tetap
    // dicatat supaya Kembali mengembalikan pilihan petak sebelumnya.
    dorongRiwayat();
    render();
  } else {
    pindah('pokok');
  }
  muatPokok(petakId);
}

function muatPokok(petakId, diam) {
  if (!S.daring) return Promise.resolve();
  if (!diam) {
    var w = $('isiPokok');
    if (w) {
      w.innerHTML = '<div class="spanduk biru"><span class="muat"></span>' +
        '<span>Memuat data pokok…</span></div>';
    }
  }
  return panggil('pokok_daftar', { petakId: petakId }).then(function (r) {
    _pokok.petakId = petakId;
    _pokok.daftar = r.pokok || [];
    _pokok.catatan = r.catatan || [];
    _pokok.catatanTotal = r.catatanTotal || 0;
    _pokok.ringkasan = r.ringkasan || null;
    render();
  }).catch(function (e) {
    var w2 = $('isiPokok');
    if (w2) {
      w2.innerHTML = '<div class="spanduk merah"><span>⚠️</span><span>' +
        esc(e.message) + '</span></div>';
    }
  });
}

function tabPokok() {

  var html = '<div class="kartu takCetak"><div class="baris">' +
    '<label class="ruas" style="flex:1;margin:0"><span class="nama">Petak</span>' +

    (terpilih ? '<button class="tbl sekunder kecil" style="align-self:flex-end" ' +
      'onclick="muatPokok(S.pokokPetak)">🔄 Muat ulang</button>' : '') +

  if (!terpilih) {
    html += '<div class="kartu"><div class="kosong"><span class="ik">🌳</span>' +
      'Pilih petak untuk melihat daftar pokoknya.</div>' +
      '<div class="spanduk biru"><span>ℹ️</span><span><b>Untuk apa pencatatan per pokok' +
      '</b>Pada tanaman tahunan — sawit, durian, kopi, kakao, kelapa — setiap pohon ' +
      'hidup puluhan tahun dan punya riwayat sendiri. Mencatat per pokok membuat Anda ' +
      'tahu pohon mana yang harus disulam, mana yang tidak lagi menutupi biaya ' +
      'perawatannya, dan berapa sebenarnya jumlah pohon hidup di kebun.<br><br>' +
      'Untuk tanaman semusim seperti cabai atau padi, pencatatan cukup di tingkat petak.' +
      '</span></div></div>';
    return html + '</div>';
  }

  var p = petakById(terpilih);
  if (!p) return html + '</div>';

  if (!_pokok.ringkasan && _pokok.petakId !== terpilih) {
    html += '<div class="kartu"><div class="kosong"><span class="muat"></span>' +
      'Memuat…</div></div>';
    return html + '</div>';
  }

  var sub = subAktif('pokok', 'ringkas');
  html += pil('pokok', [
    { k: 'ringkas', n: 'Ringkasan' },
    { k: 'daftar', n: 'Daftar Pokok' },
    { k: 'peta', n: 'Peta Pokok' },
    { k: 'sensus', n: 'Sensus & Panen' }
  ], 'ringkas');

  if (!_pokok.daftar.length) {
    html += bagianPokokKosong(p);
  } else if (sub === 'daftar') {
    html += bagianPokokDaftar(p);
  } else if (sub === 'peta') {
    html += bagianPokokPeta(p);
  } else if (sub === 'sensus') {
    html += bagianPokokSensus(p);
  } else {
    html += bagianPokokRingkas(p);
  }

  return html + '</div>';
}

function pilihPetakPokok(id) {
  if (String(S.pokokPetak || '') === String(id)) return;
  S.pokokPetak = id;
  _pokok = { petakId: '', daftar: [], catatan: [], ringkasan: null, dipilih: {} };
  dorongRiwayat();
  render();
  if (id) muatPokok(id);
}
